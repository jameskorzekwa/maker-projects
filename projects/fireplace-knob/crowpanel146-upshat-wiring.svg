<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1100" height="860" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold">Basement fireplace knob: CrowPanel 1.46 + Waveshare UPS HAT (C)</text>
  <text x="550" y="58" text-anchor="middle" fill="#555">Pin-to-pin wiring. Firmware: hw-crowpanel146.yaml (INA219 at 0x43, 0.01 ohm shunt)</text>

  <!-- ===== HAT, component side up ===== -->
  <text x="40" y="96" font-weight="bold" font-size="16">UPS HAT (C), battery/component side up (switch on the LEFT, micro-USB on the RIGHT)</text>
  <rect x="40" y="110" width="620" height="290" rx="14" fill="#1e5aa8" stroke="#0d3570" stroke-width="2"/>
  <!-- mounting holes -->
  <circle cx="75" cy="145" r="14" fill="#fff"/><circle cx="625" cy="145" r="14" fill="#fff"/>
  <circle cx="75" cy="365" r="14" fill="#fff"/><circle cx="625" cy="365" r="14" fill="#fff"/>
  <!-- switch -->
  <rect x="10" y="200" width="70" height="110" fill="#bbb" stroke="#555"/>
  <rect x="0" y="242" width="16" height="26" fill="#222"/>
  <text x="45" y="190" text-anchor="middle" fill="#fff" font-size="12">ON</text>
  <text x="45" y="330" text-anchor="middle" fill="#fff" font-size="12">OFF</text>
  <text x="100" y="258" fill="#fff" font-size="12">power switch → ON</text>
  <!-- battery socket -->
  <rect x="520" y="125" width="60" height="42" fill="#f5f5f5" stroke="#999"/>
  <text x="550" y="151" text-anchor="middle" font-size="11">BAT</text>
  <text x="590" y="140" fill="#fff" font-size="13" font-weight="bold">+</text>
  <text x="508" y="140" fill="#fff" font-size="13" font-weight="bold">−</text>
  <text x="550" y="186" text-anchor="middle" fill="#fff" font-size="11">PH2.0, check +/− silkscreen</text>
  <!-- shunt -->
  <rect x="420" y="128" width="30" height="55" fill="#222"/>
  <text x="435" y="200" text-anchor="middle" fill="#fff" font-size="11">R010</text>
  <!-- usb -->
  <rect x="620" y="215" width="55" height="40" fill="#ccc" stroke="#555"/>
  <text x="647" y="275" text-anchor="middle" fill="#fff" font-size="11">USB in</text>

  <!-- pogo block: edge row at the bottom edge -->
  <text x="420" y="248" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">6 pogo pins</text>
  <!-- inner row -->
  <circle cx="370" cy="300" r="15" fill="#e8b923" stroke="#7a5a00" stroke-width="2"/>
  <circle cx="420" cy="300" r="15" fill="#e8b923" stroke="#7a5a00" stroke-width="2"/>
  <circle cx="470" cy="300" r="15" fill="#e8b923" stroke="#7a5a00" stroke-width="2"/>
  <!-- edge row -->
  <circle cx="370" cy="350" r="15" fill="#e8b923" stroke="#7a5a00" stroke-width="2"/>
  <circle cx="420" cy="350" r="15" fill="#e8b923" stroke="#7a5a00" stroke-width="2"/>
  <circle cx="470" cy="350" r="15" fill="#e8b923" stroke="#7a5a00" stroke-width="2"/>
  <text x="370" y="305" text-anchor="middle" font-size="13" font-weight="bold">A</text>
  <text x="420" y="305" text-anchor="middle" font-size="13" font-weight="bold">B</text>
  <text x="470" y="305" text-anchor="middle" font-size="13" font-weight="bold">C</text>
  <text x="370" y="355" text-anchor="middle" font-size="13" font-weight="bold">D</text>
  <text x="420" y="355" text-anchor="middle" font-size="13" font-weight="bold">E</text>
  <text x="470" y="355" text-anchor="middle" font-size="13" font-weight="bold">F</text>
  <text x="500" y="305" fill="#fff" font-size="11">inner row</text>
  <text x="500" y="355" fill="#fff" font-size="11">row along board edge</text>
  <text x="350" y="395" fill="#fff" font-size="11">← toward switch          toward USB →</text>

  <!-- ===== Pin table ===== -->
  <text x="700" y="96" font-weight="bold" font-size="16">Pogo pin functions</text>
  <g font-size="13">
    <rect x="700" y="108" width="370" height="28" fill="#eee"/>
    <text x="710" y="127" font-weight="bold">Pin</text><text x="760" y="127" font-weight="bold">HAT signal</text><text x="880" y="127" font-weight="bold">(Pi header pin)</text>
    <text x="710" y="157">A</text><text x="760" y="157" fill="#7b1fa2" font-weight="bold">SCL</text><text x="880" y="157">pin 5</text>
    <text x="710" y="183">B</text><text x="760" y="183" fill="#1976d2" font-weight="bold">SDA</text><text x="880" y="183">pin 3</text>
    <text x="710" y="209">C</text><text x="760" y="209" fill="#f57c00" font-weight="bold">3.3V (INA219 Vs only)</text><text x="1000" y="209">pin 1</text>
    <text x="710" y="235">D</text><text x="760" y="235" font-weight="bold">GND</text><text x="880" y="235">pin 6</text>
    <text x="710" y="261">E</text><text x="760" y="261" fill="#d32f2f" font-weight="bold">5V OUT</text><text x="880" y="261">pin 4</text>
    <text x="710" y="287">F</text><text x="760" y="287" fill="#d32f2f" font-weight="bold">5V OUT</text><text x="880" y="287">pin 2</text>
  </g>
  <text x="700" y="318" font-size="12" fill="#555">Positions follow the Pi Zero header the pins mate with.</text>
  <text x="700" y="336" font-size="12" fill="#c62828" font-weight="bold">Confirm with a meter before wiring (check box below).</text>

  <!-- ===== Connection table ===== -->
  <text x="40" y="450" font-weight="bold" font-size="18">Wire list</text>
  <g font-size="14">
    <rect x="40" y="462" width="1030" height="30" fill="#eee"/>
    <text x="50" y="482" font-weight="bold">HAT</text>
    <text x="300" y="482" font-weight="bold">→ CrowPanel</text>
    <text x="640" y="482" font-weight="bold">What it does</text>

    <rect x="40" y="496" width="12" height="22" fill="#d32f2f"/>
    <text x="60" y="512">Pogo E or F  (5V OUT)</text>
    <text x="300" y="512">USB-C pigtail <tspan font-weight="bold">red</tspan> (VBUS) → knob USB-C</text>
    <text x="640" y="512">powers the knob</text>

    <rect x="40" y="526" width="12" height="22" fill="#000"/>
    <text x="60" y="542">Pogo D  (GND)</text>
    <text x="300" y="542">USB-C pigtail <tspan font-weight="bold">black</tspan> (GND) → knob USB-C</text>
    <text x="640" y="542">power return</text>

    <rect x="40" y="556" width="12" height="22" fill="#f57c00"/>
    <text x="60" y="572">Pogo C  (3.3V)</text>
    <text x="300" y="572">I2C socket <tspan font-weight="bold">5V</tspan> pin</text>
    <text x="640" y="572">powers the HAT's INA219 (3.0–5.5 V OK)</text>

    <rect x="40" y="586" width="12" height="22" fill="#1976d2"/>
    <text x="60" y="602">Pogo B  (SDA)</text>
    <text x="300" y="602">I2C socket <tspan font-weight="bold">SDA</tspan> pin (GPIO38)</text>
    <text x="640" y="602">I2C data</text>

    <rect x="40" y="616" width="12" height="22" fill="#7b1fa2"/>
    <text x="60" y="632">Pogo A  (SCL)</text>
    <text x="300" y="632">I2C socket <tspan font-weight="bold">SCL</tspan> pin (GPIO39)</text>
    <text x="640" y="632">I2C clock</text>

    <rect x="40" y="646" width="12" height="22" fill="#000"/>
    <text x="60" y="662">Pogo D  (GND)</text>
    <text x="300" y="662">I2C socket <tspan font-weight="bold">GND</tspan> pin</text>
    <text x="640" y="662">I2C ground (2nd wire on D)</text>

    <rect x="40" y="676" width="12" height="22" fill="#b58900"/>
    <text x="60" y="692">BAT socket</text>
    <text x="300" y="692">EEMB LP103454: red → +, black → −</text>
    <text x="640" y="692">battery (switch OFF while plugging in)</text>

    <rect x="40" y="706" width="12" height="22" fill="#336"/>
    <text x="60" y="722">USB in</text>
    <text x="300" y="722">your 5 V USB charger</text>
    <text x="640" y="722">charging + pass-through; knob USB-C gets nothing else</text>
  </g>

  <!-- ===== Checks ===== -->
  <rect x="40" y="745" width="1030" height="105" fill="#fff3e0" stroke="#f57c00"/>
  <text x="55" y="768" font-weight="bold">Meter check before soldering (battery in, switch ON, nothing else connected)</text>
  <text x="55" y="790" font-size="13">1. Black probe on the micro-USB shell. E and F read ~5.1 V. D beeps to the shell (GND). A, B, C read ~0 V.</text>
  <text x="55" y="810" font-size="13">2. If the ~5 V pair and GND are on the inner row, or GND is at the USB end, the drawing is mirrored: tell Claude before wiring.</text>
  <text x="55" y="830" font-size="13">3. Never connect the knob's I2C-socket 5V to E/F. Solder to the pogo-pin pads on the back of the board, not the spring tips.</text>
  <text x="55" y="846" font-size="13">4. First test: unplug USB → HA "Battery Current" must go negative; if positive, set ina_sign: "-1.0f".</text>
</svg>
