<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold">Basement fireplace knob: CrowPanel 1.46 + Waveshare UPS HAT (C)</text>
  <text x="500" y="58" text-anchor="middle" fill="#555">Charging, 5 V power and battery monitoring all on the HAT. Firmware: hw-crowpanel146.yaml (INA219 0x43, 0.01 ohm)</text>

  <!-- Battery -->
  <rect x="40" y="110" width="180" height="110" rx="8" fill="#fff4d6" stroke="#b58900" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" font-weight="bold">LiPo battery</text>
  <text x="130" y="162" text-anchor="middle">EEMB LP103454</text>
  <text x="130" y="182" text-anchor="middle">3.7 V 2000 mAh</text>
  <text x="130" y="205" text-anchor="middle" fill="#555" font-size="12">red = +, black = −</text>

  <!-- USB supply -->
  <rect x="40" y="420" width="180" height="80" rx="8" fill="#eef" stroke="#336" stroke-width="2"/>
  <text x="130" y="452" text-anchor="middle" font-weight="bold">USB power supply</text>
  <text x="130" y="474" text-anchor="middle">5 V, ≥ 2 A</text>

  <!-- UPS HAT -->
  <rect x="340" y="90" width="300" height="440" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-weight="bold" font-size="17">Waveshare UPS HAT (C)</text>
  <text x="490" y="138" text-anchor="middle" fill="#555" font-size="12">ETA6003 charger · TPS61088 5 V boost · INA219 @ 0x43</text>
  <!-- HAT battery connector -->
  <rect x="350" y="150" width="130" height="60" fill="#fff" stroke="#2e7d32"/>
  <text x="415" y="170" text-anchor="middle" font-size="12" font-weight="bold">Battery (PH2.0)</text>
  <text x="415" y="188" text-anchor="middle" font-size="12">+ (sch. P1 pin 2)</text>
  <text x="415" y="204" text-anchor="middle" font-size="12">− (sch. P1 pin 1)</text>
  <!-- HAT USB in -->
  <rect x="350" y="430" width="130" height="50" fill="#fff" stroke="#2e7d32"/>
  <text x="415" y="452" text-anchor="middle" font-size="12" font-weight="bold">USB in (charge)</text>
  <text x="415" y="470" text-anchor="middle" font-size="12">micro-USB / USB-C</text>
  <!-- switch -->
  <rect x="350" y="300" width="130" height="50" fill="#fff" stroke="#2e7d32"/>
  <text x="415" y="321" text-anchor="middle" font-size="12" font-weight="bold">Slide switch</text>
  <text x="415" y="339" text-anchor="middle" font-size="12" fill="#c62828">must be ON (boost)</text>
  <!-- HAT 2x3 header -->
  <rect x="510" y="200" width="120" height="200" fill="#fff" stroke="#2e7d32"/>
  <text x="570" y="220" text-anchor="middle" font-size="12" font-weight="bold">2×3 header</text>
  <text x="520" y="250" font-size="13">3.3V (INA Vs)</text>
  <text x="520" y="280" font-size="13">SDA</text>
  <text x="520" y="310" font-size="13">SCL</text>
  <text x="520" y="340" font-size="13" font-weight="bold">5V out</text>
  <text x="520" y="370" font-size="13" font-weight="bold">GND</text>
  <text x="520" y="392" font-size="11" fill="#555">(2nd 5V pin unused)</text>

  <!-- Knob -->
  <rect x="770" y="140" width="200" height="340" rx="100" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="870" y="190" text-anchor="middle" font-weight="bold">CrowPanel 1.46</text>
  <text x="870" y="208" text-anchor="middle" font-size="12">DHR55146D V1.2</text>
  <rect x="790" y="225" width="160" height="125" fill="#fff" stroke="#6a1b9a"/>
  <text x="870" y="243" text-anchor="middle" font-size="12" font-weight="bold">I2C socket (MX1.25)</text>
  <text x="800" y="265" font-size="13">5V (GPIO2 switched)</text>
  <text x="800" y="288" font-size="13">SDA (GPIO38)</text>
  <text x="800" y="311" font-size="13">SCL (GPIO39)</text>
  <text x="800" y="334" font-size="13">GND</text>
  <rect x="800" y="390" width="140" height="40" fill="#fff" stroke="#6a1b9a"/>
  <text x="870" y="415" text-anchor="middle" font-size="12" font-weight="bold">USB-C (power in)</text>
  <text x="870" y="460" text-anchor="middle" font-size="11" fill="#555">J8 BAT pads: leave empty</text>

  <!-- Wires -->
  <!-- battery -->
  <polyline points="220,160 300,160 300,182 350,182" fill="none" stroke="#d32f2f" stroke-width="3"/>
  <polyline points="220,195 290,195 290,199 350,199" fill="none" stroke="#000" stroke-width="3"/>
  <!-- USB supply -->
  <line x1="220" y1="455" x2="350" y2="455" stroke="#336" stroke-width="3"/>
  <text x="285" y="447" text-anchor="middle" font-size="12">USB cable</text>
  <!-- 5V knob socket -> HAT 3.3V pin -->
  <polyline points="790,261 700,261 700,246 630,246" fill="none" stroke="#f57c00" stroke-width="3"/>
  <text x="705" y="238" font-size="11" fill="#f57c00">INA219 supply</text>
  <!-- SDA -->
  <polyline points="790,284 710,284 710,276 630,276" fill="none" stroke="#1976d2" stroke-width="3"/>
  <!-- SCL -->
  <polyline points="790,307 720,307 720,306 630,306" fill="none" stroke="#7b1fa2" stroke-width="3"/>
  <!-- GND socket -->
  <polyline points="790,330 740,330 740,366 630,366" fill="none" stroke="#000" stroke-width="3"/>
  <!-- 5V out -> USB-C pigtail -->
  <polyline points="630,336 680,336 680,405 800,405" fill="none" stroke="#d32f2f" stroke-width="4"/>
  <polyline points="630,370 660,370 660,420 800,420" fill="none" stroke="#000" stroke-width="4"/>
  <text x="735" y="398" text-anchor="middle" font-size="12" fill="#d32f2f">USB-C pigtail 5V</text>
  <text x="735" y="438" text-anchor="middle" font-size="12">pigtail GND</text>

  <!-- Notes -->
  <text x="40" y="560" font-weight="bold">Notes</text>
  <text x="40" y="580" font-size="12">1. Check battery polarity with a meter before plugging in: the pack's red wire must land on the HAT connector's + pin.</text>
  <text x="40" y="598" font-size="12">2. The knob's I2C-socket 5V goes ONLY to the HAT pin labelled 3.3V (feeds just the INA219, 3.0–5.5 V OK). Never to the HAT's 5V output pins.</text>
  <text x="40" y="616" font-size="12">3. Identify the header pins with a meter (switch ON, battery in): the 5V output pins read ~5.1 V to GND; the 3.3V pin reads ~0 V until wired.</text>
  <text x="40" y="634" font-size="12">4. Test: unplug USB → Battery Current must go negative; if positive, set ina_sign: "-1.0f" in hw-crowpanel146.yaml.</text>
</svg>
