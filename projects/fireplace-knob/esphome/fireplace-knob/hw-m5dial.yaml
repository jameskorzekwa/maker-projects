# Hardware package: M5Stack Dial v1.1 (ESP32-S3FN8, 8 MB flash, no PSRAM,
# 1.28" 240x240 GC9A01 SPI, FT3267 touch, 16-detent encoder, under-screen
# button, buzzer, PCF8563 RTC, WS1850S NFC, LiPo connector + charger,
# DC 6-36 V input). Pair with ui-240.yaml.
# Pins: docs.m5stack.com/en/core/M5Dial%20V1.1 and devices.esphome.io/devices/M5Stack-Dial.
#
# Battery power latch: on battery the board stays powered only while GPIO46
# (HOLD) is high, so it is driven high at setup. Pressing the under-screen
# button powers the board on from fully off (6 uA); setting HOLD low powers
# it off again (not used yet).

esphome:
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # Grab the power latch as early as possible: on battery the board is only
    # powered while the wake button is held until HOLD (GPIO46) goes high.
    - priority: 1000
      then:
        - lambda: |-
            gpio_reset_pin(GPIO_NUM_46);
            gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_46, 1);

esp32:
  board: m5stack-stamps3
  flash_size: 8MB
  framework:
    type: esp-idf

safe_mode:

# Power latch (no effect on USB, where the ESP32 is fed directly).
switch:
  - platform: gpio
    id: power_hold
    internal: true
    pin: GPIO46
    restore_mode: ALWAYS_ON

script:
  # Release the latch. On battery the board is off before the delay ends
  # (tap = power on, cold boot). On USB we are still here: re-assert HOLD so
  # the Grove 5 V rail and a later USB unplug behave, and carry on awake.
  - id: board_power_off
    then:
      - switch.turn_off: power_hold
      - delay: 500ms
      - switch.turn_on: power_hold

output:
  - platform: ledc
    pin: GPIO9
    id: bl_pwm
    frequency: 19531Hz
  - platform: ledc
    pin: GPIO3
    id: buzzer_out

rtttl:
  output: buzzer_out
  id: buzzer

light:
  - platform: monochromatic
    id: display_backlight
    internal: true
    output: bl_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5

# Port A (red Grove jack): GND, 5 V, G13 = SDA, G15 = SCL. A MAX17048 fuel
# gauge on the LiPo hangs here (wired 2026-11-10). The driver's register maths
# matches the MAX17048 (VCELL 78.125 uV/LSB, SOC 1/256 %).
i2c:
  id: port_a
  sda: GPIO13
  scl: GPIO15
  frequency: 100kHz

display:
  - platform: mipi_spi
    id: panel
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    data_rate: 40MHz
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false

sensor:
  - platform: max17043
    id: gauge
    i2c_id: port_a
    address: 0x36
    update_interval: 30s
    battery_level:
      name: Battery
      id: battery_level
      entity_category: diagnostic
      filters:
        - clamp: {min_value: 0, max_value: 100}
      on_value:
        - lambda: 'id(battery_pct) = x;'
        - script.execute: render
    battery_voltage:
      name: Battery Voltage
      entity_category: diagnostic
      accuracy_decimals: 2

  # MAX17048 CRATE register (0x16): charge/discharge rate, 0.208 %/h per LSB,
  # signed. The Dial's charger has no status pin, so this is how we know.
  - platform: template
    id: battery_rate
    name: Battery Charge Rate
    unit_of_measurement: "%/h"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      uint16_t raw;
      if (!id(gauge).read_byte_16(0x16, &raw)) return NAN;
      float rate = (int16_t) raw * 0.208f;
      id(battery_charging) = rate > 0.5f;
      id(render)->execute();
      return rate;

  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO41
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO40
      mode: {input: true, pullup: true}
    on_clockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return ${rotation_sign};'}
    on_anticlockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return -(${rotation_sign});'}

binary_sensor:
  - platform: template
    name: Battery Charging
    device_class: battery_charging
    entity_category: diagnostic
    lambda: 'return id(battery_charging);'

  - platform: gpio
    id: knob_button
    internal: true
    pin:
      number: GPIO42
      mode: {input: true, pullup: true}
      inverted: true
    filters:
      - delayed_on_off: 15ms
    on_press:
      - script.execute: button_down
    on_release:
      - script.execute: button_up
