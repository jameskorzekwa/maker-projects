substitutions:
  battery_mah: "2000"       # pack capacity for the charge counter

# Hardware package: M5Stack Dial v1.1 (ESP32-S3FN8, 8 MB flash, no PSRAM,
# 1.28" 240x240 GC9A01 SPI, FT3267 touch, 16-detent encoder, under-screen
# button, buzzer, PCF8563 RTC, WS1850S NFC, LiPo connector + charger,
# DC 6-36 V input). Pair with ui-240.yaml.
# Pins: docs.m5stack.com/en/core/M5Dial%20V1.1 and devices.esphome.io/devices/M5Stack-Dial.
#
# Battery power latch: on battery the board stays powered only while GPIO46
# (HOLD) is high, so it is driven high at setup. Pressing the under-screen
# button powers the board on from fully off (6 uA); setting HOLD low powers
# it off again (not used yet).

esphome:
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # Grab the power latch before ANY component sets up (buses are at 1000 and
    # an I2C scan on a stuck bus took ~10 s, which is how long the wake button
    # had to be held): on battery the board is only powered while the button
    # is held until HOLD (GPIO46) goes high.
    - priority: 2000
      then:
        - lambda: |-
            gpio_reset_pin(GPIO_NUM_46);
            gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_46, 1);
            // Hold the pad through software resets (OTA reboot, restart button)
            // so a reboot on battery does not drop the latch and power off.
            gpio_hold_en(GPIO_NUM_46);

esp32:
  board: m5stack-stamps3
  flash_size: 8MB
  framework:
    type: esp-idf

safe_mode:

# Power latch (no effect on USB, where the ESP32 is fed directly).
switch:
  - platform: gpio
    id: power_hold
    internal: true
    pin: GPIO46
    restore_mode: ALWAYS_ON

script:
  # Release the latch. On battery the board is off before the delay ends
  # (tap = power on, cold boot). On USB we are still here: re-assert HOLD so
  # the Grove 5 V rail and a later USB unplug behave, and carry on awake.
  # The INA219 is powered from the battery, so put it to sleep first (it idles
  # at ~0.7 mA otherwise) and bring it back if we turn out to be on USB.
  - id: board_power_off
    then:
      - lambda: |-
          id(ina).write_byte_16(0x00, 0x0000);   // INA219 config: power-down
          gpio_hold_dis(GPIO_NUM_46);             // release the pad hold so the latch can drop
      - switch.turn_off: power_hold
      - delay: 500ms
      - switch.turn_on: power_hold
      - lambda: |-
          gpio_hold_en(GPIO_NUM_46);
          id(ina).setup();                        // still here: USB. Re-init the INA219

  # Two-stage idle sleep on battery (state machine driven by the 200 ms
  # interval below, so the ESPHome loop keeps running between sleep slices).
  # Stage 1: light sleep in 4 s slices (RAM kept, Wi-Fi off, screen dark).
  #   Wakes instantly on the button or the encoder; every slice reads the
  #   INA219 and current INTO the cell (charger) = USB plugged in -> wake.
  #   Every refresh_every_s it turns Wi-Fi on, lets HA reconnect and push
  #   fresh values (screen stays dark), then sleeps again.
  # Stage 2: after light_sleep_minutes, release the power latch -> off.
  - id: board_idle_sleep
    then:
      - lambda: |-
          id(stale_ok) = id(got_fp) && id(got_light) && id(got_preset) && id(got_setpoint) &&
                         id(got_room) && id(got_flame) && id(got_fan);
          id(idle_sleeping) = true;
          id(sleep_state) = 1;
          id(slept_ms) = 0; id(since_refresh_ms) = 0; id(sleep_loops) = 0; id(sleep_rejects) = 0;
          id(wifi_id).disable();
          id(display_backlight).turn_off().perform();

  # Back to normal operation (from any sleep state).
  - id: board_resume
    parameters: {reason: string}
    then:
      - lambda: |-
          id(sleep_state) = 0;
          id(idle_sleeping) = false;
          char d[96];
          snprintf(d, sizeof(d), "%s after %us (loops=%d rejects=%d)", reason.c_str(), id(slept_ms) / 1000, id(sleep_loops), id(sleep_rejects));
          id(last_sleep_info) = d;
          id(last_activity_ms) = millis();
          id(power_off_tried) = false;
          id(wifi_id).enable();
          id(disconnected_since_ms) = millis(); id(conn_timed_out) = false;
          if (id(stale_ok)) id(got_fp) = id(got_light) = id(got_preset) = id(got_setpoint) = id(got_room) = id(got_flame) = id(got_fan) = true;
          id(page) = 1;
          id(apply_backlight)->execute();
          id(render)->execute();

  # Re-seed the charge counter from the resting voltage (rough LiPo OCV table).
  - id: gauge_reseed
    then:
      - lambda: |-
          const float v = id(batt_v);
          if (std::isnan(v)) return;
          float pct = (v - 3.45f) / (4.15f - 3.45f) * 100.0f;
          pct = std::min(100.0f, std::max(0.0f, pct));
          id(soc_mah) = pct / 100.0f * ${battery_mah};
          id(soc_pct_saved) = (int) lroundf(pct);
          ESP_LOGI("batt", "charge counter re-seeded at %.0f%% from %.3f V", pct, v);

output:
  - platform: ledc
    pin: GPIO9
    id: bl_pwm
    frequency: 19531Hz
  - platform: ledc
    pin: GPIO3
    id: buzzer_out

rtttl:
  output: buzzer_out
  id: buzzer

light:
  - platform: monochromatic
    id: display_backlight
    internal: true
    output: bl_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5

# Port A (red Grove jack): GND, 5 V, G13 = SDA, G15 = SCL. An INA219 sits in
# the battery's + lead (battery -> VIN+, VIN- -> B+), powered from the battery
# tap, on this bus at 0x40. It measures the cell voltage and the current with
# direction, so charging / on-USB / percentage are all derived from it.
i2c:
  id: port_a
  sda: GPIO13
  scl: GPIO15
  frequency: 100kHz
  scan: false          # no boot-time address scan (slow when the bus is stuck)
  timeout: 10ms

display:
  - platform: mipi_spi
    id: panel
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    data_rate: 40MHz
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false

globals:
  - id: batt_v              # cell voltage (V), NaN until read
    type: float
    initial_value: "NAN"
  - id: batt_i              # battery current, mA, + = into the battery (charging)
    type: float
    initial_value: "NAN"
  - id: soc_mah             # charge counter (mAh), NaN until seeded
    type: float
    initial_value: "NAN"
  - id: soc_pct_saved       # persisted whole-percent copy of the counter
    type: int
    restore_value: true
    initial_value: "-1"
  - id: vhist               # last 6 one-second voltage samples (no-cell detection)
    type: float[6]
    initial_value: "{0, 0, 0, 0, 0, 0}"
  - id: vidx
    type: int
    initial_value: "0"
  - id: vcount
    type: int
    initial_value: "0"
  - id: batt_last_ms
    type: uint32_t
    initial_value: "0"
  - id: monitor_lost        # INA219 stopped answering (it is powered from the battery)
    type: bool
    initial_value: "false"
  - id: last_sleep_info     # diagnostics from the last light-sleep episode
    type: std::string
    initial_value: '""'
  - id: sleep_state         # 0 awake, 1 light-sleep slices, 2 awake-dark refresh window
    type: int
    initial_value: "0"
  - id: slept_ms
    type: uint32_t
    initial_value: "0"
  - id: since_refresh_ms
    type: uint32_t
    initial_value: "0"
  - id: refresh_t0
    type: uint32_t
    initial_value: "0"
  - id: sleep_loops
    type: int
    initial_value: "0"
  - id: sleep_rejects
    type: int
    initial_value: "0"

interval:
  - interval: 200ms
    then:
      - lambda: |-
          if (id(sleep_state) == 0) return;
          const uint32_t limit_ms = ${light_sleep_minutes}u * 60u * 1000u;
          if (id(sleep_state) == 1) {
            // One 4 s light-sleep slice. Arm each wake pin on the opposite of
            // its current level (an already-true wake condition is refused).
            const gpio_num_t pins[] = {GPIO_NUM_42, GPIO_NUM_40, GPIO_NUM_41};
            for (auto p : pins) gpio_wakeup_enable(p, gpio_get_level(p) ? GPIO_INTR_LOW_LEVEL : GPIO_INTR_HIGH_LEVEL);
            esp_sleep_enable_gpio_wakeup();
            esp_sleep_enable_timer_wakeup(4000000ULL);
            esp_err_t rc = esp_light_sleep_start();
            App.feed_wdt();
            for (auto p : pins) gpio_wakeup_disable(p);
            id(sleep_loops)++;
            if (rc != ESP_OK) {
              if (++id(sleep_rejects) > 5) { id(board_resume)->execute("sleep refused"); }
              return;
            }
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_GPIO) {
              // A waking *press* is not a tap (its release clears the guard);
              // a waking *turn* goes on to act as the first click.
              if (gpio_get_level(GPIO_NUM_42) == 0) id(boot_guard) = true;
              id(board_resume)->execute("input");
              return;
            }
            id(slept_ms) += 4000; id(since_refresh_ms) += 4000;
            id(ina).update();
            if (id(battery_charging)) { id(board_resume)->execute("usb"); return; }
            if (id(slept_ms) >= limit_ms) {
              // Stage 2. board_power_off returns only if we are on USB after all.
              id(board_power_off)->execute();
              id(board_resume)->execute("power-off attempt");
              return;
            }
            if (id(since_refresh_ms) >= ${refresh_every_s}u * 1000u) {
              id(sleep_state) = 2; id(refresh_t0) = millis();
              id(wifi_id).enable();             // awake but dark: let HA reconnect and push values
            }
            return;
          }
          // state 2: refresh window
          const bool have_all = id(got_fp) && id(got_light) && id(got_preset) && id(got_setpoint) &&
                                id(got_room) && id(got_flame) && id(got_fan);
          const bool done = api::global_api_server->is_connected() && have_all;
          if (done || (millis() - id(refresh_t0)) > 15000u) {
            if (have_all) id(stale_ok) = true;
            id(wifi_id).disable();
            id(since_refresh_ms) = 0;
            id(sleep_state) = 1;
          }

  # The INA219 is powered from the battery tap: unplug the battery and it
  # goes silent. No reading for 3 s = battery disconnected; the Dial is
  # obviously still running, so external power is present.
  - interval: 1s
    then:
      - lambda: |-
          if (id(monitor_lost)) return;
          if (id(batt_last_ms) != 0 && (millis() - id(batt_last_ms)) > 3000u) {
            id(monitor_lost) = true;
            id(battery_absent) = true;
            id(battery_charging) = false;
            id(on_usb) = true;
            id(battery_pct) = NAN;
            id(batt_i) = NAN; id(batt_v) = NAN;
            id(vcount) = 0;
            id(render)->execute();
          }

sensor:
  - platform: ina219
    id: ina
    i2c_id: port_a
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_current: 0.8A         # 80 mV shunt range: fine resolution at 100-300 mA
    max_voltage: 16V
    update_interval: 1s
    bus_voltage:
      id: ina_bus_v
      internal: true
    current:
      id: ina_current
      internal: true
      on_value:
        - lambda: |-
            // Sign: ESPHome's INA219 current is + for VIN+ -> VIN-, i.e. battery
            // -> Dial (discharge). Flip so + means charging.
            const float i_ma = -x * 1000.0f;
            const float v = id(ina_bus_v).state;
            const uint32_t now = millis();
            const bool first = std::isnan(id(batt_i));
            id(batt_i) = i_ma; id(batt_v) = v;

            // No cell: the charger's output cannot hold a steady voltage
            // without a battery (sawtooth), so the 6 s spread is large.
            float *h = id(vhist);
            h[id(vidx)] = v; id(vidx) = (id(vidx) + 1) % 6;
            if (id(vcount) < 6) id(vcount)++;
            // Only with no current flowing: a plug/unplug step also moves the
            // voltage ~40 mV, but it always comes with a current change.
            bool absent = id(battery_absent);
            // No battery: the INA219's VIN+ floats and the shunt reading pins at
            // the range limit (seen: +819 mA with the cell unplugged). Nothing
            // real exceeds ~300 mA here, so beyond 500 mA = disconnected.
            if (fabsf(i_ma) > 500.0f) absent = true;
            else if (fabsf(i_ma) > 5.0f) absent = false;   // current flowing = a cell is there
            else if (id(vcount) >= 6) {
              float lo = h[0], hi = h[0];
              for (int k = 1; k < 6; k++) { lo = std::min(lo, h[k]); hi = std::max(hi, h[k]); }
              const bool jumpy = (hi - lo) > 0.050f;
              if (jumpy && fabsf(i_ma) < 5.0f) absent = true;
              else if (!jumpy) absent = false;
            }
            id(battery_absent) = absent;
            if (absent) id(soc_mah) = NAN;   // re-seed from voltage when a cell is connected again

            // Charging = current into the cell. External power = the cell is
            // not supplying the Dial (it always draws >= ~60 mA while awake).
            const bool charging = !absent && i_ma > 10.0f;
            const bool usb = absent || i_ma > -20.0f;

            // Charge counter (mAh) with anchors at full and empty.
            if (!absent) {
              if (std::isnan(id(soc_mah))) {
                if (id(soc_pct_saved) >= 0) id(soc_mah) = id(soc_pct_saved) / 100.0f * ${battery_mah};
                else id(gauge_reseed)->execute();
              }
              if (!first && !std::isnan(id(soc_mah))) {
                const float dt_h = (now - id(batt_last_ms)) / 3600000.0f;
                id(soc_mah) += i_ma * dt_h;
                if (v >= 4.18f && charging && i_ma < 15.0f) id(soc_mah) = ${battery_mah};   // charge terminated: full
                if (v >= 4.19f && !charging) id(soc_mah) = std::max(id(soc_mah), 0.97f * ${battery_mah});
                if (v <= 3.30f && i_ma < 0) id(soc_mah) = 0;                                 // empty
                id(soc_mah) = std::min((float) ${battery_mah}, std::max(0.0f, id(soc_mah)));
                int pct = (int) lroundf(id(soc_mah) / ${battery_mah} * 100.0f);
                if (pct != id(soc_pct_saved)) id(soc_pct_saved) = pct;   // persisted per whole %
                id(battery_pct) = id(soc_mah) / ${battery_mah} * 100.0f;
              }
            } else id(battery_pct) = NAN;
            id(batt_last_ms) = now;

            bool changed = (charging != id(battery_charging)) || (usb != id(on_usb)) || first || id(monitor_lost);
            id(monitor_lost) = false;
            id(battery_charging) = charging;
            id(on_usb) = usb;
            if (changed) { id(power_off_tried) = false; id(render)->execute(); }

  # HA-facing copies (throttled)
  - platform: template
    name: Battery
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(battery_pct);'
  - platform: template
    name: Battery Voltage
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(batt_v);'
  - platform: template
    name: Battery Current
    device_class: current
    unit_of_measurement: "mA"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(batt_i);'   # + = charging, - = discharging

  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO41
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO40
      mode: {input: true, pullup: true}
    on_clockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return ${rotation_sign};'}
    on_anticlockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return -(${rotation_sign});'}


button:
  - platform: template
    name: Reset Battery Gauge
    icon: mdi:battery-sync
    entity_category: config
    on_press:
      - script.execute: gauge_reseed

text_sensor:
  - platform: template
    name: Last Sleep
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return id(last_sleep_info);'

binary_sensor:
  - platform: template
    name: Battery Present
    device_class: plug
    entity_category: diagnostic
    lambda: 'return !id(battery_absent) && !std::isnan(id(batt_v));'

  - platform: template
    name: Battery Charging
    device_class: battery_charging
    entity_category: diagnostic
    lambda: 'return id(battery_charging);'

  - platform: template
    name: External Power
    device_class: power
    entity_category: diagnostic
    lambda: 'return id(on_usb);'

  - platform: gpio
    id: knob_button
    internal: true
    pin:
      number: GPIO42
      mode: {input: true, pullup: true}
      inverted: true
    filters:
      - delayed_on_off: 15ms
    on_press:
      - script.execute: button_down
    on_release:
      - script.execute: button_up
