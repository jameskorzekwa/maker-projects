lvgl:
  displays: [panel]
  buffer_size: 12%
  bg_color: 0x000000
  default_font: font_sub
  scrollable: false
  scrollbar_mode: "OFF"
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        - arc:
            id: ring
            align: CENTER
            width: 456
            height: 456
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
            arc_color: 0x1C1C1C
            arc_width: 22
            arc_rounded: true
            indicator:
              arc_color: 0xFF7A1A
              arc_width: 22
              arc_rounded: true
            knob:
              bg_opa: TRANSP
              pad_all: 0

        # Icon + text rows are flex containers sized to their content and
        # centred as a unit, so they stay centred whatever the text width.
        - obj:
            id: status_row
            align: CENTER
            y: -160
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              pad_column: 8
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: status_icon
                  text: "\U000F1722"
                  text_font: font_icons_small
                  text_color: 0x5A5A5A
              - label:
                  id: status_text
                  text: "OFF"
                  text_font: font_sub
                  text_color: 0x9A9A9A

        - obj:
            id: title_row
            align: CENTER
            y: -98
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              pad_column: 12
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
