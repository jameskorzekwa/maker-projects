# Fireplace knob - Elecrow CrowPanel 2.1" ESP32-S3 rotary display (480x480).
#
# Controls one fireplace through Home Assistant:
#   Long press (hold)  -> fireplace on/off
#   Short press        -> next screen. Screens depend on the mode:
#                           Manual:     Flame, Fan Speed, Light, Mode
#                           Thermostat: Set Temp, Fan Speed, Light, Mode
#                           Smart:      Set Temp, Fan Speed, Light, Mode
#   Turn               -> adjust the value on the current screen
#                         (Light: clockwise = on, counter-clockwise = off;
#                          Mode: Manual <-> Thermostat <-> Smart)
# Only a long press ever lights the fireplace: while it is off, the Mode
# screen just picks the mode it will light in, and Flame is locked.
#
# Which fireplace it controls is set entirely by the substitutions below; the
# per-fireplace files (../fireplace-knob-living-room.yaml, ...) include this
# file as a package and override them. It lives in a subdirectory so the
# ESPHome Device Builder does not list it as a device of its own.
#
# Hardware pinout (ST7701S RGB panel, PCF8574 expander @0x21, encoder
# GPIO4/GPIO42, button on PCF8574 P5, backlight GPIO6) and the panel init
# sequence come from the known-working community firmware
# github.com/Jastreb07/elecrow-crowpanel-esphome-thermostat (thermostat_480.yaml,
# MIT). The CST826 touch panel is not used: it needs an out-of-tree component
# and this UI is knob-only.
#
# Home Assistant must allow this device to perform actions (ESPHome device
# options -> "Allow the device to perform Home Assistant actions"), otherwise
# every knob command is silently dropped.

substitutions:
  device_name: fireplace-knob
  friendly_name: Fireplace Knob
  fireplace_name: Fireplace

  # ---- Home Assistant entities (override per fireplace) ----
  fireplace_switch: switch.living_room_fireplace
  climate_entity: climate.living_room_fireplace_mode
  flame_number: number.living_room_fireplace_flame_height
  fan_number: number.living_room_fireplace_fan_speed
  light_switch: switch.living_room_fireplace_light

  # ---- Behaviour ----
  temp_step: "1.0"          # degrees per knob detent
  temp_min: "55"
  temp_max: "85"
  temp_default: "70"        # used until HA reports a set point
  temp_format: "%.0f"       # "%.1f" for 0.5-degree steps
  flame_max: "6"
  fan_max: "6"
  rotation_sign: "1"        # set to "-1" if the knob turns the wrong way
  long_press: 700ms
  dim_after_s: "20"
  off_after_s: "120"
  dim_brightness: "0.15"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2
  on_boot:
    # After the PCF8574 (setup priority 900), before the ST7701S driver (800):
    # the panel must be powered and out of reset before its init sequence.
    - priority: 850
      then:
        - output.turn_on: lcd_power
        - output.turn_off: display_reset
        - delay: 100ms
        - output.turn_on: tp_reset
        - delay: 100ms
        - output.turn_off: tp_reset
        - delay: 120ms
        - output.turn_on: tp_reset
        - delay: 120ms
        - output.turn_on: tp_intr
    - priority: -100
      then:
        - lambda: 'id(last_activity_ms) = millis();'
        - light.turn_on:
            id: display_backlight
            brightness: 100%
        - script.execute: render

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # RGB panel stability (screen drift / tearing seen on hardware 2026-11-07).
      # The panel streams the framebuffer from PSRAM continuously; any flash
      # access disables the cache and starves it. Running code + rodata from
      # PSRAM (XIP) removes those stalls, and restarting the DMA in every VSYNC
      # stops a momentary underrun from leaving the image permanently shifted.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y

safe_mode:

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}"
    password: !secret fireplace_knob_ap_password

captive_portal:

logger:
  level: DEBUG
  logs:
    lvgl: INFO
    sensor: INFO
    text_sensor: INFO
    homeassistant.sensor: INFO
    homeassistant.text_sensor: INFO

api:
  encryption:
    key: !secret fireplace_knob_api_key
  on_client_connected:
    - script.execute: render
  on_client_disconnected:
    - script.execute: render

ota:
  - platform: esphome
    password: !secret fireplace_knob_ota_password

# ------------------------------------------------------------------
# Board hardware
# ------------------------------------------------------------------
i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: GPIO6
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: lcd_power
    pin: {pcf8574: pcf, number: 3, mode: {output: true}}
  - platform: gpio
    id: tp_reset
    pin: {pcf8574: pcf, number: 0, mode: {output: true}}
  - platform: gpio
    id: display_reset
    pin: {pcf8574: pcf, number: 4, mode: {output: true}, inverted: true}
  - platform: gpio
    id: tp_intr
    pin: {pcf8574: pcf, number: 2, mode: {output: true}}

light:
  - platform: monochromatic
    id: display_backlight
    name: Display Backlight
    output: bl_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO1

display:
  - platform: st7701s
    id: panel
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO16
    de_pin: GPIO40
    hsync_pin: GPIO15
    vsync_pin: GPIO7
    pclk_pin: GPIO41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 16MHz     # ~60 fps; less PSRAM bandwidth than 18 MHz
    pclk_inverted: true
    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

# ------------------------------------------------------------------
# State
# ------------------------------------------------------------------
# Screen ids (the visible set depends on the selected mode, see page_list):
#   0 = Set Temp, 1 = Flame, 2 = Fan Speed, 3 = Light, 4 = Mode
#   Manual:     Flame, Fan, Light, Mode
#   Thermostat: Set Temp, Fan, Light, Mode     (IFC regulates the flame)
#   Smart:      Set Temp, Fan Speed, Light, Mode (flame scales with demand)
# The fan is never automatic: the user picks the speed in every mode, and the
# Proflame 2 IFC itself delays it ~5 min after ignition and runs it ~12 min
# after the burner goes out.
globals:
  - id: page              # current screen id; -1 = first screen of the list
    type: int
    initial_value: "-1"
  - id: mode_sel          # 0 = Manual, 1 = Thermostat, 2 = Smart
    type: int
    restore_value: true
    initial_value: "0"
  - id: mode_pending
    type: bool
    initial_value: "false"
  - id: setpoint          # what the knob shows / last sent
    type: float
    restore_value: true
    initial_value: "${temp_default}"
  - id: temp_pending      # user is turning; ignore HA echoes until sent
    type: bool
    initial_value: "false"
  - id: flame_target
    type: int
    initial_value: "0"
  - id: flame_pending
    type: bool
    initial_value: "false"
  - id: fan_target
    type: int
    initial_value: "0"
  - id: fan_pending
    type: bool
    initial_value: "false"
  - id: light_target
    type: bool
    initial_value: "false"
  - id: light_pending
    type: bool
    initial_value: "false"
  - id: long_fired
    type: bool
    initial_value: "false"
  - id: press_woke        # the current press started on a dark screen
    type: bool
    initial_value: "false"
  - id: last_activity_ms
    type: uint32_t
    initial_value: "0"
  - id: screen_level      # 0 = full, 1 = dimmed, 2 = off
    type: int
    initial_value: "0"
  - id: toast_until_ms
    type: uint32_t
    initial_value: "0"

# ------------------------------------------------------------------
# Home Assistant state mirrors
# ------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_fireplace
    entity_id: ${fireplace_switch}
    on_value:
      - script.execute: render
  - platform: homeassistant
    id: ha_light
    entity_id: ${light_switch}
    on_value:
      - lambda: 'id(light_pending) = false;'
      - script.execute: render
  - platform: homeassistant
    id: ha_preset
    entity_id: ${climate_entity}
    attribute: preset_mode
    on_value:
      # Follow the fireplace's real mode (remote, HA, automations). "Off" is
      # ignored so the knob remembers which mode to light it in next time.
      - lambda: |-
          if (id(mode_pending)) return;
          if (x == "Manual") id(mode_sel) = 0;
          else if (x == "Thermostat") id(mode_sel) = 1;
          else if (x == "Smart") id(mode_sel) = 2;
      - script.execute: render

sensor:
  - platform: homeassistant
    id: ha_setpoint
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      # null in Off/Manual on the Proflame integrations -> NaN; keep ours.
      - lambda: |-
          if (!std::isnan(x) && !id(temp_pending)) id(setpoint) = x;
      - script.execute: render
  - platform: homeassistant
    id: ha_room_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      - script.execute: render
  - platform: homeassistant
    id: ha_flame
    entity_id: ${flame_number}
    on_value:
      - lambda: |-
          if (!std::isnan(x) && !id(flame_pending)) id(flame_target) = (int) lroundf(x);
      - script.execute: render
  - platform: homeassistant
    id: ha_fan
    entity_id: ${fan_number}
    on_value:
      - lambda: |-
          if (!std::isnan(x) && !id(fan_pending)) id(fan_target) = (int) lroundf(x);
      - script.execute: render

  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO4
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO42
      mode: {input: true, pullup: true}
    on_clockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return ${rotation_sign};'}
    on_anticlockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return -(${rotation_sign});'}

  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status
  - platform: gpio
    id: knob_button
    internal: true
    pin:
      pcf8574: pcf
      number: 5
      mode: {input: true}
      inverted: true
    filters:
      - delayed_on_off: 10ms
    on_press:
      - lambda: |-
          id(long_fired) = false;
          id(press_woke) = id(screen_level) == 2;
      - script.execute: long_press_timer
    on_release:
      - script.stop: long_press_timer
      - if:
          condition:
            lambda: 'return !id(long_fired);'
          then:
            - lambda: |-
                id(toast_until_ms) = 0;
                lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
            - script.execute: short_press

button:
  - platform: restart
    name: Restart
    entity_category: config

# ------------------------------------------------------------------
# Behaviour
# ------------------------------------------------------------------
script:
  # Wake the screen and restart the idle timer. Callers check whether the
  # screen was dark first, so an input that only wakes it changes nothing.
  - id: wake
    then:
      - lambda: 'id(last_activity_ms) = millis();'
      - if:
          condition:
            lambda: 'return id(screen_level) != 0;'
          then:
            - lambda: 'id(screen_level) = 0;'
            - light.turn_on:
                id: display_backlight
                brightness: 100%

  - id: long_press_timer
    mode: restart
    then:
      - script.execute: wake
      - delay: 200ms
      - lambda: |-
          bool on = id(ha_fireplace).state == "on";
          id(show_toast)->execute(on ? "Hold to turn OFF" : "Hold to turn ON", 2000);
      - delay: ${long_press}
      - lambda: 'id(long_fired) = true;'
      - script.execute: toggle_fireplace

  - id: short_press
    then:
      - lambda: |-
          id(wake)->execute();
          if (id(press_woke)) return;   // that press only woke the screen
          int L[5]; int n = 0; const int m = id(mode_sel);
          L[n++] = (m == 0) ? 1 : 0;      // Flame (Manual) or Set Temp
          L[n++] = 2;                     // Fan (every mode)
          L[n++] = 3; L[n++] = 4;         // Light, Mode
          int idx = -1;
          for (int i = 0; i < n; i++) if (L[i] == id(page)) idx = i;
          id(page) = L[(idx + 1) % n];    // not in list -> idx -1 -> first
          id(render)->execute();

  - id: show_toast
    parameters: {text: string, ms: int}
    then:
      - lambda: |-
          lv_label_set_text(id(toast_label), text.c_str());
          lv_obj_remove_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          id(toast_until_ms) = millis() + ms;

  # On: light it in the mode chosen on the Mode screen (Manual uses the last
  # flame height). This is the only path that ever ignites the fireplace.
  - id: toggle_fireplace
    then:
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - script.execute: {id: show_toast, text: "Turning OFF", ms: 2500}
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${fireplace_switch}
          else:
            - lambda: |-
                static const char *M[] = {"Turning ON\nManual", "Turning ON\nThermostat", "Turning ON\nSmart"};
                id(show_toast)->execute(M[id(mode_sel)], 2500);
            - homeassistant.action:
                action: climate.set_preset_mode
                data:
                  entity_id: ${climate_entity}
                data_template:
                  preset_mode: "{{ m }}"
                variables:
                  m: !lambda |-
                    static const char *M[] = {"Manual", "Thermostat", "Smart"};
                    return std::string(M[id(mode_sel)]);

  - id: knob_turn
    parameters: {dir: int}
    then:
      - lambda: |-
          bool was_off = id(screen_level) == 2;
          id(wake)->execute();
          if (was_off) return;
          const bool fp_on = id(ha_fireplace).state == "on";
          if (id(page) < 0) id(render)->execute();   // resolve first screen
          switch (id(page)) {
            case 0: {  // Set Temp: always allowed; never ignites
              float t = id(setpoint) + dir * ${temp_step};
              id(setpoint) = std::min((float) ${temp_max}, std::max((float) ${temp_min}, t));
              id(temp_pending) = true;
              id(send_temp)->execute();
              break;
            }
            case 1: {  // Flame (Manual): a flame > 0 would light an off fireplace
              if (!fp_on) { id(show_toast)->execute("Hold knob to\nturn on first", 2000); break; }
              int f = std::min(${flame_max}, std::max(1, id(flame_target) + dir));
              if (f == id(flame_target)) break;
              id(flame_target) = f;
              id(flame_pending) = true;
              id(send_flame)->execute();
              break;
            }
            case 2: {
              int f = std::min(${fan_max}, std::max(0, id(fan_target) + dir));
              if (f == id(fan_target)) break;
              id(fan_target) = f;
              id(fan_pending) = true;
              id(send_fan)->execute();
              break;
            }
            case 3: {
              bool want = dir > 0;
              bool cur = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
              if (want == cur) break;
              id(light_target) = want;
              id(light_pending) = true;
              id(send_light)->execute();
              break;
            }
            case 4: {  // Mode: applied now if burning, else used at next turn-on
              int m = std::min(2, std::max(0, id(mode_sel) + dir));
              if (m == id(mode_sel)) break;
              id(mode_sel) = m;
              if (fp_on) { id(mode_pending) = true; id(send_mode)->execute(); }
              break;
            }
          }
          id(render)->execute();

  # Debounced: one HA call after the knob stops turning.
  - id: send_temp
    mode: restart
    then:
      - delay: 900ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_entity}
          data_template:
            temperature: "{{ t }}"
          variables:
            t: !lambda 'return id(setpoint);'
      - delay: 4s
      - lambda: 'id(temp_pending) = false;'
      - script.execute: render

  - id: send_mode
    mode: restart
    then:
      - delay: 1200ms
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - homeassistant.action:
                action: climate.set_preset_mode
                data:
                  entity_id: ${climate_entity}
                data_template:
                  preset_mode: "{{ m }}"
                variables:
                  m: !lambda |-
                    static const char *M[] = {"Manual", "Thermostat", "Smart"};
                    return std::string(M[id(mode_sel)]);
      - delay: 5s
      - lambda: 'id(mode_pending) = false;'
      - script.execute: render

  - id: send_flame
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${flame_number}
                data_template:
                  value: "{{ v }}"
                variables:
                  v: !lambda 'return id(flame_target);'
      - delay: 4s
      - lambda: 'id(flame_pending) = false;'
      - script.execute: render

  - id: send_fan
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: ${fan_number}
          data_template:
            value: "{{ v }}"
          variables:
            v: !lambda 'return id(fan_target);'
      - delay: 4s
      - lambda: 'id(fan_pending) = false;'
      - script.execute: render

  - id: send_light
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(light_target);'
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: ${light_switch}
          else:
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${light_switch}
      - delay: 5s
      - lambda: 'id(light_pending) = false;'
      - script.execute: render

  - id: render
    then:
      - lambda: |-
          static const uint32_t ORANGE = 0xFF7A1A, RED = 0xFF4A2A, CYAN = 0x38BDF8,
                                YELLOW = 0xFACC15, PURPLE = 0xA78BFA, GREY = 0x5A5A5A,
                                DIM = 0x2A2A2A, WHITE = 0xFFFFFF, SUB = 0x9A9A9A;
          char buf[48];
          const bool connected = api::global_api_server->is_connected();
          const std::string fp = id(ha_fireplace).state;
          const bool fp_on = fp == "on";
          const bool fp_known = fp == "on" || fp == "off";
          const int m = id(mode_sel);

          // ---- screens available in this mode ----
          int L[5]; int n = 0;
          L[n++] = (m == 0) ? 1 : 0;
          L[n++] = 2;
          L[n++] = 3; L[n++] = 4;
          int idx = -1;
          for (int i = 0; i < n; i++) if (L[i] == id(page)) idx = i;
          if (idx < 0) { idx = 0; id(page) = L[0]; }
          const int p = id(page);

          // ---- status row ----
          static const char *MODE_NAMES[] = {"MANUAL", "THERMOSTAT", "SMART"};
          lv_label_set_text(id(status_icon), fp_on ? "\U000F0238" : "\U000F1722");
          lv_obj_set_style_text_color(id(status_icon), lv_color_hex(fp_on ? ORANGE : GREY), 0);
          if (!connected)      lv_label_set_text(id(status_text), "OFFLINE");
          else if (!fp_known)  lv_label_set_text(id(status_text), "UNAVAILABLE");
          else if (fp_on)      { static const char *MC[] = {"Manual", "Thermostat", "Smart"};
                                 snprintf(buf, sizeof(buf), "ON \u00B7 %s", MC[m]); lv_label_set_text(id(status_text), buf); }
          else                 lv_label_set_text(id(status_text), "OFF");
          lv_obj_set_style_text_color(id(status_text), lv_color_hex(fp_on ? ORANGE : SUB), 0);

          // ---- page ----
          static const char *TITLES[] = {"SET TEMP", "FLAME", "FAN SPEED", "LIGHT", "MODE"};
          static const char *ICONS[] = {"\U000F050F", "\U000F0238", "\U000F0210", "\U000F0335", "\U000F1542"};
          lv_label_set_text(id(title_label), TITLES[p]);
          lv_label_set_text(id(title_icon), ICONS[p]);
          if (p == 4) {
            lv_obj_add_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(mode_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(mode_label), LV_OBJ_FLAG_HIDDEN);
          }

          uint32_t accent = ORANGE;
          switch (p) {
            case 0: {
              accent = ORANGE;
              snprintf(buf, sizeof(buf), "${temp_format}\u00B0", id(setpoint));
              lv_label_set_text(id(value_label), buf);
              lv_arc_set_range(id(ring), (int32_t) (${temp_min} * 10), (int32_t) (${temp_max} * 10));
              lv_arc_set_value(id(ring), (int32_t) lroundf(id(setpoint) * 10));
              float room = id(ha_room_temp).state;
              if (id(temp_pending))      snprintf(buf, sizeof(buf), "Setting...");
              else if (std::isnan(room)) snprintf(buf, sizeof(buf), "Room --");
              else                       snprintf(buf, sizeof(buf), "Room %.0f\u00B0", room);
              lv_label_set_text(id(sub_label), buf);
              break;
            }
            case 1: {
              accent = RED;
              int f = fp_on ? id(flame_target) : 0;
              if (f <= 0) snprintf(buf, sizeof(buf), "OFF"); else snprintf(buf, sizeof(buf), "%d", f);
              lv_label_set_text(id(value_label), buf);
              lv_arc_set_range(id(ring), 0, ${flame_max});
              lv_arc_set_value(id(ring), f);
              lv_label_set_text(id(sub_label), !fp_on ? "Hold knob to turn on"
                                : id(flame_pending) ? "Setting..." : "Flame 1 - ${flame_max}");
              break;
            }
            case 2: {
              accent = CYAN;
              int f = id(fan_target);
              if (f <= 0) snprintf(buf, sizeof(buf), "OFF"); else snprintf(buf, sizeof(buf), "%d", f);
              lv_label_set_text(id(value_label), buf);
              lv_arc_set_range(id(ring), 0, ${fan_max});
              lv_arc_set_value(id(ring), f);
              lv_label_set_text(id(sub_label), id(fan_pending) ? "Setting..." : "Speed 0 - ${fan_max}");
              break;
            }
            case 3: {
              accent = YELLOW;
              bool lon = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
              lv_label_set_text(id(value_label), lon ? "ON" : "OFF");
              lv_arc_set_range(id(ring), 0, 1);
              lv_arc_set_value(id(ring), lon ? 1 : 0);
              lv_label_set_text(id(title_icon), lon ? "\U000F0335" : "\U000F0336");
              lv_label_set_text(id(sub_label), "Turn right: on   left: off");
              break;
            }
            case 4: {
              accent = PURPLE;
              static const char *HINT[] = {"You set flame + fan", "Auto flame, you set fan", "Smart flame, you set fan"};
              lv_label_set_text(id(mode_label), MODE_NAMES[m]);
              lv_arc_set_range(id(ring), 0, 3);
              lv_arc_set_value(id(ring), m + 1);
              lv_label_set_text(id(sub_label), id(mode_pending) ? "Setting..."
                                : fp_on ? HINT[m] : "Used at next turn-on");
              break;
            }
          }
          if (!connected) lv_label_set_text(id(sub_label), "Connecting to Home Assistant");

          lv_obj_set_style_arc_color(id(ring), lv_color_hex(accent), LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(title_icon), lv_color_hex(accent), 0);
          lv_obj_set_style_text_color(id(value_label), lv_color_hex(connected ? WHITE : GREY), 0);
          lv_obj_set_style_text_color(id(mode_label), lv_color_hex(connected ? WHITE : GREY), 0);

          // ---- page dots, centred for 3 or 4 screens ----
          lv_obj_t *dots[] = {id(dot0), id(dot1), id(dot2), id(dot3)};
          for (int i = 0; i < 4; i++) {
            if (i >= n) { lv_obj_add_flag(dots[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_remove_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(dots[i], (int32_t) ((2 * i - (n - 1)) * 14));
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(i == idx ? accent : DIM), 0);
          }

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(toast_until_ms) != 0 && (int32_t) (now - id(toast_until_ms)) >= 0) {
            id(toast_until_ms) = 0;
            lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          }
          const uint32_t idle = (now - id(last_activity_ms)) / 1000;
          if (id(screen_level) == 0 && idle >= ${dim_after_s}) {
            id(screen_level) = 1;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(${dim_brightness});
            call.perform();
          } else if (id(screen_level) == 1 && idle >= ${off_after_s}) {
            id(screen_level) = 2;
            id(display_backlight).turn_off().perform();
            id(page) = -1;          // wake up on the mode's first screen
            id(render)->execute();
          }

