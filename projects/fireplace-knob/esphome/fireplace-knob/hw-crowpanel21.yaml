# Hardware package: Elecrow CrowPanel 2.1" ESP32-S3 rotary display (480x480).
# Pair with ui-480.yaml. Pinout and panel init from
# github.com/Jastreb07/elecrow-crowpanel-esphome-thermostat (MIT) and
# Elecrow's factory Board21.h.

esphome:
  on_boot:
    # After the PCF8574 (setup priority 900), before the ST7701S driver (800):
    # the panel must be powered and out of reset before its init sequence.
    # Same order and timing as Elecrow's factory Board21.h: power, then a
    # real LCD reset pulse (P4 low 100 ms), then the touch reset. Without the
    # low pulse the panel comes up as coloured noise after a cold power-up
    # (seen 2026-11-07); soft reboots do not recover it.
    # Done in ONE blocking lambda: `delay:` actions in on_boot do not hold up
    # the rest of setup, so with separate steps the display driver sent its
    # init while the panel was still in reset (black screen, 2026-11-07).
    - priority: 850
      then:
        - lambda: |-
            id(lcd_power).turn_on();
            delay(50);
            id(display_reset).turn_on();     // asserted (pin low)
            delay(100);
            id(display_reset).turn_off();    // released (pin high)
            delay(100);
            id(tp_reset).turn_off();
            delay(100);
            id(tp_reset).turn_on();
            delay(100);
            id(tp_intr).turn_on();


esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # RGB panel stability (screen drift / tearing seen on hardware 2026-11-07).
      # The panel streams the framebuffer from PSRAM continuously; any flash
      # access disables the cache and starves it. Running code + rodata from
      # PSRAM (XIP) removes those stalls, and restarting the DMA in every VSYNC
      # stops a momentary underrun from leaving the image permanently shifted.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: y
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y

safe_mode:

psram:
  mode: octal
  speed: 80MHz

# ------------------------------------------------------------------
# Board hardware
# ------------------------------------------------------------------
i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: GPIO6
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: lcd_power
    pin: {pcf8574: pcf, number: 3, mode: {output: true}}
  - platform: gpio
    id: tp_reset
    pin: {pcf8574: pcf, number: 0, mode: {output: true}}
  - platform: gpio
    id: display_reset
    pin: {pcf8574: pcf, number: 4, mode: {output: true}, inverted: true}
  - platform: gpio
    id: tp_intr
    pin: {pcf8574: pcf, number: 2, mode: {output: true}}

light:
  - platform: monochromatic
    id: display_backlight
    internal: true
    output: bl_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO1

display:
  - platform: st7701s
    id: panel
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO16
    de_pin: GPIO40
    hsync_pin: GPIO15
    vsync_pin: GPIO7
    pclk_pin: GPIO41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 16MHz     # ~60 fps; less PSRAM bandwidth than 18 MHz
    pclk_inverted: true
    init_sequence:
      - [0x01]
      - delay 120ms                # ST7701S needs >5 ms after SW reset; be generous
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms
sensor:
  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO4
      mode: {input: true, pullup: true}
    pin_b:
      number: GPIO42
      mode: {input: true, pullup: true}
    on_clockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return ${rotation_sign};'}
    on_anticlockwise:
      - script.execute: {id: knob_turn, dir: !lambda 'return -(${rotation_sign});'}

binary_sensor:
  - platform: gpio
    id: knob_button
    internal: true
    pin:
      pcf8574: pcf
      number: 5
      mode: {input: true}
      inverted: true
    filters:
      - delayed_on_off: 10ms
    on_press:
      - script.execute: button_down
    on_release:
      - script.execute: button_up
