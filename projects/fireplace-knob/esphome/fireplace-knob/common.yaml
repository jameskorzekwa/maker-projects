# Fireplace knob: shared behaviour package (all boards).
#
# A device file includes three packages:
#   common.yaml          this file: HA entities, state, scripts, render
#   hw-<board>.yaml      pins, display driver, encoder + button -> button_down/up
#   ui-<size>.yaml       fonts and LVGL pages (same widget ids on every size)
# Boards: hw-crowpanel21.yaml + ui-480.yaml (Elecrow CrowPanel 2.1"),
#         hw-m5dial.yaml + ui-240.yaml (M5Stack Dial v1.1).
#
# Controls one fireplace through Home Assistant.
#
#   Sleep      room temperature at the Sleep brightness. Tap -> Main.
#              Turn -> Set Point (first click already counts). Hold -> on/off.
#   Main       room temperature, set point, mode, on/off. Tap -> Settings.
#              Turn -> Set Point.
#   Set Point  turn = set temperature (Manual: flame height; while off it is
#              stored and sent right after the next Manual turn-on).
#              Tap or 10 s idle -> Main. Never lights the fireplace.
#   Settings   an arc of icons across the top (Back, Power, Mode, Fan, Light,
#              Flame, Brightness); turn = move the highlight, the centre
#              previews that setting live; tap = edit it (tap Back -> Main).
#              Flame is listed only in Manual while burning.
#   Edit       turn = change, tap -> Settings. Fan, light, flame and the set
#              point are sent ~1 s after the knob stops; Power and Mode are
#              sent when you tap (a timeout discards them). Brightness has
#              two steps: Awake, then Sleep.
#   Anywhere   hold 0.7-3 s then release = fireplace on/off (on = the
#              selected mode). A press held longer than 3 s is treated as a
#              stuck button and ignored. 10 s without input -> Sleep.
#   Battery    30 s without input -> the board asks its hardware package to
#              power off (hw-m5dial: release the power latch). On battery the
#              Dial switches off (~6 uA) and a tap powers it back on (cold
#              boot, cached temperature shown until HA reconnects). On USB the
#              latch has no effect, so the board stays on and falls back to:
#   Display Off  Sleep + fireplace off for 30 s -> backlight fully off and
#              Wi-Fi modem power save (only on boards that cannot detect
#              external power; on the Dial on USB the Sleep screen stays on).
#
# Only a long press (or Power in Settings) ever lights the fireplace.
#
# Which fireplace it controls is set entirely by the substitutions below; the
# device files (../fireplace-knob-living-room.yaml, ...) override them. The
# packages live in this subdirectory so the ESPHome Device Builder does not
# list them as devices.
#
# Home Assistant must allow this device to perform actions (ESPHome device
# options -> "Allow the device to perform Home Assistant actions"), otherwise
# every knob command is silently dropped.
substitutions:
  device_name: fireplace-knob
  friendly_name: Fireplace Knob
  fireplace_name: Fireplace

  # ---- Home Assistant entities (override per fireplace) ----
  fireplace_switch: switch.living_room_fireplace
  climate_entity: climate.living_room_fireplace_mode
  flame_number: number.living_room_fireplace_flame_height
  fan_number: number.living_room_fireplace_fan_speed
  light_switch: switch.living_room_fireplace_light
  # Optional alternative room-temperature sensor, selectable from the knob's
  # HA device page ("Room Temperature Source").
  alt_temp_entity: sensor.main_floor_temperature
  alt_temp_label: "Living room"

  # ---- Behaviour ----
  temp_step: "1.0"          # degrees per knob detent
  temp_min: "55"
  temp_max: "85"
  temp_default: "70"        # used until HA reports a set point
  temp_format: "%.0f"       # "%.1f" for 0.5-degree steps
  flame_max: "6"
  fan_max: "6"
  rotation_sign: "1"        # set to "-1" if the knob turns the wrong way
  hold_hint_ms: 200ms       # held this long: "Turning ON in 3" appears
  hold_count: "3"           # ...then counts down one per second; at 0 = on/off
  setpoint_timeout_s: "10"  # Set Point -> Main
  sleep_after_s: "10"       # any screen -> Sleep
  display_off_after_s: "30" # Sleep + fireplace off -> backlight off (USB)
  display_off_enabled: "true"  # hw packages with their own sleep (Dial) set false
  power_off_after_s: "30"   # no input for this long -> idle sleep (battery)
  light_sleep_minutes: "10" # Dial: light sleep this long, then full power-off
  refresh_every_s: "60"     # Dial: during light sleep, reconnect to HA this often
  awake_brightness_default: "100"
  # Wording that must fit the screen; the ui-*.yaml packages override these.
  txt_no_ha: "No HA link"
  txt_fp_offline_short: "Fireplace offline"
  txt_fp_offline: "Fireplace not reachable"
  txt_connecting: "Connecting to Home Assistant..."
  txt_conn_failed: "Could not connect to Home Assistant"
  txt_wait_data: "Loading fireplace data..."
  txt_wait_data_failed: "Connected, but no fireplace data"
  connect_timeout_s: "30"   # spinner -> error after this long without HA
  arc_radius: "200"               # radius of the settings icon arc (ui-*.yaml overrides)
  sleep_brightness_default: "25"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2
  includes:
    - fireplace-knob/knob_helpers.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(last_activity_ms) = millis();
            id(disconnected_since_ms) = millis();
            id(apply_backlight)->execute();
            id(render)->execute();           // loading screen until HA data is complete
        # The wake press is still down (and not yet debounced) when we start:
        # ignore the button until it has been released (see the interval).
        - lambda: 'id(guard_ms) = millis();'

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}"
    password: !secret fireplace_knob_ap_password

captive_portal:

logger:
  level: DEBUG
  logs:
    lvgl: INFO
    sensor: INFO
    text_sensor: INFO
    homeassistant.sensor: INFO
    homeassistant.text_sensor: INFO

api:
  encryption:
    key: !secret fireplace_knob_api_key
  on_client_connected:
    - lambda: 'id(stale_ok) = false;'
    - script.execute: render
    # A fireplace on/off that was requested while disconnected fires now.
    - delay: 1500ms
    - if:
        condition:
          lambda: 'return id(pending_toggle) && api::global_api_server->is_connected();'
        then:
          - lambda: 'id(pending_toggle) = false;'
          - script.execute: toggle_fireplace
  on_client_disconnected:
    - lambda: |-
        if (!api::global_api_server->is_connected()) {
          id(disconnected_since_ms) = millis(); id(conn_timed_out) = false;
          // Values already received stay on screen through any disconnect (HA
          // refreshes them silently when it is back); only the first boot
          // waits on the loading screen.
        }
    - script.execute: render

ota:
  - platform: esphome
    password: !secret fireplace_knob_ota_password
# ------------------------------------------------------------------
# State
# ------------------------------------------------------------------
# page: 0 Sleep, 1 Main, 2 Set Point, 3 Settings,
#       4 Power, 5 Mode, 6 Fan, 7 Light, 8 Flame, 9 Brightness (edit screens)
globals:
  - id: page
    type: int
    initial_value: "0"
  - id: settings_sel        # highlighted row in Settings
    type: int
    initial_value: "0"
  - id: bright_step         # Brightness edit: 0 = Awake, 1 = Sleep
    type: int
    initial_value: "0"
  - id: mode_sel            # 0 Manual, 1 Thermostat, 2 Smart (committed)
    type: int
    restore_value: true
    initial_value: "1"
  - id: mode_edit           # value being chosen on the Mode screen
    type: int
    initial_value: "0"
  - id: power_edit          # value being chosen on the Power screen
    type: bool
    initial_value: "false"
  - id: mode_pending
    type: bool
    initial_value: "false"
  - id: setpoint            # what the knob shows / last sent
    type: float
    restore_value: true
    initial_value: "${temp_default}"
  - id: temp_pending
    type: bool
    initial_value: "false"
  - id: flame_target        # live flame height from HA (while burning)
    type: int
    initial_value: "0"
  - id: flame_saved         # flame height to light with in Manual (knob-set)
    type: int
    restore_value: true
    initial_value: "3"
  - id: flame_pending
    type: bool
    initial_value: "false"
  - id: fan_target
    type: int
    initial_value: "0"
  - id: fan_pending
    type: bool
    initial_value: "false"
  - id: light_target
    type: bool
    initial_value: "false"
  - id: light_pending
    type: bool
    initial_value: "false"
  - id: hold_hinted         # "Turning ... in 3" was shown: this press is a hold, not a tap
    type: bool
    initial_value: "false"
  - id: hold_count          # countdown while held; the fireplace toggles when it hits 0
    type: int
    initial_value: "0"
  - id: press_from_sleep    # the current press started on the Sleep screen
    type: bool
    initial_value: "false"
  - id: last_activity_ms
    type: uint32_t
    initial_value: "0"
  - id: toast_until_ms
    type: uint32_t
    initial_value: "0"
  - id: pending_toggle      # fireplace on/off requested while HA was disconnected
    type: bool
    initial_value: "false"
  - id: last_connected      # HA connection state as last drawn
    type: bool
    initial_value: "false"
  - id: disconnected_since_ms   # boot or the last API disconnect
    type: uint32_t
    initial_value: "0"
  - id: conn_timed_out      # spinner replaced by the error text
    type: bool
    initial_value: "false"
  # One flag per HA value the screens use. The UI stays on the loading screen
  # until HA is connected and all of them have arrived (NaN/"unavailable"
  # count as arrived: that is a real answer). Cleared on every disconnect.
  - id: got_fp
    type: bool
    initial_value: "false"
  - id: got_light
    type: bool
    initial_value: "false"
  - id: got_preset
    type: bool
    initial_value: "false"
  - id: got_setpoint
    type: bool
    initial_value: "false"
  - id: got_room
    type: bool
    initial_value: "false"
  - id: got_flame
    type: bool
    initial_value: "false"
  - id: got_fan
    type: bool
    initial_value: "false"
  - id: loading_shown       # the loading screen is the active screen
    type: bool
    initial_value: "true"
  - id: stale_ok            # woke from light sleep with a complete data set in RAM:
    type: bool              # show it and refresh silently when HA reconnects
    initial_value: "false"
  - id: idle_sleeping       # board is in its idle sleep (screen must stay dark)
    type: bool
    initial_value: "false"
  - id: display_off         # Sleep with the backlight fully off
    type: bool
    initial_value: "false"
  - id: sleep_since_ms
    type: uint32_t
    initial_value: "0"
  - id: power_off_tried     # one power-off attempt per idle period
    type: bool
    initial_value: "false"
  - id: boot_guard          # ignore the button until its first release after boot/wake
    type: bool
    initial_value: "true"
  - id: guard_ms            # when the guard was armed (auto-clears after 1 s released)
    type: uint32_t
    initial_value: "0"
  - id: cache_temp          # last room temperature, shown until HA reconnects
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: cache_fp_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: battery_pct         # NaN when the board has no fuel gauge
    type: float
    initial_value: "NAN"
  - id: battery_charging
    type: bool
    initial_value: "false"
  - id: battery_absent      # gauge present but no cell connected
    type: bool
    initial_value: "false"
  - id: on_usb              # external power present (boards that can tell); false otherwise
    type: bool
    initial_value: "false"

# ------------------------------------------------------------------
# Home Assistant: settings exposed on the device page
# ------------------------------------------------------------------
number:
  - platform: template
    id: awake_brightness
    name: Awake Brightness
    icon: mdi:brightness-7
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: ${awake_brightness_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: 'id(apply_backlight)->execute();'
  - platform: template
    id: sleep_brightness
    name: Sleep Brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: ${sleep_brightness_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: 'id(apply_backlight)->execute();'

select:
  - platform: template
    id: temp_source
    name: Room Temperature Source
    icon: mdi:home-thermometer-outline
    entity_category: config
    options: ["Fireplace", "${alt_temp_label}"]
    initial_option: "Fireplace"
    restore_value: true
    optimistic: true
    set_action:
      - script.execute: render

# ------------------------------------------------------------------
# Home Assistant state mirrors
# ------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_fireplace
    entity_id: ${fireplace_switch}
    on_value:
      - lambda: 'id(got_fp) = true; if (x == "on" || x == "off") id(cache_fp_on) = (x == "on");'
      - script.execute: render
  - platform: homeassistant
    id: ha_light
    entity_id: ${light_switch}
    on_value:
      - lambda: 'id(got_light) = true; id(light_pending) = false;'
      - script.execute: render
  - platform: homeassistant
    id: ha_preset
    entity_id: ${climate_entity}
    attribute: preset_mode
    on_value:
      # Follow the fireplace's real mode (remote, HA, automations). "Off" is
      # ignored so the knob remembers which mode to light it in next time.
      - lambda: |-
          id(got_preset) = true;
          if (id(mode_pending)) return;
          if (x == "Manual") id(mode_sel) = 0;
          else if (x == "Thermostat") id(mode_sel) = 1;
          else if (x == "Smart") id(mode_sel) = 2;
      - script.execute: render

sensor:
  - platform: homeassistant
    id: ha_setpoint
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      # null in Off/Manual on the Proflame integrations -> NaN; keep ours.
      - lambda: |-
          id(got_setpoint) = true;
          if (!std::isnan(x) && !id(temp_pending)) id(setpoint) = x;
      - script.execute: render
  - platform: homeassistant
    id: ha_room_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      - lambda: 'id(got_room) = true; if (!std::isnan(x)) id(cache_temp) = x;'
      - script.execute: render
  - platform: homeassistant
    id: ha_alt_temp
    entity_id: ${alt_temp_entity}
    on_value:
      - script.execute: render
  - platform: homeassistant
    id: ha_flame
    entity_id: ${flame_number}
    on_value:
      - lambda: |-
          id(got_flame) = true;
          if (!std::isnan(x) && !id(flame_pending)) {
            id(flame_target) = (int) lroundf(x);
            if (id(flame_target) > 0) id(flame_saved) = id(flame_target);
          }
      - script.execute: render
  - platform: homeassistant
    id: ha_fan
    entity_id: ${fan_number}
    on_value:
      - lambda: |-
          id(got_fan) = true;
          if (!std::isnan(x) && !id(fan_pending)) id(fan_target) = (int) lroundf(x);
      - script.execute: render
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
    entity_category: diagnostic
binary_sensor:
  - platform: status
    name: Status
button:
  - platform: restart
    name: Restart
    entity_category: config

# ------------------------------------------------------------------
# Behaviour
# ------------------------------------------------------------------
script:
  # Backlight for the current screen (Sleep brightness on page 0, otherwise
  # Awake). While editing the Sleep brightness the screen previews it.
  - id: apply_backlight
    then:
      - lambda: |-
          if (id(display_off) || id(idle_sleeping)) { id(display_backlight).turn_off().perform(); return; }
          float pct = id(awake_brightness).state;
          if (!id(loading_shown) && (id(page) == 0 || (id(page) == 9 && id(bright_step) == 1))) pct = id(sleep_brightness).state;
          if (std::isnan(pct)) pct = 100;
          if (pct <= 0) { id(display_backlight).turn_off().perform(); return; }
          auto call = id(display_backlight).turn_on();
          call.set_brightness(pct / 100.0f);
          call.perform();

  # Switch screen. Entering an edit screen seeds its temporary value.
  - id: go
    parameters: {to: int}
    then:
      - lambda: |-
          const bool fp_on = id(ha_fireplace).state == "on";
          id(page) = to;
          if (to == 0) id(sleep_since_ms) = millis();
          switch (to) {
            case 3: break;
            case 4: id(power_edit) = fp_on; break;
            case 5: id(mode_edit) = id(mode_sel); break;
            case 9: id(bright_step) = 0; break;
          }
          id(apply_backlight)->execute();
          id(render)->execute();
          if (id(loading_shown)) return;   // render() moves off the loading screen when data is complete
          lv_obj_t *scr = id(page_value)->obj;
          if (to == 0) scr = id(page_sleep)->obj;
          else if (to == 1) scr = id(page_main)->obj;
          if (lv_screen_active() != scr) lv_screen_load(scr);

  - id: wake
    then:
      - lambda: |-
          id(last_activity_ms) = millis();
          id(power_off_tried) = false;
          if (id(idle_sleeping)) {
            // Input during the awake-dark refresh window: resume; a press only wakes.
            if (id(knob_button).state) { id(boot_guard) = true; id(guard_ms) = millis(); }
            id(board_resume)->execute("input");
          }
          if (id(display_off)) {
            id(display_off) = false;
            knob_wifi_power_save(false);
            id(apply_backlight)->execute();
          }

  # Hold: after `hold_hint_ms` the screen shows "Turning ON in 3" and counts
  # down once a second while the button stays held; at 0 the fireplace
  # toggles. Releasing at any point before that aborts (and is not a tap).
  - id: long_press_timer
    mode: restart
    then:
      - script.execute: wake
      - if:
          condition:
            lambda: 'return id(loading_shown) || id(boot_guard);'
          then:
            - script.stop: long_press_timer
      - delay: ${hold_hint_ms}
      - lambda: |-
          if (id(page) == 0) id(go)->execute(1);
          id(hold_hinted) = true;
          id(hold_count) = ${hold_count};
      - while:
          condition:
            lambda: 'return id(hold_count) > 0;'
          then:
            - lambda: |-
                char t[32];
                snprintf(t, sizeof(t), "Turning %s\nin %d", id(ha_fireplace).state == "on" ? "OFF" : "ON", id(hold_count));
                id(show_toast)->execute(t, 1500);
            - delay: 1s
            - lambda: 'id(hold_count)--;'
      - script.execute: toggle_fireplace

  # Called by the board's button binary_sensor.
  - id: button_down
    then:
      - if:
          condition:
            lambda: 'return id(boot_guard);'
          then: []
          else:
            - lambda: |-
                id(hold_hinted) = false;
                id(press_from_sleep) = id(page) == 0;
            - script.execute: long_press_timer

  - id: button_up
    then:
      - script.stop: long_press_timer
      - lambda: |-
          id(toast_until_ms) = 0;
          lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
      - if:
          condition:
            lambda: |-
              if (id(boot_guard)) { id(boot_guard) = false; return true; }   // the wake press
              return id(hold_hinted);   // a hold (completed or aborted) is not a tap
          then: []
          else:
            - script.execute: tap

  - id: show_toast
    parameters: {text: string, ms: int}
    then:
      - lambda: |-
          lv_label_set_text(id(toast_label), text.c_str());
          lv_obj_remove_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          id(toast_until_ms) = millis() + ms;

  # Rows of the Settings list for the current state. Returns the count and
  # fills ids: 4 Power, 5 Mode, 6 Fan, 7 Light, 8 Flame, 9 Brightness, 1 Back.
  - id: tap
    then:
      - lambda: |-
          id(wake)->execute();
          if (id(loading_shown)) return;
          const bool fp_on = id(ha_fireplace).state == "on";
          const int p = id(page);
          if (id(press_from_sleep)) { id(go)->execute(1); return; }   // just wake
          switch (p) {
            case 0: id(go)->execute(1); break;
            case 1: id(settings_sel) = 0; id(go)->execute(3); break;
            case 2: id(go)->execute(1); break;
            case 3: {
              int rows[8]; int n = settings_rows(rows, fp_on, id(mode_sel));
              int sel = std::min(id(settings_sel), n - 1);
              id(go)->execute(rows[sel]);
              break;
            }
            case 4:
              if (id(power_edit) != fp_on) id(toggle_fireplace)->execute();
              id(go)->execute(3);
              break;
            case 5:
              if (id(mode_edit) != id(mode_sel)) {
                id(mode_sel) = id(mode_edit);
                if (fp_on) { id(mode_pending) = true; id(send_mode)->execute(); }
              }
              id(go)->execute(3);
              break;
            case 9:
              if (id(bright_step) == 0) { id(bright_step) = 1; id(apply_backlight)->execute(); id(render)->execute(); }
              else id(go)->execute(3);
              break;
            default: id(go)->execute(3); break;   // Fan, Light, Flame
          }

  - id: knob_turn
    parameters: {dir: int}
    then:
      - lambda: |-
          id(wake)->execute();
          if (id(loading_shown)) return;
          const bool fp_on = id(ha_fireplace).state == "on";
          int p = id(page);
          if (p == 0 || p == 1) { id(go)->execute(2); p = 2; }   // first click counts
          switch (p) {
            case 2: {
              if (id(mode_sel) == 0) {                 // Manual: flame height
                id(adjust_flame)->execute(dir);
              } else {
                float t = id(setpoint) + dir * ${temp_step};
                id(setpoint) = std::min((float) ${temp_max}, std::max((float) ${temp_min}, t));
                id(temp_pending) = true;
                id(send_temp)->execute();
              }
              break;
            }
            case 3: {
              int rows[8]; int n = settings_rows(rows, fp_on, id(mode_sel));
              id(settings_sel) = std::min(n - 1, std::max(0, id(settings_sel) + dir));   // stops at the ends
              break;
            }
            case 4: id(power_edit) = dir > 0; break;
            case 5: id(mode_edit) = std::min(2, std::max(0, id(mode_edit) + dir)); break;
            case 6: {
              int f = std::min(${fan_max}, std::max(0, id(fan_target) + dir));
              if (f != id(fan_target)) { id(fan_target) = f; id(fan_pending) = true; id(send_fan)->execute(); }
              break;
            }
            case 7: {
              bool want = dir > 0;
              bool cur = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
              if (want != cur) { id(light_target) = want; id(light_pending) = true; id(send_light)->execute(); }
              break;
            }
            case 8: id(adjust_flame)->execute(dir); break;
            case 9: {
              auto *n = id(bright_step) == 0 ? (number::Number *) id(awake_brightness) : (number::Number *) id(sleep_brightness);
              float lo = id(bright_step) == 0 ? 10 : 0;
              float v = std::min(100.0f, std::max(lo, n->state + dir * 5));
              if (v != n->state) n->make_call().set_value(v).perform();
              break;
            }
          }
          id(render)->execute();

  # On: light it in the selected mode (Manual uses the last flame height).
  - id: toggle_fireplace
    then:
      - if:
          condition:
            lambda: 'return !api::global_api_server->is_connected();'
          then:
            - lambda: |-
                id(pending_toggle) = true;
                id(show_toast)->execute("Waiting for HA...", 6000);
            - script.stop: toggle_fireplace
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - script.execute: {id: show_toast, text: "Turning OFF", ms: 2500}
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${fireplace_switch}
          else:
            - lambda: |-
                static const char *M[] = {"Turning ON\nManual", "Turning ON\nThermostat", "Turning ON\nSmart"};
                id(show_toast)->execute(M[id(mode_sel)], 2500);
            - homeassistant.action:
                action: climate.set_preset_mode
                data:
                  entity_id: ${climate_entity}
                data_template:
                  preset_mode: "{{ m }}"
                variables:
                  m: !lambda |-
                    static const char *M[] = {"Manual", "Thermostat", "Smart"};
                    return std::string(M[id(mode_sel)]);
            # Manual: light with the knob's stored flame height.
            - if:
                condition:
                  lambda: 'return id(mode_sel) == 0;'
                then:
                  - delay: 3s
                  - homeassistant.action:
                      action: number.set_value
                      data:
                        entity_id: ${flame_number}
                      data_template:
                        value: "{{ v }}"
                      variables:
                        v: !lambda 'return id(flame_saved);'

  # Flame height. Burning: send it (debounced). Off: only store it, because
  # a flame > 0 sent to an off Proflame lights it; toggle_fireplace sends
  # the stored value right after a Manual turn-on.
  - id: adjust_flame
    parameters: {dir: int}
    then:
      - lambda: |-
          const bool fp_on = id(ha_fireplace).state == "on";
          int cur = fp_on ? id(flame_target) : id(flame_saved);
          int f = std::min(${flame_max}, std::max(1, cur + dir));
          if (f == cur) return;
          id(flame_saved) = f;
          if (fp_on) { id(flame_target) = f; id(flame_pending) = true; id(send_flame)->execute(); }

  # Debounced: one HA call after the knob stops turning.
  - id: send_temp
    mode: restart
    then:
      - delay: 900ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_entity}
          data_template:
            temperature: "{{ t }}"
          variables:
            t: !lambda 'return id(setpoint);'
      - delay: 4s
      - lambda: 'id(temp_pending) = false;'
      - script.execute: render

  - id: send_mode
    mode: restart
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: ${climate_entity}
          data_template:
            preset_mode: "{{ m }}"
          variables:
            m: !lambda |-
              static const char *M[] = {"Manual", "Thermostat", "Smart"};
              return std::string(M[id(mode_sel)]);
      - delay: 5s
      - lambda: 'id(mode_pending) = false;'
      - script.execute: render

  - id: send_flame
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${flame_number}
                data_template:
                  value: "{{ v }}"
                variables:
                  v: !lambda 'return id(flame_target);'
      - delay: 4s
      - lambda: 'id(flame_pending) = false;'
      - script.execute: render

  - id: send_fan
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: ${fan_number}
          data_template:
            value: "{{ v }}"
          variables:
            v: !lambda 'return id(fan_target);'
      - delay: 4s
      - lambda: 'id(fan_pending) = false;'
      - script.execute: render

  - id: send_light
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(light_target);'
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: ${light_switch}
          else:
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${light_switch}
      - delay: 5s
      - lambda: 'id(light_pending) = false;'
      - script.execute: render

  - id: render
    then:
      - lambda: |-
          // ---- Loading gate: nothing but the spinner until HA is connected and
          // every value we display has arrived. ----
          {
            const bool conn = api::global_api_server->is_connected();
            const bool have_all = id(got_fp) && id(got_light) && id(got_preset) && id(got_setpoint) &&
                                  id(got_room) && id(got_flame) && id(got_fan);
            // Once a full set has arrived it is shown regardless of the link.
            const bool ready = have_all;
            if (!ready) {
              if (id(conn_timed_out)) {
                lv_obj_add_flag(id(load_spinner), LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(load_text), conn ? "${txt_wait_data_failed}" : "${txt_conn_failed}");
                lv_obj_set_style_text_color(id(load_text), lv_color_hex(0xFF4A2A), 0);
              } else {
                lv_obj_remove_flag(id(load_spinner), LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(load_text), conn ? "${txt_wait_data}" : "${txt_connecting}");
                lv_obj_set_style_text_color(id(load_text), lv_color_hex(0x9A9A9A), 0);
              }
              if (lv_screen_active() != id(page_loading)->obj) lv_screen_load(id(page_loading)->obj);
              id(loading_shown) = true;
              return;
            }
            if (id(loading_shown)) {       // first complete data set: show Main
              id(loading_shown) = false;
              id(last_activity_ms) = millis();
              id(go)->execute(1);
              return;                      // go() re-renders
            }
          }
          static const uint32_t ORANGE = 0xFF7A1A, RED = 0xFF4A2A, CYAN = 0x38BDF8,
                                YELLOW = 0xFACC15, PURPLE = 0xA78BFA, GREEN = 0x4ADE80,
                                GREY = 0x5A5A5A, DIM = 0x333333, WHITE = 0xFFFFFF,
                                SUB = 0x9A9A9A;
          static const char *MODE_UP[] = {"MANUAL", "THERMOSTAT", "SMART"};
          static const char *MODE_MC[] = {"Manual", "Thermostat", "Smart"};
          char buf[64];
          const bool connected = api::global_api_server->is_connected();
          id(last_connected) = connected;
          // Short link drops (HA reconnecting after a wake) are not surfaced at
          // all; after 5 s the status row says "Connecting", after the timeout
          // "No HA". Values stay on screen throughout.
          const bool quiet = !connected && (millis() - id(disconnected_since_ms)) < 5000u;
          const bool connecting = !connected && !id(conn_timed_out) && !quiet;
          const bool conn_issue = !connected && !quiet;
          std::string fp = id(ha_fireplace).state;
          const bool fp_on = fp == "on";
          const bool fp_known = fp == "on" || fp == "off";
          const int m = id(mode_sel);
          const int p = id(page);
          const bool manual_flame = (m == 0);
          const int flame_shown = fp_on ? id(flame_target) : id(flame_saved);

          // ---- room temperature: selected source, falling back to the other
          // one when it has no reading (fireplace offline, sensor unavailable).
          const float fp_temp = id(ha_room_temp).state, alt_temp = id(ha_alt_temp).state;
          bool alt = id(temp_source).current_option() == "${alt_temp_label}";
          float room = alt ? alt_temp : fp_temp;
          if (std::isnan(room)) room = alt ? fp_temp : alt_temp;
          const bool room_cached = false;   // nothing stale is shown; the loading screen covers it
          if (std::isnan(room)) snprintf(buf, sizeof(buf), "--");
          else snprintf(buf, sizeof(buf), "%.0f\u00B0", room);
          lv_label_set_text(id(sleep_temp), buf);
          lv_label_set_text(id(main_temp), buf);
          const bool fresh_ui = connected || quiet;
          lv_obj_set_style_text_color(id(sleep_temp), lv_color_hex(fresh_ui && !room_cached ? WHITE : GREY), 0);
          lv_obj_set_style_text_color(id(main_temp), lv_color_hex(fresh_ui && !room_cached ? WHITE : GREY), 0);

          // ---- status rows (Main and Set Point) ----
          const char *st_icon = fp_on ? "\U000F0238" : "\U000F1722";
          const char *st_text = connecting ? "Connecting" : conn_issue ? "${txt_no_ha}" : !fp_known ? "${txt_fp_offline_short}" : fp_on ? MODE_MC[m] : "OFF";
          // Spinner next to the status while (re)connecting; the flame icon hides meanwhile.
          if (connecting) { lv_obj_remove_flag(id(conn_spinner), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(status_icon_m), LV_OBJ_FLAG_HIDDEN); }
          else { lv_obj_add_flag(id(conn_spinner), LV_OBJ_FLAG_HIDDEN); lv_obj_remove_flag(id(status_icon_m), LV_OBJ_FLAG_HIDDEN); }
          lv_obj_t *sicons[] = {id(status_icon_m), id(status_icon_v)};
          lv_obj_t *stexts[] = {id(status_text_m), id(status_text_v)};
          for (int i = 0; i < 2; i++) {
            lv_label_set_text(sicons[i], st_icon);
            lv_obj_set_style_text_color(sicons[i], lv_color_hex(fp_on ? ORANGE : GREY), 0);
            lv_label_set_text(stexts[i], st_text);
            lv_obj_set_style_text_color(stexts[i], lv_color_hex(fp_on ? ORANGE : SUB), 0);
          }

          // ---- Battery (boards with a fuel gauge): icon + % at the top of Main ----
          {
            const float b = id(battery_pct);
            if (std::isnan(b) || id(battery_absent)) lv_obj_add_flag(id(main_batt), LV_OBJ_FLAG_HIDDEN);
            else {
              lv_obj_remove_flag(id(main_batt), LV_OBJ_FLAG_HIDDEN);
              const char *ic = id(battery_charging) ? "\U000F0084"
                               : b <= 15 ? "\U000F10CD" : b <= 35 ? "\U000F007B" : b <= 65 ? "\U000F007E" : b <= 90 ? "\U000F0081" : "\U000F0079";
              lv_label_set_text(id(batt_icon), ic);
              snprintf(buf, sizeof(buf), "%.0f%%", b);
              lv_label_set_text(id(batt_text), buf);
              uint32_t col = id(battery_charging) ? CYAN : b <= 15 ? RED : b <= 35 ? YELLOW : GREEN;
              lv_obj_set_style_text_color(id(batt_icon), lv_color_hex(col), 0);
              lv_obj_set_style_text_color(id(batt_text), lv_color_hex(b <= 15 ? RED : SUB), 0);
            }
          }

          // ---- Sleep: charging bolt only while charging ----
          if (id(battery_charging) && !id(battery_absent) && !std::isnan(id(battery_pct))) lv_obj_remove_flag(id(sleep_charging), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(sleep_charging), LV_OBJ_FLAG_HIDDEN);

          // ---- Sleep: big flame (on) or crossed flame (off), readable from afar ----
          lv_label_set_text(id(sleep_flame), fp_on ? "\U000F0238" : "\U000F1722");
          lv_obj_set_style_text_color(id(sleep_flame), lv_color_hex(fp_on ? ORANGE : GREY), 0);
          lv_obj_remove_flag(id(sleep_flame), LV_OBJ_FLAG_HIDDEN);

          // ---- Main ----
          if (manual_flame) snprintf(buf, sizeof(buf), "Flame %d", flame_shown);
          else snprintf(buf, sizeof(buf), "Set ${temp_format}\u00B0", id(setpoint));
          lv_label_set_text(id(main_set), buf);
          lv_obj_set_style_text_color(id(main_set), lv_color_hex(!fresh_ui ? GREY : fp_on ? ORANGE : SUB), 0);
          // Fan + light as icons: "<fan> 4   <bulb>" (bulb lit = light on).
          // main_info carries the connection / fireplace-offline messages instead.
          const bool show_msg = conn_issue || !fp_known;
          if (connecting) lv_label_set_text(id(main_info), "${txt_connecting}");
          else if (conn_issue) lv_label_set_text(id(main_info), "${txt_conn_failed}");
          else if (!fp_known) lv_label_set_text(id(main_info), "${txt_fp_offline}");
          if (show_msg) { lv_obj_remove_flag(id(main_info), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(main_stats), LV_OBJ_FLAG_HIDDEN); }
          else { lv_obj_add_flag(id(main_info), LV_OBJ_FLAG_HIDDEN); lv_obj_remove_flag(id(main_stats), LV_OBJ_FLAG_HIDDEN); }
          snprintf(buf, sizeof(buf), "%d", id(fan_target));
          lv_label_set_text(id(stat_fan_value), id(fan_target) > 0 ? buf : "");   // no "0": the slashed icon says it
          lv_label_set_text(id(stat_fan_icon), id(fan_target) > 0 ? "\U000F0210" : "\U000F081D");   // fan / fan-off
          lv_obj_set_style_text_color(id(stat_fan_icon), lv_color_hex(id(fan_target) > 0 ? CYAN : GREY), 0);
          lv_obj_set_style_text_color(id(stat_fan_value), lv_color_hex(id(fan_target) > 0 ? WHITE : GREY), 0);
          const bool light_on = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
          lv_label_set_text(id(stat_light_icon), light_on ? "\U000F0335" : "\U000F0E50");   // bulb / bulb-off-outline
          lv_obj_set_style_text_color(id(stat_light_icon), lv_color_hex(light_on ? YELLOW : GREY), 0);
          lv_label_set_text(id(main_hint), manual_flame ? "Tap: settings   Turn: flame" : "Tap: settings   Turn: set temp");

          // ---- Settings arc + Value page ----
          // Pages 2..9 all draw on page_value. Page 3 (Settings) shows only
          // the arc of setting icons at the top (no ring, no title icon) and
          // previews the highlighted setting's value below it; pages 4..9 edit
          // that setting (icons hidden, ring + title icon shown); page 2 (Set
          // Point) is like an edit page.
          if (p >= 2) {
            static const char *ICON_OF[] = {"", "\U000F004D", "", "", "\U000F0425", "\U000F1542", "\U000F0210", "\U000F0335", "\U000F0238", "\U000F00E0"};
            static const uint32_t ACCENT_OF[] = {0, 0x9A9A9A, 0, 0, GREEN, PURPLE, CYAN, YELLOW, RED, WHITE};
            const bool editing = p >= 4;
            int rows[8]; int n = settings_rows(rows, fp_on, m);
            int sel = std::min(id(settings_sel), n - 1);
            id(settings_sel) = sel;
            // The setting being shown: highlighted one while browsing, the
            // page itself while editing, nothing (-1) on Set Point.
            int view = (p == 3) ? rows[sel] : editing ? p : -1;
            if (editing) { for (int i = 0; i < n; i++) if (rows[i] == p) sel = i; }

            // Arc icons: N evenly spaced over the top, highlighted = big + accent.
            lv_obj_t *big[] = {id(arc_big_0), id(arc_big_1), id(arc_big_2), id(arc_big_3), id(arc_big_4), id(arc_big_5), id(arc_big_6)};
            lv_obj_t *small[] = {id(arc_small_0), id(arc_small_1), id(arc_small_2), id(arc_small_3), id(arc_small_4), id(arc_small_5), id(arc_small_6)};
            const bool show_arc = (p == 3);   // icons only while browsing
            const float span = std::min(144.0f, (n - 1) * 24.0f);
            for (int i = 0; i < 7; i++) {
              if (!show_arc || i >= n) { lv_obj_add_flag(big[i], LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(small[i], LV_OBJ_FLAG_HIDDEN); continue; }
              const float ang = (-span / 2 + i * (n > 1 ? span / (n - 1) : 0)) * 3.14159265f / 180.0f;
              const int32_t x = (int32_t) lroundf(${arc_radius} * sinf(ang)), y = (int32_t) lroundf(-${arc_radius} * cosf(ang));
              const int r = rows[i];
              lv_obj_t *show = (i == sel) ? big[i] : small[i];
              lv_obj_t *hide = (i == sel) ? small[i] : big[i];
              lv_obj_add_flag(hide, LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(show, LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(show, (r == 7 && !(id(light_pending) ? id(light_target) : id(ha_light).state == "on")) ? "\U000F0336" : ICON_OF[r]);
              lv_obj_set_x(show, x); lv_obj_set_y(show, y);
              uint32_t col = (i == sel) ? (r == 1 ? WHITE : ACCENT_OF[r]) : 0x6A6A6A;
              lv_obj_set_style_text_color(show, lv_color_hex(col), 0);
            }
            // No status row here (Main shows it). While browsing the arc the ring and
            // the title icon are hidden (the arc icon already identifies it).
            lv_obj_add_flag(id(status_row_v), LV_OBJ_FLAG_HIDDEN);   // Main already shows the state
            if (show_arc) { lv_obj_add_flag(id(ring), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(title_icon), LV_OBJ_FLAG_HIDDEN); }
            else { lv_obj_remove_flag(id(ring), LV_OBJ_FLAG_HIDDEN); lv_obj_remove_flag(id(title_icon), LV_OBJ_FLAG_HIDDEN); }

            uint32_t accent = ORANGE;
            const char *title = ""; const char *icon = "";
            bool show_mode_label = false, show_value = true;
            // Values shown: live state while browsing, the edit buffer while editing.
            const bool pw = editing ? id(power_edit) : fp_on;
            const int  md = editing ? id(mode_edit) : m;
            switch (view) {
              case -1:  // Set Point
                if (manual_flame) {
                  accent = RED; title = "FLAME"; icon = "\U000F0238";
                  snprintf(buf, sizeof(buf), "%d", flame_shown);
                  lv_label_set_text(id(value_label), buf);
                  lv_arc_set_range(id(ring), 0, ${flame_max});
                  lv_arc_set_value(id(ring), flame_shown);
                  lv_label_set_text(id(sub_label), !fp_on ? "Saved for next turn-on" : id(flame_pending) ? "Setting..." : "Flame 1 - ${flame_max}");
                } else {
                  accent = ORANGE; title = "SET TEMP"; icon = "\U000F050F";
                  snprintf(buf, sizeof(buf), "${temp_format}\u00B0", id(setpoint));
                  lv_label_set_text(id(value_label), buf);
                  lv_arc_set_range(id(ring), (int32_t) (${temp_min} * 10), (int32_t) (${temp_max} * 10));
                  lv_arc_set_value(id(ring), (int32_t) lroundf(id(setpoint) * 10));
                  if (id(temp_pending))      snprintf(buf, sizeof(buf), "Setting...");
                  else if (!fp_on)           snprintf(buf, sizeof(buf), "Saved for next turn-on");
                  else if (std::isnan(room)) snprintf(buf, sizeof(buf), "Room --");
                  else                       snprintf(buf, sizeof(buf), "Room %.0f\u00B0", room);
                  lv_label_set_text(id(sub_label), buf);
                }
                break;
              case 1: {  // Back
                accent = 0x9A9A9A; title = "BACK"; icon = "\U000F004D"; show_value = false;
                lv_arc_set_range(id(ring), 0, 1);
                lv_arc_set_value(id(ring), 0);
                lv_label_set_text(id(sub_label), "Tap: back to main");
                break;
              }
              case 4: {
                accent = GREEN; title = "POWER"; icon = "\U000F0425";
                lv_label_set_text(id(value_label), pw ? "ON" : "OFF");
                lv_arc_set_range(id(ring), 0, 1);
                lv_arc_set_value(id(ring), pw ? 1 : 0);
                if (!editing) snprintf(buf, sizeof(buf), "Tap to change");
                else if (pw != fp_on) snprintf(buf, sizeof(buf), "Tap to turn %s", pw ? "on" : "off");
                else snprintf(buf, sizeof(buf), "Turn right: on   left: off");
                lv_label_set_text(id(sub_label), buf);
                break;
              }
              case 5: {
                accent = PURPLE; title = "MODE"; icon = "\U000F1542"; show_mode_label = true;
                static const char *HINT[] = {"You set flame + fan", "Auto flame, you set fan", "Smart flame, you set fan"};
                lv_label_set_text(id(mode_label), MODE_UP[md]);
                lv_arc_set_range(id(ring), 0, 3);
                lv_arc_set_value(id(ring), md + 1);
                if (!editing) snprintf(buf, sizeof(buf), "Tap to change");
                else if (md != m) snprintf(buf, sizeof(buf), "Tap to apply");
                else if (fp_on) snprintf(buf, sizeof(buf), "%s", HINT[m]);
                else snprintf(buf, sizeof(buf), "Used at next turn-on");
                lv_label_set_text(id(sub_label), buf);
                break;
              }
              case 6: {
                accent = CYAN; title = "FAN SPEED"; icon = "\U000F0210";
                int f = id(fan_target);
                if (f <= 0) snprintf(buf, sizeof(buf), "OFF"); else snprintf(buf, sizeof(buf), "%d", f);
                lv_label_set_text(id(value_label), buf);
                lv_arc_set_range(id(ring), 0, ${fan_max});
                lv_arc_set_value(id(ring), f);
                lv_label_set_text(id(sub_label), !editing ? "Tap to change" : id(fan_pending) ? "Setting..." : "Speed 0 - ${fan_max}");
                break;
              }
              case 7: {
                accent = YELLOW; title = "LIGHT";
                bool lon = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
                icon = lon ? "\U000F0335" : "\U000F0336";
                lv_label_set_text(id(value_label), lon ? "ON" : "OFF");
                lv_arc_set_range(id(ring), 0, 1);
                lv_arc_set_value(id(ring), lon ? 1 : 0);
                lv_label_set_text(id(sub_label), !editing ? "Tap to change" : "Turn right: on   left: off");
                break;
              }
              case 8: {
                accent = RED; title = "FLAME"; icon = "\U000F0238";
                snprintf(buf, sizeof(buf), "%d", flame_shown);
                lv_label_set_text(id(value_label), buf);
                lv_arc_set_range(id(ring), 0, ${flame_max});
                lv_arc_set_value(id(ring), flame_shown);
                lv_label_set_text(id(sub_label), !editing ? "Tap to change" : !fp_on ? "Saved for next turn-on"
                                  : id(flame_pending) ? "Setting..." : "Flame 1 - ${flame_max}");
                break;
              }
              case 9: {
                accent = WHITE; icon = "\U000F00E0";
                bool sl = editing && id(bright_step) == 1;
                title = sl ? "SLEEP LEVEL" : "BRIGHTNESS";
                float v = sl ? id(sleep_brightness).state : id(awake_brightness).state;
                snprintf(buf, sizeof(buf), "%.0f", v);
                lv_label_set_text(id(value_label), buf);
                lv_arc_set_range(id(ring), 0, 100);
                lv_arc_set_value(id(ring), (int32_t) v);
                lv_label_set_text(id(sub_label), !editing ? "Tap to change" : sl ? "Tap to finish" : "Tap for sleep level");
                break;
              }
            }
            lv_label_set_text(id(title_label), title);
            lv_label_set_text(id(title_icon), icon);
            if (show_mode_label) {
              lv_obj_add_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(mode_label), LV_OBJ_FLAG_HIDDEN);
            } else {
              if (show_value) lv_obj_remove_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(mode_label), LV_OBJ_FLAG_HIDDEN);
            }
            if (connecting) lv_label_set_text(id(sub_label), "${txt_connecting}");
            else if (conn_issue) lv_label_set_text(id(sub_label), "${txt_conn_failed}");
            else if (!fp_known && view != 1) lv_label_set_text(id(sub_label), "${txt_fp_offline}");
            lv_obj_set_style_arc_color(id(ring), lv_color_hex(accent), LV_PART_INDICATOR);
            lv_obj_set_style_text_color(id(title_icon), lv_color_hex(accent), 0);
            lv_obj_set_style_text_color(id(value_label), lv_color_hex(fresh_ui ? WHITE : GREY), 0);
            lv_obj_set_style_text_color(id(mode_label), lv_color_hex(fresh_ui ? WHITE : GREY), 0);
          }

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(toast_until_ms) != 0 && (int32_t) (now - id(toast_until_ms)) >= 0) {
            id(toast_until_ms) = 0;
            lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          }
          // Redraw as soon as the HA connection state changes, whatever the
          // order of connect/disconnect events during a reconnect.
          if (api::global_api_server->is_connected() != id(last_connected))
            id(render)->execute();
          // Connecting spinner -> error after connect_timeout_s without HA.
          if (id(loading_shown) && !id(conn_timed_out) &&
              (now - id(disconnected_since_ms)) >= ${connect_timeout_s}u * 1000u) {
            id(conn_timed_out) = true;
            id(render)->execute();
          }
          // The wake-press guard clears itself once the button is seen released
          // (or after 1 s if the sensor never saw the press at all).
          if (id(boot_guard) && !id(knob_button).state && (now - id(guard_ms)) > 1000u) id(boot_guard) = false;
          if (id(knob_button).state) return;   // a hold in progress never times out
          const bool fp_on = id(ha_fireplace).state == "on";
          // Display Off: Sleep + fireplace off for a while -> backlight off and
          // Wi-Fi modem sleep. The fireplace turning on brings the screen back.
          if (id(display_off) && fp_on) {
            id(display_off) = false;
            knob_wifi_power_save(false);
            id(apply_backlight)->execute();
          } else if (${display_off_enabled} && id(page) == 0 && !id(display_off) && !fp_on && !id(on_usb) &&
                     (now - id(sleep_since_ms)) >= ${display_off_after_s}u * 1000u) {
            // (never on external power: the Sleep screen stays on; the Dial
            // knows when it is on USB, the CrowPanel is always on USB-but-unknown)
            id(display_off) = true;
            knob_wifi_power_save(true);
            id(apply_backlight)->execute();
          }
          const uint32_t idle = (now - id(last_activity_ms)) / 1000;
          // Battery: hand over to the board's idle-sleep (Dial: light sleep,
          // then power-off). One attempt per idle period; on USB nothing.
          if (!id(power_off_tried) && !id(on_usb) && idle >= ${power_off_after_s}) {
            id(power_off_tried) = true;
            id(cache_fp_on) = fp_on;
            id(board_idle_sleep)->execute();
          }
          if (id(page) != 0 && idle >= ${sleep_after_s}) {
            id(go)->execute(0);                 // discards unapplied Power/Mode edits
          } else if (id(page) == 2 && idle >= ${setpoint_timeout_s}) {
            id(go)->execute(1);
          }
