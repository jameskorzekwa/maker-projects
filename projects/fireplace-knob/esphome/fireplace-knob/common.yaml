# Fireplace knob: shared behaviour package (all boards).
#
# A device file includes three packages:
#   common.yaml          this file: HA entities, state, scripts, render
#   hw-<board>.yaml      pins, display driver, encoder + button -> button_down/up
#   ui-<size>.yaml       fonts and LVGL pages (same widget ids on every size)
# Boards: hw-crowpanel21.yaml + ui-480.yaml (Elecrow CrowPanel 2.1"),
#         hw-m5dial.yaml + ui-240.yaml (M5Stack Dial v1.1).
#
# Controls one fireplace through Home Assistant.
#
#   Sleep      room temperature at the Sleep brightness. Tap -> Main.
#              Turn -> Set Point (first click already counts). Hold -> on/off.
#   Main       room temperature, set point, mode, on/off. Tap -> Settings.
#              Turn -> Set Point.
#   Set Point  turn = set temperature (Manual while burning: flame height).
#              Tap or 10 s idle -> Main. Never lights the fireplace.
#   Settings   turn = choose Power / Mode / Fan / Light / Flame / Brightness /
#              Back, tap = open. Flame is listed only in Manual while burning.
#   Edit       turn = change, tap -> Settings. Fan, light, flame and the set
#              point are sent ~1 s after the knob stops; Power and Mode are
#              sent when you tap (a timeout discards them). Brightness has
#              two steps: Awake, then Sleep.
#   Anywhere   hold 0.7-3 s then release = fireplace on/off (on = the
#              selected mode). A press held longer than 3 s is treated as a
#              stuck button and ignored. 10 s without input -> Sleep.
#   Display Off  Sleep + fireplace off for 30 s -> backlight fully off and
#              Wi-Fi modem power save. Tap/turn/hold behave exactly as on
#              Sleep (no reboot). The fireplace turning on lights it again.
#
# Only a long press (or Power in Settings) ever lights the fireplace.
#
# Which fireplace it controls is set entirely by the substitutions below; the
# device files (../fireplace-knob-living-room.yaml, ...) override them. The
# packages live in this subdirectory so the ESPHome Device Builder does not
# list them as devices.
#
# Home Assistant must allow this device to perform actions (ESPHome device
# options -> "Allow the device to perform Home Assistant actions"), otherwise
# every knob command is silently dropped.
substitutions:
  device_name: fireplace-knob
  friendly_name: Fireplace Knob
  fireplace_name: Fireplace

  # ---- Home Assistant entities (override per fireplace) ----
  fireplace_switch: switch.living_room_fireplace
  climate_entity: climate.living_room_fireplace_mode
  flame_number: number.living_room_fireplace_flame_height
  fan_number: number.living_room_fireplace_fan_speed
  light_switch: switch.living_room_fireplace_light
  # Optional alternative room-temperature sensor, selectable from the knob's
  # HA device page ("Room Temperature Source").
  alt_temp_entity: sensor.main_floor_temperature
  alt_temp_label: "Living room"

  # ---- Behaviour ----
  temp_step: "1.0"          # degrees per knob detent
  temp_min: "55"
  temp_max: "85"
  temp_default: "70"        # used until HA reports a set point
  temp_format: "%.0f"       # "%.1f" for 0.5-degree steps
  flame_max: "6"
  fan_max: "6"
  rotation_sign: "1"        # set to "-1" if the knob turns the wrong way
  long_press: 700ms         # hold this long, then release = on/off
  stuck_press: 2300ms       # held this much longer -> ignored as stuck
  setpoint_timeout_s: "10"  # Set Point -> Main
  sleep_after_s: "10"       # any screen -> Sleep
  display_off_after_s: "30" # Sleep + fireplace off -> backlight off
  awake_brightness_default: "100"
  # Wording that must fit the screen; the ui-*.yaml packages override these.
  txt_no_ha: "No HA link"
  txt_fp_offline_short: "Fireplace offline"
  txt_fp_offline: "Fireplace not reachable"
  txt_connecting: "Connecting to Home Assistant..."
  sleep_brightness_default: "25"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2
  includes:
    - fireplace-knob/knob_helpers.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(last_activity_ms) = millis();
            id(page) = 0;
            id(apply_backlight)->execute();
        - script.execute: render

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}"
    password: !secret fireplace_knob_ap_password

captive_portal:

logger:
  level: DEBUG
  logs:
    lvgl: INFO
    sensor: INFO
    text_sensor: INFO
    homeassistant.sensor: INFO
    homeassistant.text_sensor: INFO

api:
  encryption:
    key: !secret fireplace_knob_api_key
  on_client_connected:
    - script.execute: render
  on_client_disconnected:
    - script.execute: render

ota:
  - platform: esphome
    password: !secret fireplace_knob_ota_password
# ------------------------------------------------------------------
# State
# ------------------------------------------------------------------
# page: 0 Sleep, 1 Main, 2 Set Point, 3 Settings,
#       4 Power, 5 Mode, 6 Fan, 7 Light, 8 Flame, 9 Brightness (edit screens)
globals:
  - id: page
    type: int
    initial_value: "0"
  - id: settings_sel        # highlighted row in Settings
    type: int
    initial_value: "0"
  - id: bright_step         # Brightness edit: 0 = Awake, 1 = Sleep
    type: int
    initial_value: "0"
  - id: mode_sel            # 0 Manual, 1 Thermostat, 2 Smart (committed)
    type: int
    restore_value: true
    initial_value: "1"
  - id: mode_edit           # value being chosen on the Mode screen
    type: int
    initial_value: "0"
  - id: power_edit          # value being chosen on the Power screen
    type: bool
    initial_value: "false"
  - id: mode_pending
    type: bool
    initial_value: "false"
  - id: setpoint            # what the knob shows / last sent
    type: float
    restore_value: true
    initial_value: "${temp_default}"
  - id: temp_pending
    type: bool
    initial_value: "false"
  - id: flame_target
    type: int
    initial_value: "0"
  - id: flame_pending
    type: bool
    initial_value: "false"
  - id: fan_target
    type: int
    initial_value: "0"
  - id: fan_pending
    type: bool
    initial_value: "false"
  - id: light_target
    type: bool
    initial_value: "false"
  - id: light_pending
    type: bool
    initial_value: "false"
  - id: long_fired          # held >= long_press: release = on/off
    type: bool
    initial_value: "false"
  - id: press_stuck         # held > stuck_press: ignore this press
    type: bool
    initial_value: "false"
  - id: press_from_sleep    # the current press started on the Sleep screen
    type: bool
    initial_value: "false"
  - id: last_activity_ms
    type: uint32_t
    initial_value: "0"
  - id: toast_until_ms
    type: uint32_t
    initial_value: "0"
  - id: last_connected      # HA connection state as last drawn
    type: bool
    initial_value: "false"
  - id: display_off         # Sleep with the backlight fully off
    type: bool
    initial_value: "false"
  - id: sleep_since_ms
    type: uint32_t
    initial_value: "0"

# ------------------------------------------------------------------
# Home Assistant: settings exposed on the device page
# ------------------------------------------------------------------
number:
  - platform: template
    id: awake_brightness
    name: Awake Brightness
    icon: mdi:brightness-7
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: ${awake_brightness_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: 'id(apply_backlight)->execute();'
  - platform: template
    id: sleep_brightness
    name: Sleep Brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: ${sleep_brightness_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: 'id(apply_backlight)->execute();'

select:
  - platform: template
    id: temp_source
    name: Room Temperature Source
    icon: mdi:home-thermometer-outline
    entity_category: config
    options: ["Fireplace", "${alt_temp_label}"]
    initial_option: "Fireplace"
    restore_value: true
    optimistic: true
    set_action:
      - script.execute: render

# ------------------------------------------------------------------
# Home Assistant state mirrors
# ------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_fireplace
    entity_id: ${fireplace_switch}
    on_value:
      - script.execute: render
  - platform: homeassistant
    id: ha_light
    entity_id: ${light_switch}
    on_value:
      - lambda: 'id(light_pending) = false;'
      - script.execute: render
  - platform: homeassistant
    id: ha_preset
    entity_id: ${climate_entity}
    attribute: preset_mode
    on_value:
      # Follow the fireplace's real mode (remote, HA, automations). "Off" is
      # ignored so the knob remembers which mode to light it in next time.
      - lambda: |-
          if (id(mode_pending)) return;
          if (x == "Manual") id(mode_sel) = 0;
          else if (x == "Thermostat") id(mode_sel) = 1;
          else if (x == "Smart") id(mode_sel) = 2;
      - script.execute: render

sensor:
  - platform: homeassistant
    id: ha_setpoint
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      # null in Off/Manual on the Proflame integrations -> NaN; keep ours.
      - lambda: |-
          if (!std::isnan(x) && !id(temp_pending)) id(setpoint) = x;
      - script.execute: render
  - platform: homeassistant
    id: ha_room_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      - script.execute: render
  - platform: homeassistant
    id: ha_alt_temp
    entity_id: ${alt_temp_entity}
    on_value:
      - script.execute: render
  - platform: homeassistant
    id: ha_flame
    entity_id: ${flame_number}
    on_value:
      - lambda: |-
          if (!std::isnan(x) && !id(flame_pending)) id(flame_target) = (int) lroundf(x);
      - script.execute: render
  - platform: homeassistant
    id: ha_fan
    entity_id: ${fan_number}
    on_value:
      - lambda: |-
          if (!std::isnan(x) && !id(fan_pending)) id(fan_target) = (int) lroundf(x);
      - script.execute: render
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
    entity_category: diagnostic
binary_sensor:
  - platform: status
    name: Status
button:
  - platform: restart
    name: Restart
    entity_category: config

# ------------------------------------------------------------------
# Behaviour
# ------------------------------------------------------------------
script:
  # Backlight for the current screen (Sleep brightness on page 0, otherwise
  # Awake). While editing the Sleep brightness the screen previews it.
  - id: apply_backlight
    then:
      - lambda: |-
          if (id(display_off)) { id(display_backlight).turn_off().perform(); return; }
          float pct = id(awake_brightness).state;
          if (id(page) == 0 || (id(page) == 9 && id(bright_step) == 1)) pct = id(sleep_brightness).state;
          if (std::isnan(pct)) pct = 100;
          if (pct <= 0) { id(display_backlight).turn_off().perform(); return; }
          auto call = id(display_backlight).turn_on();
          call.set_brightness(pct / 100.0f);
          call.perform();

  # Switch screen. Entering an edit screen seeds its temporary value.
  - id: go
    parameters: {to: int}
    then:
      - lambda: |-
          const bool fp_on = id(ha_fireplace).state == "on";
          id(page) = to;
          if (to == 0) id(sleep_since_ms) = millis();
          switch (to) {
            case 3: break;
            case 4: id(power_edit) = fp_on; break;
            case 5: id(mode_edit) = id(mode_sel); break;
            case 9: id(bright_step) = 0; break;
          }
          id(apply_backlight)->execute();
          id(render)->execute();
          lv_obj_t *scr = id(page_value)->obj;
          if (to == 0) scr = id(page_sleep)->obj;
          else if (to == 1) scr = id(page_main)->obj;
          else if (to == 3) scr = id(page_settings)->obj;
          if (lv_screen_active() != scr) lv_screen_load(scr);

  - id: wake
    then:
      - lambda: |-
          id(last_activity_ms) = millis();
          if (id(display_off)) {
            id(display_off) = false;
            knob_wifi_power_save(false);
            id(apply_backlight)->execute();
          }

  # Hold: after `long_press` the release toggles the fireplace; a press that
  # lasts longer than `stuck_press` is ignored (slow click return, object
  # resting on the knob) so a stuck button can never light the fireplace.
  - id: long_press_timer
    mode: restart
    then:
      - script.execute: wake
      - delay: 200ms
      - lambda: |-
          if (id(page) == 0) id(go)->execute(1);
          bool on = id(ha_fireplace).state == "on";
          id(show_toast)->execute(on ? "Hold to turn OFF" : "Hold to turn ON", 4000);
      - delay: ${long_press}
      - lambda: |-
          id(long_fired) = true;
          bool on = id(ha_fireplace).state == "on";
          id(show_toast)->execute(on ? "Release to\nturn OFF" : "Release to\nturn ON", 4000);
      - delay: ${stuck_press}
      - lambda: |-
          id(press_stuck) = true;
          id(toast_until_ms) = 0;
          lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);

  # Called by the board's button binary_sensor.
  - id: button_down
    then:
      - lambda: |-
          id(long_fired) = false;
          id(press_stuck) = false;
          id(press_from_sleep) = id(page) == 0;
      - script.execute: long_press_timer

  - id: button_up
    then:
      - script.stop: long_press_timer
      - lambda: |-
          id(toast_until_ms) = 0;
          lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
      - if:
          condition:
            lambda: 'return id(press_stuck);'
          then: []
          else:
            - if:
                condition:
                  lambda: 'return id(long_fired);'
                then:
                  - script.execute: toggle_fireplace
                else:
                  - script.execute: tap

  - id: show_toast
    parameters: {text: string, ms: int}
    then:
      - lambda: |-
          lv_label_set_text(id(toast_label), text.c_str());
          lv_obj_remove_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          id(toast_until_ms) = millis() + ms;

  # Rows of the Settings list for the current state. Returns the count and
  # fills ids: 4 Power, 5 Mode, 6 Fan, 7 Light, 8 Flame, 9 Brightness, 1 Back.
  - id: tap
    then:
      - lambda: |-
          id(wake)->execute();
          const bool fp_on = id(ha_fireplace).state == "on";
          const int p = id(page);
          if (id(press_from_sleep)) { id(go)->execute(1); return; }   // just wake
          switch (p) {
            case 0: id(go)->execute(1); break;
            case 1: id(settings_sel) = 0; id(go)->execute(3); break;
            case 2: id(go)->execute(1); break;
            case 3: {
              int rows[8]; int n = settings_rows(rows, fp_on, id(mode_sel));
              int sel = std::min(id(settings_sel), n - 1);
              id(go)->execute(rows[sel]);
              break;
            }
            case 4:
              if (id(power_edit) != fp_on) id(toggle_fireplace)->execute();
              id(go)->execute(3);
              break;
            case 5:
              if (id(mode_edit) != id(mode_sel)) {
                id(mode_sel) = id(mode_edit);
                if (fp_on) { id(mode_pending) = true; id(send_mode)->execute(); }
              }
              id(go)->execute(3);
              break;
            case 9:
              if (id(bright_step) == 0) { id(bright_step) = 1; id(apply_backlight)->execute(); id(render)->execute(); }
              else id(go)->execute(3);
              break;
            default: id(go)->execute(3); break;   // Fan, Light, Flame
          }

  - id: knob_turn
    parameters: {dir: int}
    then:
      - lambda: |-
          id(wake)->execute();
          const bool fp_on = id(ha_fireplace).state == "on";
          int p = id(page);
          if (p == 0 || p == 1) { id(go)->execute(2); p = 2; }   // first click counts
          switch (p) {
            case 2: {
              if (id(mode_sel) == 0 && fp_on) {        // Manual: flame height
                int f = std::min(${flame_max}, std::max(1, id(flame_target) + dir));
                if (f != id(flame_target)) { id(flame_target) = f; id(flame_pending) = true; id(send_flame)->execute(); }
              } else {
                float t = id(setpoint) + dir * ${temp_step};
                id(setpoint) = std::min((float) ${temp_max}, std::max((float) ${temp_min}, t));
                id(temp_pending) = true;
                id(send_temp)->execute();
              }
              break;
            }
            case 3: {
              int rows[8]; int n = settings_rows(rows, fp_on, id(mode_sel));
              id(settings_sel) = std::min(n - 1, std::max(0, id(settings_sel) + dir));
              break;
            }
            case 4: id(power_edit) = dir > 0; break;
            case 5: id(mode_edit) = std::min(2, std::max(0, id(mode_edit) + dir)); break;
            case 6: {
              int f = std::min(${fan_max}, std::max(0, id(fan_target) + dir));
              if (f != id(fan_target)) { id(fan_target) = f; id(fan_pending) = true; id(send_fan)->execute(); }
              break;
            }
            case 7: {
              bool want = dir > 0;
              bool cur = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
              if (want != cur) { id(light_target) = want; id(light_pending) = true; id(send_light)->execute(); }
              break;
            }
            case 8: {
              if (!fp_on) { id(show_toast)->execute("Hold knob to\nturn on first", 2000); break; }
              int f = std::min(${flame_max}, std::max(1, id(flame_target) + dir));
              if (f != id(flame_target)) { id(flame_target) = f; id(flame_pending) = true; id(send_flame)->execute(); }
              break;
            }
            case 9: {
              auto *n = id(bright_step) == 0 ? (number::Number *) id(awake_brightness) : (number::Number *) id(sleep_brightness);
              float lo = id(bright_step) == 0 ? 10 : 0;
              float v = std::min(100.0f, std::max(lo, n->state + dir * 5));
              if (v != n->state) n->make_call().set_value(v).perform();
              break;
            }
          }
          id(render)->execute();

  # On: light it in the selected mode (Manual uses the last flame height).
  - id: toggle_fireplace
    then:
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - script.execute: {id: show_toast, text: "Turning OFF", ms: 2500}
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${fireplace_switch}
          else:
            - lambda: |-
                static const char *M[] = {"Turning ON\nManual", "Turning ON\nThermostat", "Turning ON\nSmart"};
                id(show_toast)->execute(M[id(mode_sel)], 2500);
            - homeassistant.action:
                action: climate.set_preset_mode
                data:
                  entity_id: ${climate_entity}
                data_template:
                  preset_mode: "{{ m }}"
                variables:
                  m: !lambda |-
                    static const char *M[] = {"Manual", "Thermostat", "Smart"};
                    return std::string(M[id(mode_sel)]);

  # Debounced: one HA call after the knob stops turning.
  - id: send_temp
    mode: restart
    then:
      - delay: 900ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_entity}
          data_template:
            temperature: "{{ t }}"
          variables:
            t: !lambda 'return id(setpoint);'
      - delay: 4s
      - lambda: 'id(temp_pending) = false;'
      - script.execute: render

  - id: send_mode
    mode: restart
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: ${climate_entity}
          data_template:
            preset_mode: "{{ m }}"
          variables:
            m: !lambda |-
              static const char *M[] = {"Manual", "Thermostat", "Smart"};
              return std::string(M[id(mode_sel)]);
      - delay: 5s
      - lambda: 'id(mode_pending) = false;'
      - script.execute: render

  - id: send_flame
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: 'return id(ha_fireplace).state == "on";'
          then:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${flame_number}
                data_template:
                  value: "{{ v }}"
                variables:
                  v: !lambda 'return id(flame_target);'
      - delay: 4s
      - lambda: 'id(flame_pending) = false;'
      - script.execute: render

  - id: send_fan
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: ${fan_number}
          data_template:
            value: "{{ v }}"
          variables:
            v: !lambda 'return id(fan_target);'
      - delay: 4s
      - lambda: 'id(fan_pending) = false;'
      - script.execute: render

  - id: send_light
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: 'return id(light_target);'
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: ${light_switch}
          else:
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${light_switch}
      - delay: 5s
      - lambda: 'id(light_pending) = false;'
      - script.execute: render

  - id: render
    then:
      - lambda: |-
          static const uint32_t ORANGE = 0xFF7A1A, RED = 0xFF4A2A, CYAN = 0x38BDF8,
                                YELLOW = 0xFACC15, PURPLE = 0xA78BFA, GREEN = 0x4ADE80,
                                GREY = 0x5A5A5A, DIM = 0x333333, WHITE = 0xFFFFFF,
                                SUB = 0x9A9A9A;
          static const char *MODE_UP[] = {"MANUAL", "THERMOSTAT", "SMART"};
          static const char *MODE_MC[] = {"Manual", "Thermostat", "Smart"};
          char buf[64];
          const bool connected = api::global_api_server->is_connected();
          id(last_connected) = connected;
          const std::string fp = id(ha_fireplace).state;
          const bool fp_on = fp == "on";
          const bool fp_known = fp == "on" || fp == "off";
          const int m = id(mode_sel);
          const int p = id(page);
          const bool manual_flame = (m == 0 && fp_on);

          // ---- room temperature: selected source, falling back to the other
          // one when it has no reading (fireplace offline, sensor unavailable).
          const float fp_temp = id(ha_room_temp).state, alt_temp = id(ha_alt_temp).state;
          bool alt = id(temp_source).current_option() == "${alt_temp_label}";
          float room = alt ? alt_temp : fp_temp;
          if (std::isnan(room)) room = alt ? fp_temp : alt_temp;
          if (std::isnan(room)) snprintf(buf, sizeof(buf), "--");
          else snprintf(buf, sizeof(buf), "%.0f\u00B0", room);
          lv_label_set_text(id(sleep_temp), buf);
          lv_label_set_text(id(main_temp), buf);
          lv_obj_set_style_text_color(id(sleep_temp), lv_color_hex(connected ? WHITE : GREY), 0);
          lv_obj_set_style_text_color(id(main_temp), lv_color_hex(connected ? WHITE : GREY), 0);

          // ---- status rows (same content on Main, Value and Settings) ----
          const char *st_icon = fp_on ? "\U000F0238" : "\U000F1722";
          const char *st_text = !connected ? "${txt_no_ha}" : !fp_known ? "${txt_fp_offline_short}" : fp_on ? MODE_MC[m] : "OFF";
          lv_obj_t *sicons[] = {id(status_icon_m), id(status_icon_v), id(status_icon_s)};
          lv_obj_t *stexts[] = {id(status_text_m), id(status_text_v), id(status_text_s)};
          for (int i = 0; i < 3; i++) {
            lv_label_set_text(sicons[i], st_icon);
            lv_obj_set_style_text_color(sicons[i], lv_color_hex(fp_on ? ORANGE : GREY), 0);
            lv_label_set_text(stexts[i], st_text);
            lv_obj_set_style_text_color(stexts[i], lv_color_hex(fp_on ? ORANGE : SUB), 0);
          }

          // ---- Sleep ----
          if (fp_on) lv_obj_remove_flag(id(sleep_flame), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(sleep_flame), LV_OBJ_FLAG_HIDDEN);

          // ---- Main ----
          if (manual_flame) snprintf(buf, sizeof(buf), "Flame %d", id(flame_target));
          else snprintf(buf, sizeof(buf), "Set ${temp_format}\u00B0", id(setpoint));
          lv_label_set_text(id(main_set), buf);
          lv_obj_set_style_text_color(id(main_set), lv_color_hex(!connected ? GREY : fp_on ? ORANGE : SUB), 0);
          if (!connected) snprintf(buf, sizeof(buf), "${txt_connecting}");
          else if (!fp_known) snprintf(buf, sizeof(buf), "${txt_fp_offline}");
          else snprintf(buf, sizeof(buf), "Fan %d  \u00B7  Light %s", id(fan_target),
                        (id(light_pending) ? id(light_target) : id(ha_light).state == "on") ? "on" : "off");
          lv_label_set_text(id(main_info), buf);
          lv_label_set_text(id(main_hint), manual_flame ? "Tap: settings   Turn: flame" : "Tap: settings   Turn: set temp");

          // ---- Settings list ----
          if (p == 3) {
            static const char *NAMES[] = {"", "Back", "", "", "Power", "Mode", "Fan", "Light", "Flame", "Brightness"};
            int rows[8]; int n = settings_rows(rows, fp_on, m);
            int sel = std::min(id(settings_sel), n - 1);
            id(settings_sel) = sel;
            lv_obj_t *R[] = {id(row_m2), id(row_m1), id(row_0), id(row_p1), id(row_p2)};
            for (int k = -2; k <= 2; k++) {
              int i = sel + k;
              lv_obj_t *lbl = R[k + 2];
              if (i < 0 || i >= n) { lv_label_set_text(lbl, ""); continue; }
              int r = rows[i];
              if (k != 0) { lv_label_set_text(lbl, NAMES[r]); continue; }
              char val[32] = "";
              switch (r) {
                case 4: snprintf(val, sizeof(val), "%s", fp_on ? "ON" : "OFF"); break;
                case 5: snprintf(val, sizeof(val), "%s", MODE_MC[m]); break;
                case 6: if (id(fan_target) > 0) snprintf(val, sizeof(val), "%d", id(fan_target)); else snprintf(val, sizeof(val), "Off"); break;
                case 7: snprintf(val, sizeof(val), "%s", (id(light_pending) ? id(light_target) : id(ha_light).state == "on") ? "On" : "Off"); break;
                case 8: snprintf(val, sizeof(val), "%d", id(flame_target)); break;
                case 9: snprintf(val, sizeof(val), "%.0f%%", id(awake_brightness).state); break;
              }
              if (val[0]) snprintf(buf, sizeof(buf), "%s   %s", NAMES[r], val);
              else snprintf(buf, sizeof(buf), "%s", NAMES[r]);
              lv_label_set_text(lbl, buf);
            }
          }

          // ---- Value page (Set Point + edit screens) ----
          if (p == 2 || p >= 4) {
            uint32_t accent = ORANGE;
            const char *title = ""; const char *icon = "";
            bool show_mode_label = false;
            switch (p) {
              case 2:
                if (manual_flame) {
                  accent = RED; title = "FLAME"; icon = "\U000F0238";
                  snprintf(buf, sizeof(buf), "%d", id(flame_target));
                  lv_label_set_text(id(value_label), buf);
                  lv_arc_set_range(id(ring), 0, ${flame_max});
                  lv_arc_set_value(id(ring), id(flame_target));
                  lv_label_set_text(id(sub_label), id(flame_pending) ? "Setting..." : "Flame 1 - ${flame_max}");
                } else {
                  accent = ORANGE; title = "SET TEMP"; icon = "\U000F050F";
                  snprintf(buf, sizeof(buf), "${temp_format}\u00B0", id(setpoint));
                  lv_label_set_text(id(value_label), buf);
                  lv_arc_set_range(id(ring), (int32_t) (${temp_min} * 10), (int32_t) (${temp_max} * 10));
                  lv_arc_set_value(id(ring), (int32_t) lroundf(id(setpoint) * 10));
                  if (id(temp_pending))      snprintf(buf, sizeof(buf), "Setting...");
                  else if (!fp_on)           snprintf(buf, sizeof(buf), "Saved for next turn-on");
                  else if (std::isnan(room)) snprintf(buf, sizeof(buf), "Room --");
                  else                       snprintf(buf, sizeof(buf), "Room %.0f\u00B0", room);
                  lv_label_set_text(id(sub_label), buf);
                }
                break;
              case 4: {
                accent = GREEN; title = "POWER"; icon = "\U000F0425";
                lv_label_set_text(id(value_label), id(power_edit) ? "ON" : "OFF");
                lv_arc_set_range(id(ring), 0, 1);
                lv_arc_set_value(id(ring), id(power_edit) ? 1 : 0);
                if (id(power_edit) != fp_on) snprintf(buf, sizeof(buf), "Tap to turn %s", id(power_edit) ? "on" : "off");
                else snprintf(buf, sizeof(buf), "Turn right: on   left: off");
                lv_label_set_text(id(sub_label), buf);
                break;
              }
              case 5: {
                accent = PURPLE; title = "MODE"; icon = "\U000F1542"; show_mode_label = true;
                static const char *HINT[] = {"You set flame + fan", "Auto flame, you set fan", "Smart flame, you set fan"};
                lv_label_set_text(id(mode_label), MODE_UP[id(mode_edit)]);
                lv_arc_set_range(id(ring), 0, 3);
                lv_arc_set_value(id(ring), id(mode_edit) + 1);
                if (id(mode_edit) != m) snprintf(buf, sizeof(buf), "Tap to apply");
                else if (fp_on) snprintf(buf, sizeof(buf), "%s", HINT[m]);
                else snprintf(buf, sizeof(buf), "Used at next turn-on");
                lv_label_set_text(id(sub_label), buf);
                break;
              }
              case 6: {
                accent = CYAN; title = "FAN SPEED"; icon = "\U000F0210";
                int f = id(fan_target);
                if (f <= 0) snprintf(buf, sizeof(buf), "OFF"); else snprintf(buf, sizeof(buf), "%d", f);
                lv_label_set_text(id(value_label), buf);
                lv_arc_set_range(id(ring), 0, ${fan_max});
                lv_arc_set_value(id(ring), f);
                lv_label_set_text(id(sub_label), id(fan_pending) ? "Setting..." : "Speed 0 - ${fan_max}");
                break;
              }
              case 7: {
                accent = YELLOW; title = "LIGHT";
                bool lon = id(light_pending) ? id(light_target) : id(ha_light).state == "on";
                icon = lon ? "\U000F0335" : "\U000F0336";
                lv_label_set_text(id(value_label), lon ? "ON" : "OFF");
                lv_arc_set_range(id(ring), 0, 1);
                lv_arc_set_value(id(ring), lon ? 1 : 0);
                lv_label_set_text(id(sub_label), "Turn right: on   left: off");
                break;
              }
              case 8: {
                accent = RED; title = "FLAME"; icon = "\U000F0238";
                int f = fp_on ? id(flame_target) : 0;
                if (f <= 0) snprintf(buf, sizeof(buf), "OFF"); else snprintf(buf, sizeof(buf), "%d", f);
                lv_label_set_text(id(value_label), buf);
                lv_arc_set_range(id(ring), 0, ${flame_max});
                lv_arc_set_value(id(ring), f);
                lv_label_set_text(id(sub_label), !fp_on ? "Hold knob to turn on"
                                  : id(flame_pending) ? "Setting..." : "Flame 1 - ${flame_max}");
                break;
              }
              case 9: {
                accent = WHITE; icon = "\U000F00E0";
                bool sl = id(bright_step) == 1;
                title = sl ? "SLEEP BRIGHTNESS" : "BRIGHTNESS";
                float v = sl ? id(sleep_brightness).state : id(awake_brightness).state;
                snprintf(buf, sizeof(buf), "%.0f", v);
                lv_label_set_text(id(value_label), buf);
                lv_arc_set_range(id(ring), 0, 100);
                lv_arc_set_value(id(ring), (int32_t) v);
                lv_label_set_text(id(sub_label), sl ? "Tap to finish" : "Tap for sleep brightness");
                break;
              }
            }
            lv_label_set_text(id(title_label), title);
            lv_label_set_text(id(title_icon), icon);
            if (show_mode_label) {
              lv_obj_add_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(mode_label), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_remove_flag(id(value_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(mode_label), LV_OBJ_FLAG_HIDDEN);
            }
            if (!connected) lv_label_set_text(id(sub_label), "${txt_connecting}");
            else if (!fp_known) lv_label_set_text(id(sub_label), "${txt_fp_offline}");
            lv_obj_set_style_arc_color(id(ring), lv_color_hex(accent), LV_PART_INDICATOR);
            lv_obj_set_style_text_color(id(title_icon), lv_color_hex(accent), 0);
            lv_obj_set_style_text_color(id(value_label), lv_color_hex(connected ? WHITE : GREY), 0);
            lv_obj_set_style_text_color(id(mode_label), lv_color_hex(connected ? WHITE : GREY), 0);
          }

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(toast_until_ms) != 0 && (int32_t) (now - id(toast_until_ms)) >= 0) {
            id(toast_until_ms) = 0;
            lv_obj_add_flag(id(toast), LV_OBJ_FLAG_HIDDEN);
          }
          // Redraw as soon as the HA connection state changes, whatever the
          // order of connect/disconnect events during a reconnect.
          if (api::global_api_server->is_connected() != id(last_connected))
            id(render)->execute();
          if (id(knob_button).state) return;   // a hold in progress never times out
          const bool fp_on = id(ha_fireplace).state == "on";
          // Display Off: Sleep + fireplace off for a while -> backlight off and
          // Wi-Fi modem sleep. The fireplace turning on brings the screen back.
          if (id(display_off) && fp_on) {
            id(display_off) = false;
            knob_wifi_power_save(false);
            id(apply_backlight)->execute();
          } else if (id(page) == 0 && !id(display_off) && !fp_on &&
                     (now - id(sleep_since_ms)) >= ${display_off_after_s}u * 1000u) {
            id(display_off) = true;
            knob_wifi_power_save(true);
            id(apply_backlight)->execute();
          }
          const uint32_t idle = (now - id(last_activity_ms)) / 1000;
          if (id(page) != 0 && idle >= ${sleep_after_s}) {
            id(go)->execute(0);                 // discards unapplied Power/Mode edits
          } else if (id(page) == 2 && idle >= ${setpoint_timeout_s}) {
            id(go)->execute(1);
          }
