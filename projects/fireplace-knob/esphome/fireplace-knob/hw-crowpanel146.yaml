substitutions:
  battery_mah: "2000"       # pack capacity for the charge counter (EEMB LP103454)
  ina_sign: "1.0f"          # UPS HAT (C): IN+ on the charger side, + = charging; use "-1.0f" if reversed
  display_off_enabled: "false"  # light-sleeps on battery instead; Sleep screen stays on USB

# Hardware package: Elecrow CrowPanel 1.46" ESP32-S3 rotary display, model
# DHR55146D (ESP32-S3, 16 MB flash, 8 MB octal PSRAM, 360x360 ST77961/JD9855
# SPI panel, CST816 touch (unused), encoder with push button, 8-LED ring).
# Pair with ui-360.yaml.
#
# Battery (2026-11-20): the V1.2 board's J8 BAT pads are a bare footprint (the
# + pad connects to nothing), so the cell sits on a Waveshare UPS HAT (C):
# ETA6003 power-path charger + TPS61088 5 V boost (no light-load shutoff) +
# INA219 (0x43, 0.01 ohm shunt R9 between charger BAT and the cell). HAT 5V/GND
# -> knob USB-C. The INA219's Vs (HAT header "3.3V" pin, 3.0-5.5 V) and I2C come
# from the knob's I2C socket (5V pin switched by GPIO2, SDA GPIO38 / SCL
# GPIO39). Same battery logic as the Dial (hw-m5dial.yaml).
#
# Idle sleep differs from the Dial: there is no power latch and the knob pins
# are not RTC pins (no deep-sleep wake), so the board never switches off.
# Stage 1 (first light_sleep_minutes): light sleep with an HA refresh every
# refresh_every_s, as on the Dial. Stage 2: light sleep continues, without
# the HA refreshes (values refresh on wake). A tap, a turn or USB charging
# current always wakes it instantly.
# Pins and panel init: Elecrow's ESPHome tutorial and RotaryScreen_1_46.h
# (github.com/Elecrow-RD/CrowPanel-1.46inch-HMI-ESP32-Rotary-Display).
#
#   GPIO1  LCD power (must be high or the panel stays dark)
#   GPIO2  5 V for the UART/I2C sockets (on: powers the INA219)
#   GPIO17 LED-ring power (held off), GPIO48 LED-ring data
#   GPIO40 red power LED, active low (held off)
#   GPIO46 backlight PWM
#   SPI: SCLK 10, MOSI 11, CS 9, DC 3, RST 14
#   Encoder A 45, B 42, push button 41 (active low)
#   Touch I2C SDA 6, SCL 7, INT 13, RST 5 (not used)

esphome:
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # Power the panel before any component (the display driver sets up at 800)
    # and switch the red LED and the LED ring off. One blocking lambda: `delay:`
    # actions in on_boot do not hold up the rest of setup.
    - priority: 2000
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_40, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_40, 1);        // red LED off
            gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_17, 0);        // LED ring unpowered
            // LCD power: off for 300 ms first. After a software reboot (OTA,
            // Restart button) the panel stays powered and does not take the new
            // init (black screen, backlight on); a real power-on always works.
            gpio_hold_dis(GPIO_NUM_1);
            gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_1, 0);
            gpio_set_direction(GPIO_NUM_14, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_14, 0);        // panel RST held low while unpowered
            delay(300);
            gpio_set_level(GPIO_NUM_1, 1);         // LCD power on
            gpio_set_direction(GPIO_NUM_2, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_2, 1);         // I2C socket power (INA219)
            delay(150);

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y

wifi:
  output_power: 11dB        # lower TX peaks on battery; plenty indoors

safe_mode:

psram:
  mode: octal
  speed: 80MHz

output:
  - platform: ledc
    pin: GPIO46
    id: bl_pwm
    frequency: 19531Hz

light:
  - platform: monochromatic
    id: display_backlight
    internal: true
    output: bl_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  clk_pin: GPIO10
  mosi_pin: GPIO11

display:
  - platform: mipi_spi
    id: panel
    model: CUSTOM
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    data_rate: 40MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 360
      height: 360
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - [0xDE, 0x00]
      - [0xDF, 0x98, 0x55]
