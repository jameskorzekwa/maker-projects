# Living-room fireplace knob (Elecrow CrowPanel 2.1" rotary display).
# Behaviour: fireplace-knob/common.yaml; board: hw-crowpanel21.yaml; UI: ui-480.yaml.
# Living room = Proflame Connect Wi-Fi integration (proflame_connect_wifi).

substitutions:
  device_name: fireplace-knob-living-room
  friendly_name: Living Room Fireplace Knob
  fireplace_name: Living Room
  fireplace_switch: switch.living_room_fireplace
  climate_entity: climate.living_room_fireplace_mode
  flame_number: number.living_room_fireplace_flame_height
  fan_number: number.living_room_fireplace_fan_speed
  light_switch: switch.living_room_fireplace_light
  temp_step: "1.0"
  temp_format: "%.0f"

packages:
  common: !include fireplace-knob/common.yaml
  hardware: !include fireplace-knob/hw-crowpanel21.yaml
  ui: !include fireplace-knob/ui-480.yaml
