<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">Wiring inside the RBM500 display housing</title>
  <desc id="desc">The B plus and B minus pins of the display's shunt connector feed a 470 microfarad capacitor and the input of a 12 to 5 volt buck regulator. The regulator's 5 volt output goes to the XIAO ESP32-S3 5V pin and its ground to XIAO GND. The display's Tx hole connects to XIAO D7, GPIO44, through one of two options: a 1 kilohm series resistor if the display's V plus measures 3.3 volts, or a 10 kilohm and 20 kilohm divider if V plus measures 5 volts. The display's V plus and G holes are not wired; G is only used as a meter reference.</desc>
  <defs>
    <style>
      .batt{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .esp{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .reg{fill:#fde8e8;stroke:#c53030;stroke-width:3}
      .opt{fill:#f9f5ff;stroke:#7b2cbf;stroke-width:2;stroke-dasharray:8 6}
      .t{font:600 20px system-ui,sans-serif;fill:#102a43}
      .s{font:15px system-ui,sans-serif;fill:#334e68}
      .sb{font:600 15px system-ui,sans-serif;fill:#102a43}
      .nc{font:15px system-ui,sans-serif;fill:#9fb3c8}
      .warn{font:600 15px system-ui,sans-serif;fill:#b44d12}
      .w{fill:none;stroke-width:4}
      .vp{stroke:#c53030}
      .tx{stroke:#7b2cbf}
      .gnd{stroke:#334e68}
      .res{fill:#fff;stroke:#243b53;stroke-width:3}
    </style>
  </defs>
  <rect width="1100" height="780" rx="24" fill="#fff"/>
  <text class="t" x="40" y="44">Inside the RBM500 display housing (one shared ground)</text>

  <!-- Display board -->
  <rect class="batt" x="40" y="80" width="250" height="520" rx="16"/>
  <text class="t" x="165" y="116" text-anchor="middle">RBM500 board</text>
  <text class="s" x="165" y="146" text-anchor="middle">shunt connector pins</text>
  <text class="nc" x="60" y="185">Rs- (not used)</text><circle cx="260" cy="180" r="9" fill="#9fb3c8"/>
  <text class="nc" x="60" y="225">Rs+ (not used)</text><circle cx="260" cy="220" r="9" fill="#9fb3c8"/>
  <text class="sb" x="60" y="265">B- (battery neg.)</text><circle cx="260" cy="260" r="11" fill="#334e68"/>
  <text class="sb" x="60" y="305">B+ (battery pos.)</text><circle cx="260" cy="300" r="11" fill="#c53030"/>
  <line x1="55" y1="340" x2="275" y2="340" stroke="#d9a066" stroke-width="2"/>
  <text class="s" x="165" y="370" text-anchor="middle">6-hole row beside MK1</text>
  <text class="nc" x="60" y="405">Out, Rx (not used)</text>
  <text class="sb" x="60" y="445">Tx</text><circle cx="260" cy="440" r="11" fill="#7b2cbf"/>
  <text class="nc" x="60" y="485">TEN (not used)</text>
  <text class="s" x="60" y="525">G (meter reference only)</text><circle cx="260" cy="520" r="9" fill="#9fb3c8"/>
  <text class="s" x="60" y="565">V+ (measure only)</text><circle cx="260" cy="560" r="9" fill="#9fb3c8"/>

  <!-- Power -->
  <path class="w vp" d="M260 300 H380 V200 H560"/>
  <path class="w gnd" d="M260 260 H350 V250 H560"/>
  <circle cx="430" cy="200" r="6" fill="#c53030"/><circle cx="470" cy="250" r="6" fill="#334e68"/>
  <path class="w vp" d="M430 200 V155"/><path class="w gnd" d="M470 250 V155"/>
  <rect x="415" y="110" width="70" height="45" rx="8" fill="#fff" stroke="#243b53" stroke-width="3"/>
  <text class="sb" x="450" y="138" text-anchor="middle">C1</text>
  <text class="s" x="450" y="98" text-anchor="middle">470 uF, 25 V (+ to B+)</text>

  <rect class="reg" x="560" y="170" width="190" height="110" rx="14"/>
  <text class="t" x="655" y="160" text-anchor="middle">Buck 12 V to 5 V</text>
  <text class="sb" x="575" y="205">VIN</text><text class="sb" x="575" y="255">GND</text>
  <text class="sb" x="735" y="205" text-anchor="end">5V OUT</text><text class="sb" x="735" y="255" text-anchor="end">GND</text>
  <text class="s" x="655" y="305" text-anchor="middle">e.g. Pololu D24V5F5</text>

  <path class="w vp" d="M750 200 H880"/>
  <path class="w gnd" d="M750 250 H880"/>

  <!-- Data: two options -->
  <path class="w tx" d="M260 440 H420"/>
  <rect class="opt" x="420" y="360" width="400" height="120" rx="12"/>
  <text class="sb" x="440" y="388">Option A: V+ measures about 3.3 V</text>
  <rect class="res" x="560" y="418" width="90" height="36" rx="6"/>
  <text class="sb" x="605" y="442" text-anchor="middle">1 k</text>
  <path class="w tx" d="M420 436 H560 M650 436 H820"/>

  <rect class="opt" x="420" y="500" width="400" height="170" rx="12"/>
  <text class="sb" x="440" y="528">Option B: V+ measures about 5 V</text>
  <rect class="res" x="500" y="556" width="90" height="36" rx="6"/>
  <text class="sb" x="545" y="580" text-anchor="middle">10 k</text>
  <path class="w tx" d="M420 574 H500 M590 574 H820"/>
  <circle cx="680" cy="574" r="6" fill="#7b2cbf"/>
  <rect class="res" x="662" y="595" width="36" height="50" rx="6"/>
  <text class="sb" x="712" y="625">20 k to GND</text>
  <path class="w tx" d="M680 574 V595"/>
  <path class="w tx" d="M300 440 V574 H420" stroke-dasharray="3 6"/>

  <path class="w tx" d="M820 436 V420 H880 M820 574 V420"/>

  <!-- XIAO -->
  <rect class="esp" x="880" y="150" width="180" height="330" rx="16"/>
  <circle cx="880" cy="200" r="8" fill="#c53030"/><text class="sb" x="895" y="205">5V</text>
  <circle cx="880" cy="250" r="8" fill="#334e68"/><text class="sb" x="895" y="255">GND</text>
  <circle cx="880" cy="420" r="8" fill="#7b2cbf"/><text class="sb" x="895" y="415">D7 / GPIO44</text>
  <text class="s" x="895" y="437">(silkscreen RX)</text>
  <text class="t" x="970" y="320" text-anchor="middle">XIAO</text>
  <text class="t" x="970" y="346" text-anchor="middle">ESP32-S3</text>
  <text class="s" x="970" y="505" text-anchor="middle">U.FL antenna inside</text>
  <text class="s" x="970" y="525" text-anchor="middle">the plastic housing</text>

  <text class="warn" x="40" y="712">Build only ONE data option. Never plug USB into the XIAO while the shunt cable is connected.</text>
  <text class="s" x="40" y="738">The 20 k resistor's ground end goes to XIAO GND. Display G, B- and XIAO GND are the same node in this design.</text>
</svg>
