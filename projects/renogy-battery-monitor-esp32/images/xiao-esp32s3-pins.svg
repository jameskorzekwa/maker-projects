<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Seeed Studio XIAO ESP32-S3 pins used by this project</title>
  <desc id="desc">Top view of the XIAO ESP32-S3 with the USB-C connector at the top. Left column from top: D0 GPIO1, D1 GPIO2, D2 GPIO3, D3 GPIO4, D4 GPIO5, D5 GPIO6, D6 GPIO43. Right column from top: 5V, GND, 3V3, D10 GPIO9, D9 GPIO8, D8 GPIO7, D7 GPIO44. The project uses 5V and GND for power from the buck regulator, 3V3 to power the INA228, D4 GPIO5 for I2C SDA and D5 GPIO6 for I2C SCL. USB-C is used only for the first flash on the bench.</desc>
  <defs>
    <style>
      .t{font:600 20px system-ui,sans-serif;fill:#102a43}
      .p{font:600 16px ui-monospace,monospace;fill:#102a43}
      .g{font:14px ui-monospace,monospace;fill:#627d98}
      .pin{fill:#cbd5e1;stroke:#243b53;stroke-width:2}
      .use{fill:#f59e0b}
    </style>
  </defs>
  <rect width="760" height="560" rx="24" fill="#fff"/>
  <text class="t" x="380" y="40" text-anchor="middle">XIAO ESP32-S3, top view (USB-C up)</text>
  <rect x="330" y="60" width="100" height="40" rx="10" fill="#94a3b8" stroke="#243b53" stroke-width="2"/>
  <text class="g" x="380" y="86" text-anchor="middle">USB-C</text>
  <rect x="270" y="90" width="220" height="420" rx="20" fill="#e3f8ff" stroke="#186faf" stroke-width="3"/>
  <text class="t" x="380" y="300" text-anchor="middle">XIAO</text>
  <text class="t" x="380" y="326" text-anchor="middle">ESP32-S3</text>

  <g>
    <circle class="pin" cx="290" cy="150" r="10"/><text class="p" x="250" y="155" text-anchor="end">D0</text><text class="g" x="190" y="155" text-anchor="end">GPIO1</text>
    <circle class="pin" cx="290" cy="200" r="10"/><text class="p" x="250" y="205" text-anchor="end">D1</text><text class="g" x="190" y="205" text-anchor="end">GPIO2</text>
    <circle class="pin" cx="290" cy="250" r="10"/><text class="p" x="250" y="255" text-anchor="end">D2</text><text class="g" x="190" y="255" text-anchor="end">GPIO3</text>
    <circle class="pin" cx="290" cy="300" r="10"/><text class="p" x="250" y="305" text-anchor="end">D3</text><text class="g" x="190" y="305" text-anchor="end">GPIO4</text>
    <circle class="pin use" cx="290" cy="350" r="12"/><text class="p" x="250" y="355" text-anchor="end">D4 SDA</text><text class="g" x="160" y="355" text-anchor="end">GPIO5</text>
    <circle class="pin use" cx="290" cy="400" r="12"/><text class="p" x="250" y="405" text-anchor="end">D5 SCL</text><text class="g" x="160" y="405" text-anchor="end">GPIO6</text>
    <circle class="pin" cx="290" cy="450" r="10"/><text class="p" x="250" y="455" text-anchor="end">D6 TX</text><text class="g" x="170" y="455" text-anchor="end">GPIO43</text>
  </g>
  <g>
    <circle class="pin use" cx="470" cy="150" r="12"/><text class="p" x="510" y="155">5V</text><text class="g" x="560" y="155">buck 5V OUT</text>
    <circle class="pin use" cx="470" cy="200" r="12"/><text class="p" x="510" y="205">GND</text><text class="g" x="560" y="205">buck GND, INA GND</text>
    <circle class="pin use" cx="470" cy="250" r="12"/><text class="p" x="510" y="255">3V3</text><text class="g" x="560" y="255">INA228 VIN/VS</text>
    <circle class="pin" cx="470" cy="300" r="10"/><text class="p" x="510" y="305">D10</text><text class="g" x="570" y="305">GPIO9</text>
    <circle class="pin" cx="470" cy="350" r="10"/><text class="p" x="510" y="355">D9</text><text class="g" x="570" y="355">GPIO8</text>
    <circle class="pin" cx="470" cy="400" r="10"/><text class="p" x="510" y="405">D8</text><text class="g" x="570" y="405">GPIO7</text>
    <circle class="pin" cx="470" cy="450" r="10"/><text class="p" x="510" y="455">D7 RX</text><text class="g" x="585" y="455">GPIO44: not used</text>
  </g>
  <text class="g" x="380" y="545" text-anchor="middle">Highlighted pins are the only ones wired. USB-C is for the first bench flash only.</text>
</svg>
