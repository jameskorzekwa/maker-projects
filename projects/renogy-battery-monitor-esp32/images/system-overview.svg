<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Casita battery monitor with an INA228: system overview</title>
  <desc id="desc">The battery bank's negative passes through the 500 A shunt. The display's shielded cable carries battery positive and negative (B plus, B minus) and the shunt sense pair (Rs plus, Rs minus) to the Renogy RBM500 display. Inside the display housing, the stock display board keeps working. A buck regulator takes B plus and B minus to make 5 volts for a XIAO ESP32-S3. An INA228 breakout measures the Rs sense pair and the battery voltage and talks to the XIAO over I2C. The XIAO counts amp-hours for state of charge and sends readings over Wi-Fi to Home Assistant and a local web page.</desc>
  <defs>
    <style>
      .box{fill:#f5f7fa;stroke:#243b53;stroke-width:3}
      .batt{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .housing{fill:#fffaf0;stroke:#b44d12;stroke-width:3;stroke-dasharray:12 8}
      .esp{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .reg{fill:#fde8e8;stroke:#c53030;stroke-width:3}
      .ina{fill:#efe9ff;stroke:#6b46c1;stroke-width:3}
      .ha{fill:#e6fffa;stroke:#0f766e;stroke-width:3}
      .t{font:600 20px system-ui,sans-serif;fill:#102a43}
      .s{font:15px system-ui,sans-serif;fill:#334e68}
      .w{fill:none;stroke-width:4}
      .analog{stroke:#b44d12}
      .sense{stroke:#6b46c1}
      .pwr{stroke:#c53030}
      .i2c{stroke:#2f855a}
      .rf{stroke:#0f766e;stroke-dasharray:10 7}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334e68"/></marker>
  </defs>
  <rect width="1100" height="580" rx="24" fill="#fff"/>

  <rect class="batt" x="30" y="50" width="190" height="120" rx="16"/>
  <text class="t" x="125" y="98" text-anchor="middle">600 Ah bank</text>
  <text class="s" x="125" y="126" text-anchor="middle">2 x Renogy 300 Ah</text>
  <text class="s" x="125" y="150" text-anchor="middle">LiFePO4, 12.8 V</text>

  <rect class="batt" x="30" y="280" width="190" height="110" rx="16"/>
  <text class="t" x="125" y="325" text-anchor="middle">500 A shunt</text>
  <text class="s" x="125" y="352" text-anchor="middle">battery negative</text>
  <path class="w analog" d="M125 170 V280" marker-end="url(#arrow)"/>
  <text class="s" x="140" y="230">B+ wire (fused)</text>

  <rect class="housing" x="270" y="170" width="520" height="380" rx="20"/>
  <text class="t" x="530" y="202" text-anchor="middle">RBM500 display housing</text>

  <rect class="batt" x="290" y="225" width="170" height="140" rx="14"/>
  <text class="t" x="375" y="262" text-anchor="middle">Display board</text>
  <text class="s" x="375" y="290" text-anchor="middle">unchanged; still</text>
  <text class="s" x="375" y="312" text-anchor="middle">shows its own</text>
  <text class="s" x="375" y="334" text-anchor="middle">readings</text>
  <path class="w analog" d="M220 335 H290" marker-end="url(#arrow)"/>
  <text class="s" x="250" y="320" text-anchor="middle">B+ B-</text>
  <text class="s" x="250" y="362" text-anchor="middle">Rs+ Rs-</text>

  <rect class="reg" x="500" y="225" width="120" height="70" rx="12"/>
  <text class="t" x="560" y="257" text-anchor="middle">Buck</text>
  <text class="s" x="560" y="281" text-anchor="middle">12 V to 5 V</text>
  <path class="w pwr" d="M460 260 H500" marker-end="url(#arrow)"/>

  <rect class="ina" x="500" y="400" width="140" height="120" rx="12"/>
  <text class="t" x="570" y="440" text-anchor="middle">INA228</text>
  <text class="s" x="570" y="466" text-anchor="middle">shunt mV,</text>
  <text class="s" x="570" y="488" text-anchor="middle">battery V</text>
  <path class="w sense" d="M460 340 H480 V450 H500" marker-end="url(#arrow)"/>
  <text class="s" x="395" y="430" text-anchor="middle">Rs+ Rs-, B+</text>

  <rect class="esp" x="650" y="260" width="120" height="150" rx="12"/>
  <text class="t" x="710" y="300" text-anchor="middle">XIAO</text>
  <text class="t" x="710" y="324" text-anchor="middle">ESP32-S3</text>
  <text class="s" x="710" y="352" text-anchor="middle">counts Ah,</text>
  <text class="s" x="710" y="374" text-anchor="middle">SoC</text>
  <path class="w pwr" d="M620 260 H640 V290 H650" marker-end="url(#arrow)"/>
  <path class="w i2c" d="M640 460 H710 V410" marker-end="url(#arrow)"/>
  <text class="s" x="680" y="482" text-anchor="middle">I2C</text>

  <rect class="ha" x="830" y="50" width="250" height="150" rx="16"/>
  <text class="t" x="955" y="92" text-anchor="middle">Home Assistant</text>
  <text class="s" x="955" y="120" text-anchor="middle">SoC, voltage, current,</text>
  <text class="s" x="955" y="142" text-anchor="middle">power, time to empty,</text>
  <text class="s" x="955" y="164" text-anchor="middle">daily energy, alerts</text>

  <rect class="box" x="870" y="330" width="190" height="110" rx="16"/>
  <text class="t" x="965" y="370" text-anchor="middle">Phone</text>
  <text class="s" x="965" y="398" text-anchor="middle">local web page</text>
  <text class="s" x="965" y="420" text-anchor="middle">on trailer Wi-Fi</text>

  <path class="w rf" d="M770 300 L880 200" marker-end="url(#arrow)"/>
  <path class="w rf" d="M770 380 H870" marker-end="url(#arrow)"/>
  <text class="s" x="820" y="262">Wi-Fi</text>

  <text class="s" x="530" y="572" text-anchor="middle">Everything in the housing shares the display's ground (battery side of the shunt).</text>
</svg>
