<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Renogy battery monitor to Home Assistant system overview</title>
  <desc id="desc">The 500 A shunt sends analog sense signals to the Renogy RBM500 display. The display's serial transmit line passes through a PC817 optocoupler to a Seeed XIAO ESP32-S3, which sends the readings over Wi-Fi to Home Assistant and a local web page. The display is powered from the battery side of the shunt; the XIAO is powered from the trailer's 12 V system through a USB adapter.</desc>
  <defs>
    <style>
      .box{fill:#f5f7fa;stroke:#243b53;stroke-width:3}
      .batt{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .iso{fill:#fdf2ff;stroke:#7b2cbf;stroke-width:3}
      .esp{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .ha{fill:#e6fffa;stroke:#0f766e;stroke-width:3}
      .t{font:600 20px system-ui,sans-serif;fill:#102a43}
      .s{font:15px system-ui,sans-serif;fill:#334e68}
      .w{fill:none;stroke-width:4}
      .analog{stroke:#b44d12}
      .data{stroke:#7b2cbf}
      .pwr{stroke:#c53030}
      .rf{stroke:#0f766e;stroke-dasharray:10 7}
      .barrier{stroke:#7b2cbf;stroke-width:3;stroke-dasharray:8 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334e68"/></marker>
  </defs>
  <rect width="1100" height="560" rx="24" fill="#fff"/>

  <rect class="batt" x="30" y="70" width="190" height="130" rx="16"/>
  <text class="t" x="125" y="120" text-anchor="middle">600 Ah bank</text>
  <text class="s" x="125" y="148" text-anchor="middle">2 x Renogy 300 Ah</text>
  <text class="s" x="125" y="172" text-anchor="middle">LiFePO4, 12.8 V</text>

  <rect class="batt" x="30" y="300" width="190" height="110" rx="16"/>
  <text class="t" x="125" y="345" text-anchor="middle">500 A shunt</text>
  <text class="s" x="125" y="372" text-anchor="middle">battery negative</text>
  <path class="w analog" d="M125 200 V300" marker-end="url(#arrow)"/>

  <rect class="batt" x="290" y="250" width="230" height="210" rx="16"/>
  <text class="t" x="405" y="292" text-anchor="middle">Renogy RBM500</text>
  <text class="t" x="405" y="318" text-anchor="middle">display</text>
  <text class="s" x="405" y="346" text-anchor="middle">Baiway TF03H V35 board</text>
  <text class="s" x="405" y="372" text-anchor="middle">computes SoC, V, A, Ah</text>
  <text class="s" x="405" y="398" text-anchor="middle">TTL serial: 9600 8N1</text>
  <text class="s" x="405" y="424" text-anchor="middle">16-byte frame per second</text>
  <path class="w analog" d="M220 355 H290" marker-end="url(#arrow)"/>
  <text class="s" x="255" y="340" text-anchor="middle">Rs+ Rs-</text>
  <text class="s" x="255" y="385" text-anchor="middle">B+ B-</text>

  <rect class="iso" x="580" y="285" width="150" height="140" rx="16"/>
  <text class="t" x="655" y="330" text-anchor="middle">PC817</text>
  <text class="s" x="655" y="356" text-anchor="middle">optocoupler</text>
  <text class="s" x="655" y="380" text-anchor="middle">+ 2 resistors</text>
  <line class="barrier" x1="655" y1="250" x2="655" y2="460"/>
  <path class="w data" d="M520 355 H580" marker-end="url(#arrow)"/>
  <text class="s" x="550" y="340" text-anchor="middle">Tx</text>

  <rect class="esp" x="790" y="285" width="170" height="140" rx="16"/>
  <text class="t" x="875" y="330" text-anchor="middle">XIAO</text>
  <text class="t" x="875" y="356" text-anchor="middle">ESP32-S3</text>
  <text class="s" x="875" y="384" text-anchor="middle">ESPHome</text>
  <path class="w data" d="M730 355 H790" marker-end="url(#arrow)"/>
  <text class="s" x="760" y="340" text-anchor="middle">D7</text>

  <rect class="box" x="790" y="470" width="170" height="70" rx="14"/>
  <text class="s" x="875" y="500" text-anchor="middle">12 V USB-C adapter</text>
  <text class="s" x="875" y="522" text-anchor="middle">(trailer 12 V system)</text>
  <path class="w pwr" d="M875 470 V425" marker-end="url(#arrow)"/>

  <rect class="ha" x="760" y="60" width="300" height="150" rx="16"/>
  <text class="t" x="910" y="100" text-anchor="middle">Home Assistant</text>
  <text class="s" x="910" y="128" text-anchor="middle">ESPHome integration</text>
  <text class="s" x="910" y="152" text-anchor="middle">SoC, voltage, current, power,</text>
  <text class="s" x="910" y="174" text-anchor="middle">Ah, time remaining, alerts</text>
  <path class="w rf" d="M875 285 V210" marker-end="url(#arrow)"/>
  <text class="s" x="890" y="255">Wi-Fi</text>

  <rect class="box" x="560" y="60" width="170" height="110" rx="16"/>
  <text class="t" x="645" y="100" text-anchor="middle">Phone</text>
  <text class="s" x="645" y="128" text-anchor="middle">local web page</text>
  <text class="s" x="645" y="150" text-anchor="middle">on trailer Wi-Fi</text>
  <path class="w rf" d="M820 285 L700 170" marker-end="url(#arrow)"/>

  <text class="s" x="655" y="485" text-anchor="middle">isolation barrier</text>
  <text class="s" x="405" y="490" text-anchor="middle">battery-side ground (B-)</text>
  <text class="s" x="1010" y="380" text-anchor="middle">trailer</text>
  <text class="s" x="1010" y="402" text-anchor="middle">DC ground</text>
</svg>
