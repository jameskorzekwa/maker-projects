# ARCHIVED: does not work on the Renogy RBM500 / Baiway TF03H V35 display.
# The display firmware never transmits on the Tx hole. See ../../README.md,
# "Why not the display's serial port". Kept for reference only.
#
# Casita battery monitor bridge
#
# Seeed Studio XIAO ESP32-S3 mounted inside the Renogy RBM500 (Baiway TF03H)
# battery monitor display housing. It is powered from the display's B+/B-
# through a 12 V to 5 V buck regulator, reads the display's TTL serial output
# on D7, and publishes the readings to Home Assistant. See ../README.md.
#
# Entity names omit the device name; Home Assistant prefixes them with the
# friendly name, e.g. sensor.casita_battery_monitor_state_of_charge.

substitutions:
  name: casita-battery-monitor
  friendly_name: Casita Battery Monitor
  # XIAO pin D7 (silkscreen RX) = GPIO44. Wired to the display's Tx hole
  # through a 1 kohm resistor (3.3 V logic) or a 10k/20k divider (5 V logic).
  uart_rx_pin: GPIO44
  refresh_interval: 5s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32s3
  variant: ESP32S3
  framework:
    type: esp-idf

# Keep logging on the native USB port so GPIO43/GPIO44 stay free for the UART.
# Set level: DEBUG temporarily to see every parsed frame in the logs.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The XIAO draws its power through the thin shunt cable. Lower transmit
  # power (default 20 dB) to reduce current spikes on that cable. Raise it if
  # the signal is weak where the display is mounted.
  output_power: 15dB
  ap:
    ssid: "Casita Battery Fallback"
    password: !secret fallback_ap_password

captive_portal:

# Local status page at http://casita-battery-monitor.local for checking the
# battery from a phone on the trailer's Wi-Fi without Home Assistant.
web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

# Needed by the daily energy counters. SNTP works whether or not Home
# Assistant is reachable, as long as the trailer has internet.
time:
  - platform: sntp
    id: sntp_time

# Third-party TF03K frame decoder (Apache-2.0), pinned to a reviewed commit.
external_components:
  - source:
      type: git
      url: https://github.com/edillmann/esphome-tf03k-smart-shunt
      ref: f248cd1f3e2ffa26eef3c8892f57fae07a0c58f9
    components: [tf03k_shunt]

uart:
  - id: tf03k_uart
    rx_pin:
      number: ${uart_rx_pin}
      mode:
        input: true
        pullup: true
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 256

tf03k_shunt:
  id: casita_shunt
  uart_id: tf03k_uart
  publish_interval: ${refresh_interval}
  # The display stops transmitting when it sleeps at low current, so allow a
  # generous gap before reporting the link as offline.
  online_timeout: 60s
  online:
    name: "Monitor Online"
  state_of_charge:
    name: "State of Charge"
  voltage:
    name: "Voltage"
  capacity:
    name: "Remaining Capacity"
    device_class: ""
  current:
    name: "Current"
  remaining_time:
    name: "Time Remaining"
    filters:
      - throttle: 60s
  power:
    name: "Power"
    filters:
      - throttle: ${refresh_interval}
  charging_power:
    id: casita_charging_power
    internal: true
  discharging_power:
    id: casita_discharging_power
    internal: true

sensor:
  - platform: total_daily_energy
    name: "Daily Charged Energy"
    power_id: casita_charging_power
    method: trapezoid
    # restore: true writes to flash on every update; leave it off to avoid wear.
    restore: false
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: ${refresh_interval}

  - platform: total_daily_energy
    name: "Daily Discharged Energy"
    power_id: casita_discharging_power
    method: trapezoid
    restore: false
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: ${refresh_interval}

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
