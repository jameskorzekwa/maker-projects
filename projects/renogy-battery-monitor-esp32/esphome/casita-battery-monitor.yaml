# Casita battery monitor (INA228)
#
# Seeed Studio XIAO ESP32-S3 and an INA228 breakout inside the Renogy RBM500
# display housing. Everything is powered from the display's B+/B- (battery
# side of the shunt). The INA228 reads the shunt through the display cable's
# Rs+/Rs- sense pair and the battery voltage on VBUS. The ESP32 counts amp-hours
# in software to track state of charge. See ../README.md before flashing.
#
# Entity names omit the device name; Home Assistant prefixes them with the
# friendly name, e.g. sensor.casita_battery_monitor_state_of_charge.

substitutions:
  name: casita-battery-monitor
  friendly_name: Casita Battery Monitor

  # --- Calibration: see README "Calibrate" ---
  # Shunt resistance. 500 A / 75 mV = 0.00015 ohm; 500 A / 50 mV = 0.0001 ohm.
  # Replace with the value you measure.
  shunt_resistance: 0.00015 ohm
  # "-1" or "1". Pick the value that makes charging read positive and
  # discharging read negative.
  current_sign: "-1"

  # --- Battery bank ---
  battery_capacity_ah: "600"
  # Fraction of charging amp-hours that end up stored (LiFePO4 is about 99%).
  charge_efficiency: "0.99"
  # Full-charge resync: SoC is set to 100% when the bank is at or above
  # full_voltage while the charge current has tapered to full_tail_current
  # or less for full_hold_seconds.
  full_voltage: "14.0"
  full_tail_current: "6.0"
  full_hold_seconds: "120"
  # Empty floor: if the bank sits at or below empty_voltage with a discharge
  # current under empty_max_current for 60 s, SoC is capped at empty_soc.
  # Set empty_voltage to "0" to disable.
  empty_voltage: "11.8"
  empty_max_current: "20.0"
  empty_soc: "5.0"

  # --- Pins: XIAO D4 = GPIO5 (SDA), D5 = GPIO6 (SCL) ---
  sda_pin: GPIO5
  scl_pin: GPIO6
  ina228_address: "0x40"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32s3
  variant: ESP32S3
  framework:
    type: esp-idf

# Remaining amp-hours are saved to flash so SoC survives a power loss. Write
# at most every 10 minutes to limit flash wear; a power loss loses at most
# that much counting, and the next full charge resyncs it.
preferences:
  flash_write_interval: 10min

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The XIAO is powered through the thin shunt cable; lower transmit power
  # (default 20 dB) to reduce current spikes on it.
  output_power: 15dB
  ap:
    ssid: "Casita Battery Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

time:
  - platform: sntp
    id: sntp_time

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  frequency: 400kHz
  scan: true

globals:
  # Amp-hours currently stored in the bank. Restored after a reboot.
  - id: remaining_ah
    type: float
    restore_value: true
    initial_value: ${battery_capacity_ah}
  # Last INA228 charge-accumulator reading, used to compute each change.
  - id: last_charge_ah
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: full_timer_s
    type: int
    restore_value: false
    initial_value: "0"
  - id: empty_timer_s
    type: int
    restore_value: false
    initial_value: "0"

sensor:
  # ---------------- INA228 raw readings (1 s) ----------------
  - platform: ina2xx_i2c
    id: ina
    model: INA228
    address: ${ina228_address}
    shunt_resistance: ${shunt_resistance}
    max_current: 500A
    # 0 = +/-163.84 mV, enough for a 500 A shunt at 75 mV or 50 mV.
    adc_range: 0
    adc_averaging: 64
    adc_time:
      bus_voltage: 1052us
      shunt_voltage: 4120us
      temperature: 1052us
    # The INA228 charge accumulator restarts at zero on boot; the ESP32
    # tracks changes, so this is harmless.
    reset_on_boot: true
    update_interval: 1s
    # Raw 1 s readings stay internal; the published values below are averaged.
    bus_voltage:
      name: "Raw Bus Voltage"
      id: v_raw
      internal: true
    current:
      name: "Raw Current"
      id: i_raw
      internal: true
      filters:
        - multiply: ${current_sign}
    shunt_voltage:
      name: "Raw Shunt Voltage"
      id: shunt_mv_raw
      internal: true
    temperature:
      name: "INA228 Temperature"
      entity_category: diagnostic
      accuracy_decimals: 1
      filters:
        - throttle: 60s
    charge:
      name: "Raw Charge"
      id: charge_ah_raw
      internal: true
      on_value:
        then:
          - lambda: |-
              // Coulomb counting from the INA228's hardware charge
              // accumulator, which integrates every conversion.
              if (isnan(x)) return;
              if (isnan(id(last_charge_ah))) { id(last_charge_ah) = x; return; }
              float delta = (x - id(last_charge_ah)) * (${current_sign});
              id(last_charge_ah) = x;
              if (delta > 0) delta *= ${charge_efficiency};
              float cap = ${battery_capacity_ah};
              float r = id(remaining_ah) + delta;
              if (r < 0) r = 0;
              if (r > cap) r = cap;
              id(remaining_ah) = r;

  # ---------------- Published values (5 s averages) ----------------
  - platform: copy
    source_id: v_raw
    id: batt_voltage
    name: "Voltage"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle_average: 5s

  - platform: copy
    source_id: i_raw
    id: batt_current
    name: "Current"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle_average: 5s

  - platform: template
    id: batt_power
    name: "Power"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(batt_voltage).state * id(batt_current).state;

  - platform: template
    id: batt_soc
    name: "State of Charge"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(remaining_ah) / (${battery_capacity_ah}) * 100.0f;

  - platform: template
    name: "Remaining Capacity"
    unit_of_measurement: Ah
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:battery-charging
    update_interval: 5s
    lambda: |-
      return id(remaining_ah);

  - platform: template
    name: "Time to Empty"
    unit_of_measurement: h
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float i = id(batt_current).state;
      if (isnan(i) || i > -0.3f) return NAN;
      return id(remaining_ah) / -i;

  - platform: template
    name: "Time to Full"
    unit_of_measurement: h
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float i = id(batt_current).state;
      if (isnan(i) || i < 0.3f) return NAN;
      return (${battery_capacity_ah} - id(remaining_ah)) / i;

  - platform: copy
    source_id: shunt_mv_raw
    name: "Shunt Voltage"
    unit_of_measurement: mV
    entity_category: diagnostic
    accuracy_decimals: 4
    filters:
      - throttle_average: 10s

  # Split power into charge and discharge for the daily energy counters.
  - platform: template
    id: charging_power
    internal: true
    unit_of_measurement: W
    update_interval: 5s
    lambda: |-
      float p = id(batt_power).state;
      return (isnan(p) || p < 0) ? 0.0f : p;
  - platform: template
    id: discharging_power
    internal: true
    unit_of_measurement: W
    update_interval: 5s
    lambda: |-
      float p = id(batt_power).state;
      return (isnan(p) || p > 0) ? 0.0f : -p;

  - platform: total_daily_energy
    name: "Daily Charged Energy"
    power_id: charging_power
    method: trapezoid
    restore: false
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: total_daily_energy
    name: "Daily Discharged Energy"
    power_id: discharging_power
    method: trapezoid
    restore: false
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

# Full-charge resync and low-voltage floor.
interval:
  - interval: 5s
    then:
      - lambda: |-
          float v = id(batt_voltage).state;
          float i = id(batt_current).state;
          if (isnan(v) || isnan(i)) return;
          float cap = ${battery_capacity_ah};

          if (v >= ${full_voltage} && i >= 0.0f && i <= ${full_tail_current}) {
            id(full_timer_s) += 5;
            if (id(full_timer_s) >= ${full_hold_seconds} && id(remaining_ah) < cap) {
              id(remaining_ah) = cap;
              ESP_LOGI("soc", "Full charge detected (%.2f V, %.2f A): SoC set to 100%%", v, i);
            }
          } else {
            id(full_timer_s) = 0;
          }

          if (${empty_voltage} > 0 && v <= ${empty_voltage} && i <= 0.0f && -i < ${empty_max_current}) {
            id(empty_timer_s) += 5;
            float floor_ah = cap * ${empty_soc} / 100.0f;
            if (id(empty_timer_s) >= 60 && id(remaining_ah) > floor_ah) {
              id(remaining_ah) = floor_ah;
              ESP_LOGW("soc", "Low voltage (%.2f V): SoC capped at ${empty_soc}%%", v);
            }
          } else {
            id(empty_timer_s) = 0;
          }

number:
  - platform: template
    name: "Set State of Charge"
    icon: mdi:battery-sync
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    lambda: |-
      return id(remaining_ah) / (${battery_capacity_ah}) * 100.0f;
    set_action:
      - lambda: |-
          id(remaining_ah) = (${battery_capacity_ah}) * x / 100.0f;
          ESP_LOGI("soc", "SoC set manually to %.0f%%", x);

button:
  - platform: template
    name: "Mark Battery Full"
    icon: mdi:battery-check
    entity_category: config
    on_press:
      - lambda: |-
          id(remaining_ah) = ${battery_capacity_ah};
          ESP_LOGI("soc", "SoC set to 100%% by button");
  - platform: restart
    name: "Restart"
    entity_category: config
