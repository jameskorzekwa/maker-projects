<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">Proflame X0A to NiceMCU ESP32-C5 UART wiring</title>
  <desc id="desc">Installed X0A wire-entry view, red SW1 to the right. White power unused, green IFC TX to GPIO4 RX, brown IFC RX to GPIO5 TX, yellow ground to ESP ground. ESP powered separately by USB. Verified working 2026-11-07; white supply is 6.24 V (living room) / 3.24 V (basement).</desc>
  <rect width="1280" height="850" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="40" y="48" font-size="28" font-weight="bold">Proflame X0A → NiceMCU ESP32-C5</text>
    <text x="40" y="80" font-size="18">Three connected wires. White power lead stays disconnected. UART: 9600 baud, 8-N-1.</text>
    <rect x="40" y="105" width="1200" height="70" rx="8" fill="#fff1d6" stroke="#a65d00"/>
    <text x="60" y="133" font-size="17" font-weight="bold">Before wiring: isolate fireplace mains AND battery backup; disconnect ESP USB power.</text>
    <text x="60" y="158" font-size="17">Do not parallel the OEM dongle. Never feed ESP 5V, VIN or 3V3 into X0A.</text>

    <rect x="45" y="205" width="680" height="175" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="65" y="235" font-size="20" font-weight="bold">Fireplace IFC: X0A diagnostic connector</text>
    <text x="65" y="262" font-size="16">Wire-entry view as installed in your photo; SW1 is to the right.</text>
    <rect x="85" y="285" width="480" height="70" rx="5" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <g font-size="17" text-anchor="middle">
      <text x="145" y="310">White</text><text x="145" y="336">SUPPLY</text>
      <text x="265" y="310">Green</text><text x="265" y="336">IFC TX</text>
      <text x="385" y="310">Brown</text><text x="385" y="336">IFC RX</text>
      <text x="505" y="310">Yellow</text><text x="505" y="336">GND ●</text>
    </g>
    <circle cx="645" cy="319" r="22" fill="#b91c1c"/>
    <text x="645" y="362" text-anchor="middle" font-size="17">SW1 — do not press</text>

    <rect x="900" y="205" width="335" height="400" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="925" y="239" font-size="21" font-weight="bold">NiceMCU ESP32-C5</text>
    <text x="925" y="270" font-size="16">Logical GPIO labels, NOT a</text>
    <text x="925" y="293" font-size="16">physical header layout.</text>
    <text x="925" y="326" font-size="16">Confirm GPIO4/5 are exposed</text>
    <text x="925" y="349" font-size="16">and unused on your PCB.</text>
    <circle cx="920" cy="420" r="7" fill="#166534"/>
    <text x="945" y="426" font-size="21" font-weight="bold">GPIO4 / IO4 — RX</text>
    <circle cx="920" cy="480" r="7" fill="#854d0e"/>
    <text x="945" y="486" font-size="21" font-weight="bold">GPIO5 / IO5 — TX</text>
    <circle cx="920" cy="540" r="7" fill="#a16207"/>
    <text x="945" y="546" font-size="21" font-weight="bold">GND</text>
    <text x="925" y="583" font-size="17">USB: separate power supply</text>

    <path d="M145 355 V430" fill="none" stroke="#475569" stroke-width="12"/>
    <path d="M145 355 V430" fill="none" stroke="#ffffff" stroke-width="7"/>
    <rect x="129" y="427" width="32" height="20" fill="#111827"/>
    <text x="65" y="473" font-size="17" font-weight="bold">WHITE: insulated end</text>
    <text x="65" y="497" font-size="16">No ESP connection</text>
    <path d="M265 355 V420 H920" fill="none" stroke="#15803d" stroke-width="7"/>
    <path d="M385 355 V480 H920" fill="none" stroke="#854d0e" stroke-width="7"/>
    <path d="M505 355 V540 H920" fill="none" stroke="#9a6700" stroke-width="10"/>
    <path d="M505 355 V540 H920" fill="none" stroke="#facc15" stroke-width="6"/>
    <text x="580" y="410" font-size="16">IFC sends → ESP receives</text>
    <text x="580" y="470" font-size="16">IFC receives ← ESP sends</text>
    <text x="580" y="530" font-size="16">Common signal ground</text>

    <text x="45" y="608" font-size="16">Wire crossings without junction dots are NOT connections.</text>
    <text x="45" y="638" font-size="18" font-weight="bold">Orientation matters: the unplugged connector's mating-face view is mirrored.</text>
    <text x="45" y="668" font-size="17">JST XH 4-position housing (XHP-4). Colors refer to your existing cable, not a wiring standard.</text>
    <text x="45" y="698" font-size="17">Source: Bonaparte ProFlame 2 UART documentation + your X0A filled-dot / wire photographs.</text>
    <text x="45" y="728" font-size="17">Verified 2026-11-07: white carries 6.24 V (living room) / 3.24 V (basement) - leave unconnected.</text>
    <text x="45" y="758" font-size="17">GPIO4/5: valid C5 UART pins; do not use external pad JTAG simultaneously. Keep USB GPIO13/14 free.</text>
    <text x="45" y="798" font-size="18" font-weight="bold">Firmware: full fireplace control from Home Assistant (see README).</text>
  </g>
</svg>
