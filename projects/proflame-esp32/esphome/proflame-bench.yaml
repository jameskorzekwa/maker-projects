# USB-ONLY BENCH IMAGE. Disconnect every GPIO lead before powering/flashing.
# No fireplace protocol, Wi-Fi credentials, actuator controls or UART output.
esphome:
  name: proflame-bench
  friendly_name: Proflame USB Bench
  min_version: 2026.10.2

esp32:
  # Generic chip target; exact NiceMCU PCB/USB routing still unverified.
  variant: esp32c5
  # Build allocation only: verify actual flash >= 4 MB before flashing.
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  level: INFO

interval:
  - interval: 10s
    then:
      - logger.log:
          level: INFO
          format: "USB-only bench alive; no IFC connection permitted"
