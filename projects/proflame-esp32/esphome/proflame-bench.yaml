# Proflame X0A replacement firmware for the NiceMCU ESP32-C5.
# GPIO4 = RX (IFC TX, green), GPIO5 = TX (IFC RX, brown), GND = yellow.
# White (IFC supply, owner-corrected reading 3.3 V) stays disconnected; USB power.
#
# Feature parity with the proflame_connect_wifi integration where the UART
# protocol supports it: power, mode (Off/Manual/Thermostat/Smart), flame,
# fan, light (wired to AUX on this fireplace), pilot; plus split flow and
# the unused IFC lamp output level. Room temperature and thermostat
# setpoint have no documented UART register and are NOT implemented.
#
# Safety rules enforced below:
# - Nothing is ever written at boot or reconnect. Periodic traffic is GET only.
# - A command runs only from an explicit Home Assistant action, is sent once,
#   and is never queued or replayed. A second command while one runs is refused.
# - Before writing, the firmware requests control once if needed, verifies it
#   was actually granted (the IFC echoes even when refusing), re-reads both
#   state registers and rejects the command unless that read is fresh.
# - Writes are read-modify-write from the fresh read; undocumented bits are kept.
# - Each command is confirmed by reading the registers back afterwards.
# Credentials come from Device Builder secrets.yaml; none are stored here.
esphome:
  name: proflame-bench
  friendly_name: Proflame USB Bench
  min_version: 2026.10.2
  includes:
    - ifc_query.h

esp32:
  variant: esp32c5
  flash_size: 4MB
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  reboot_timeout: 0s
  on_client_disconnected:
    - delay: 1s
    - script.execute: tstat_eval
  encryption:
    key: !secret proflame_bench_api_key

ota:
  - platform: esphome
    password: !secret proflame_bench_ota_password

logger:
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  level: DEBUG
  logs:
    sensor: INFO
    text_sensor: INFO
    number: INFO
    select: INFO
    switch: INFO
    api: INFO
    api.connection: INFO
    wifi: INFO

uart:
  id: ifc_uart
  rx_pin:
    number: GPIO4
    mode:
      input: true
      pullup: false
      pulldown: false
  tx_pin: GPIO5
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      bytes: 6
      timeout: 20ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');
          if (direction != uart::UART_DIRECTION_RX) return;
          id(rx_count) += bytes.size();
          // Ownership request reply. This IFC echoes even when refusing, so the
          // outcome is decided by the next GET 0x16 control check.
          const auto set_reply = proflame_query::classify_control_set_reply(bytes.data(), bytes.size());
          if (set_reply != proflame_query::Result::INVALID) {
            id(last_reply_ms) = millis();
            id(link_seen) = true;
            if (set_reply == proflame_query::Result::EXTERNAL_CONTROL) {
              id(control_verify_pending) = false;
              id(control_request_result).publish_state("Denied (remote in use)");
            } else {
              id(control_verify_pending) = true;
              id(control_request_result).publish_state("Reply received; checking control");
            }
            return;
          }
          if (proflame_query::is_state_set_echo(bytes.data(), bytes.size())) {
            id(last_reply_ms) = millis();
            ESP_LOGD("proflame", "State SET echo received (confirmation comes from read-back)");
            return;
          }
          proflame_query::Reply r{};
          if (!proflame_query::parse_get_reply(bytes.data(), bytes.size(), r)) {
            id(bad_frames) += 1;
            ESP_LOGW("proflame", "Ignored %u byte(s): not a valid reply",
                     static_cast<unsigned>(bytes.size()));
            return;
          }
          id(last_reply_ms) = millis();
          id(link_seen) = true;
          char raw[12];
          snprintf(raw, sizeof(raw), "%02X %02X %02X", r.payload[0], r.payload[1], r.payload[2]);

          if (r.reg == proflame_query::REG_SETPOINT) {
            id(sp_f) = proflame_query::setpoint_f(r);
            id(sp_valid) = true;
            id(sp_seen) = true;
            id(remote_setpoint).publish_state(id(sp_f));
            return;
          }
          if (r.reg == proflame_query::REG_SETPOINT_MIRROR) return;
          if (r.reg == proflame_query::REG_ROOM_TEMP) {
            const float f = proflame_query::room_temp_f(r);
            if (f > 20.0f && f < 120.0f) id(remote_room_temperature).publish_state((f - 32.0f) * 5.0f / 9.0f);
            return;
          }
          if (r.reg != proflame_query::REG_CONTROL) {
            // State bytes are held as PENDING. They are only accepted when the
            // control checks immediately before AND after them both say UART;
            // this rejects the all-zero replies the IFC gives the remote.
            if (r.reg == proflame_query::REG_STATE1) {
              id(state1_raw).publish_state(raw);
              id(pend_s1) = r.payload[1];
              id(pend_s1_ok) = id(last_ctl_uart);
            } else {
              id(state2_raw).publish_state(raw);
              id(pend_s2) = r.payload[1];
              id(pend_s2_ok) = id(last_ctl_uart);
            }
            return;
          }

          const auto c = proflame_query::control_state(r);
          const bool uart = c == proflame_query::Result::UART_CONTROL;
          id(ctl_seen) = true;
          id(remote_in_control) = !uart;
          id(ifc_control).publish_state(
              uart ? "UART (ESP32/Wi-Fi side)" :
              c == proflame_query::Result::EXTERNAL_CONTROL ? "External (remote)" :
              std::string("Unknown value ") + raw);
          if (id(control_verify_pending)) {
            id(control_verify_pending) = false;
            id(control_request_result).publish_state(
                uart ? "Granted (verified)" : "Not granted (remote still in control)");
          }
          const bool commit = uart && id(last_ctl_uart) && id(pend_s1_ok) && id(pend_s2_ok);
          id(last_ctl_uart) = uart;
          id(pend_s1_ok) = false;
          id(pend_s2_ok) = false;

          if (!uart) {
            id(have_state) = false;
            if (c != proflame_query::Result::EXTERNAL_CONTROL) return;  // unknown value: pause only
            if (id(tstat_mode) > 0 && id(cl_burning)) {
              ESP_LOGW("proflame", "Remote took control while the thermostat was heating");
              id(cmd_result).publish_state("ALERT: remote took control while thermostat heating");
            }
            id(pending_off) = false;  // the remote now has authority
            if (id(tstat_mode) > 0) {
              id(tstat_mode) = 0;
              id(tstat_expect) = -1;
              id(tstat_status) = "Cancelled: remote took control";
              id(publish_climate).execute();
            }
            if (!id(remote_published)) {
              id(remote_published) = true;
              id(fireplace_status).publish_state("Unknown (remote in control)");
              id(flame_height).publish_state(NAN);
              id(fan_speed).publish_state(NAN);
              id(light_brightness).publish_state(NAN);
            }
            return;
          }
          id(remote_published) = false;
          if (!commit) return;

          // Commit a consistent pair of state bytes.
          id(s1_byte) = id(pend_s1);
          id(s2_byte) = id(pend_s2);
          id(have_state) = true;
          id(state_seen) = true;
          const proflame_query::Reply r1{proflame_query::REG_STATE1, {0, id(s1_byte), 0}};
          const proflame_query::Reply r2{proflame_query::REG_STATE2, {0, id(s2_byte), 0}};
          const auto s1 = proflame_query::decode_state1(r1);
          const auto s2 = proflame_query::decode_state2(r2);
          if (s2.flame > 0 && s2.flame <= 6) id(stored_flame) = s2.flame;
          if (s1.mode >= 1 && s1.mode <= 3 && !(s1.mode == 1 && s2.flame == 0)) id(stored_mode) = s1.mode;
          const bool burning = s1.mode != 0 && !(s1.mode == 1 && s2.flame == 0);
          if (!id(burn_seeded)) { id(burn_seeded) = true; id(prev_burning) = burning; }
          if (burning != id(prev_burning)) {
            id(tstat_switch_ms) = millis();
            id(tstat_switched) = true;
          }
          id(prev_burning) = burning;
          if (!burning && !id(apply_cmd).is_running()) id(pending_off) = false;
          id(fireplace_status).publish_state(s1.mode == 0 ? "Off" :
              (s1.mode == 1 && s2.flame == 0) ? "Off (Manual, flame 0)" :
              proflame_query::mode_name(s1.mode));
          id(fireplace_power).publish_state(burning);
          id(mode_select).publish_state(proflame_query::mode_name(s1.mode));
          id(flame_height).publish_state(s2.flame);
          id(fan_speed).publish_state(s2.fan);
          id(light_brightness).publish_state(s1.light);
          id(pilot_select).publish_state(s1.continuous_pilot ? "Continuous" : "Intermittent");
          id(aux_switch).publish_state(s2.aux);
          id(split_flow_switch).publish_state(s2.split_flow);
          id(cl_known) = true;
          id(cl_burning) = burning;
          id(cl_preset) = burning ? proflame_query::mode_name(s1.mode) : "Off";
          id(publish_climate).execute();

globals:
  - {id: rx_count, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: bad_frames, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: last_reply_ms, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: link_seen, type: bool, restore_value: false, initial_value: 'false'}
  - {id: stale_published, type: bool, restore_value: false, initial_value: 'false'}
  - {id: control_verify_pending, type: bool, restore_value: false, initial_value: 'false'}
  - {id: remote_in_control, type: bool, restore_value: false, initial_value: 'true'}
  - {id: remote_published, type: bool, restore_value: false, initial_value: 'false'}
  - {id: last_ctl_uart, type: bool, restore_value: false, initial_value: 'false'}
  - {id: pend_s1, type: uint8_t, restore_value: false, initial_value: '0'}
  - {id: pend_s2, type: uint8_t, restore_value: false, initial_value: '0'}
  - {id: pend_s1_ok, type: bool, restore_value: false, initial_value: 'false'}
  - {id: pend_s2_ok, type: bool, restore_value: false, initial_value: 'false'}
  - {id: s1_byte, type: uint8_t, restore_value: false, initial_value: '0'}
  - {id: s2_byte, type: uint8_t, restore_value: false, initial_value: '0'}
  - {id: have_state, type: bool, restore_value: false, initial_value: 'false'}
  # Per-command freshness flags: cleared before a read, set when it lands.
  - {id: ctl_seen, type: bool, restore_value: false, initial_value: 'false'}
  - {id: state_seen, type: bool, restore_value: false, initial_value: 'false'}
  - {id: stored_flame, type: int, restore_value: false, initial_value: '1'}
  - {id: stored_mode, type: int, restore_value: false, initial_value: '1'}
  - {id: cmd_ok, type: bool, restore_value: false, initial_value: 'false'}
  - {id: new_s1, type: uint8_t, restore_value: false, initial_value: '0'}
  - {id: new_s2, type: uint8_t, restore_value: false, initial_value: '0'}
  - {id: send_s1, type: bool, restore_value: false, initial_value: 'false'}
  - {id: send_s2, type: bool, restore_value: false, initial_value: 'false'}
  - {id: sp_f, type: int, restore_value: false, initial_value: '0'}
  - {id: sp_valid, type: bool, restore_value: false, initial_value: 'false'}
  - {id: sp_seen, type: bool, restore_value: false, initial_value: 'false'}
  - {id: new_sp, type: int, restore_value: false, initial_value: '-1'}
  - {id: cl_known, type: bool, restore_value: false, initial_value: 'false'}
  - {id: cl_burning, type: bool, restore_value: false, initial_value: 'false'}
  - {id: cl_preset, type: std::string, restore_value: false, initial_value: '"Off"'}
  # ESP32 thermostat. tstat_mode: 0 = inactive, 1 = Thermostat, 2 = Smart.
  # Mode and target persist across reboots so regulation resumes.
  - {id: tstat_mode, type: int, restore_value: true, initial_value: '0'}
  - {id: tstat_target_f, type: float, restore_value: true, initial_value: '70.0'}
  - {id: tstat_heating, type: bool, restore_value: false, initial_value: 'false'}
  - {id: tstat_switch_ms, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: tstat_switched, type: bool, restore_value: false, initial_value: 'false'}
  - {id: tstat_flame, type: int, restore_value: false, initial_value: '0'}
  - {id: tstat_status, type: std::string, restore_value: false, initial_value: '"Inactive"'}
  # B1: an off request that couldn't run immediately; retried until the
  # verified state shows the fireplace off.
  - {id: pending_off, type: bool, restore_value: false, initial_value: 'false'}
  - {id: prev_burning, type: bool, restore_value: false, initial_value: 'false'}
  - {id: burn_seeded, type: bool, restore_value: false, initial_value: 'false'}
  # What the thermostat last commanded (-1 none, 0 off, 1 on) and when.
  - {id: tstat_expect, type: int, restore_value: false, initial_value: '-1'}
  - {id: tstat_cmd_ms, type: uint32_t, restore_value: false, initial_value: '0'}

text_sensor:
  - platform: template
    id: fireplace_status
    name: Fireplace Status
    icon: mdi:fireplace
  - platform: template
    id: tstat_status_sensor
    name: Thermostat Status
    icon: mdi:thermostat-auto
    lambda: 'return id(tstat_status);'
    update_interval: 10s
  - platform: template
    id: ifc_control
    name: IFC Control
    entity_category: diagnostic
  - platform: template
    id: control_request_result
    name: Control Request Result
    entity_category: diagnostic
  - platform: template
    id: cmd_result
    name: Last Command Result
    entity_category: diagnostic
  - platform: template
    id: state1_raw
    name: IFC State 1 Raw
    entity_category: diagnostic
  - platform: template
    id: state2_raw
    name: IFC State 2 Raw
    entity_category: diagnostic

sensor:
  # Thermostat input: the main floor thermostat's temperature from Home
  # Assistant (degrees F). Re-published in C for the climate entity.
  - platform: homeassistant
    id: ha_room_temp_f
    entity_id: sensor.main_floor_temperature
    internal: true
    on_value:
      - lambda: |-
          id(room_temperature).publish_state(std::isnan(x) ? NAN : (x - 32.0f) * 5.0f / 9.0f);
  - platform: template
    id: room_temperature
    name: Room Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
  # What the handheld remote last reported to the IFC (register 0x1F, tenths F).
  - platform: template
    id: remote_room_temperature
    name: Remote Room Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
  # The remote's own thermostat setpoint (register 0x1E, whole F).
  - platform: template
    id: remote_setpoint
    name: Remote Setpoint
    unit_of_measurement: "°F"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 30s
    entity_category: diagnostic
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 30s
    entity_category: diagnostic
  - platform: template
    name: IFC Invalid Frames
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(bad_frames);

binary_sensor:
  - platform: status
    name: Status
    entity_category: diagnostic
  - platform: template
    name: IFC Link
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(link_seen) && (millis() - id(last_reply_ms)) < 15000;

# Control entities. publish_state() from polling never triggers these actions;
# only Home Assistant commands do.
switch:
  - platform: template
    id: fireplace_power
    name: Fireplace
    icon: mdi:fireplace
    restore_mode: DISABLED
    turn_on_action:
      # Like the original: last active mode, and stored flame if flame is 0.
      - lambda: 'id(tstat_mode) = 0; id(apply_cmd).execute(1, -1, -1, -1, -1, -1, -1, -1, -1);'
    turn_off_action:
      - lambda: 'id(tstat_mode) = 0; id(request_off).execute();'
  # On this fireplace (Montigo P52DF-F) the physical light is wired to the IFC
  # AUX relay, so AUX is exposed as the on/off Light. Verified 2026-11-07.
  - platform: template
    id: aux_switch
    name: Light
    icon: mdi:lightbulb
    restore_mode: DISABLED
    turn_on_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, -1, -1, -1, 1, -1, -1);'
    turn_off_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, -1, -1, -1, 0, -1, -1);'
  - platform: template
    id: light_follows
    name: Light Follows Fireplace
    icon: mdi:lightbulb-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: split_flow_switch
    name: Split Flow
    restore_mode: DISABLED
    turn_on_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, -1, -1, -1, -1, 1, -1);'
    turn_off_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, -1, -1, -1, -1, 0, -1);'

climate:
  # Same controls as the old integration: Heat/Off, Off/Manual/Thermostat/Smart
  # presets, target temperature (register 0x1E) and room temperature (0x1F).
  - platform: template
    id: fireplace_climate
    name: Thermostat
    icon: mdi:fireplace
    optimistic: false
    restore_mode: NO_RESTORE
    sensor: room_temperature
    supports_action: true
    supported_modes: ["OFF", "HEAT"]
    custom_presets: ["Off", "Manual", "Thermostat", "Smart"]
    visual:
      min_temperature: 5.0
      max_temperature: 35.0
      temperature_step: 0.5
    set_mode_action:
      - lambda: |-
          if (x == climate::CLIMATE_MODE_OFF) {
            id(tstat_mode) = 0;
            id(request_off).execute();
          } else if (x == climate::CLIMATE_MODE_HEAT) {
            id(tstat_mode) = 0;
            id(apply_cmd).execute(1, -1, -1, -1, -1, -1, -1, -1, -1);
          }
          id(publish_climate).execute();
    set_custom_preset_action:
      - lambda: |-
          const std::string p = x.c_str();
          if (p == "Thermostat" || p == "Smart") {
            // The IFC's own thermostat modes need the handheld remote, so the
            // ESP32 regulates instead, cycling Manual mode on/off.
            id(tstat_mode) = p == "Thermostat" ? 1 : 2;
            id(tstat_expect) = -1;
            id(pending_off) = false;
            id(tstat_status) = "Starting";
            id(publish_climate).execute();
            id(tstat_eval).execute();
            return;
          }
          id(tstat_mode) = 0;
          if (p == "Off") id(request_off).execute();
          else if (p == "Manual") id(apply_cmd).execute(-1, 1, -1, -1, -1, -1, -1, -1, -1);
          id(publish_climate).execute();
    set_target_temperature_action:
      - lambda: |-
          const float f = x * 9.0f / 5.0f + 32.0f;
          if (f < proflame_query::SETPOINT_MIN_F - 0.5f || f > proflame_query::SETPOINT_MAX_F + 0.5f) {
            id(cmd_result).publish_state("Rejected: target out of range (41-95 F)");
            return;
          }
          id(tstat_target_f) = roundf(f * 2.0f) / 2.0f;
          id(publish_climate).execute();
          if (id(tstat_mode) > 0) id(tstat_eval).execute();

select:
  - platform: template
    id: mode_select
    name: Mode
    icon: mdi:thermostat
    options: ["Off", "Manual", "Thermostat", "Smart"]
    set_action:
      - lambda: |-
          int m = x == "Off" ? 0 : x == "Manual" ? 1 : x == "Thermostat" ? 2 : x == "Smart" ? 3 : -1;
          if (m < 0) return;
          id(tstat_mode) = 0;
          if (m == 0) { id(request_off).execute(); return; }
          id(apply_cmd).execute(-1, m, -1, -1, -1, -1, -1, -1, -1);
  - platform: template
    id: pilot_select
    name: Pilot
    icon: mdi:candle
    options: ["Intermittent", "Continuous"]
    set_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, -1, -1, x == "Continuous" ? 1 : 0, -1, -1, -1);'

number:
  - platform: template
    id: flame_height
    name: Flame Height
    icon: mdi:fire
    min_value: 0
    max_value: 6
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          if (static_cast<int>(x) == 0) {
            id(tstat_mode) = 0;
            id(publish_climate).execute();
            id(request_off).execute();  // retried until verified off
            return;
          }
          id(apply_cmd).execute(-1, -1, static_cast<int>(x), -1, -1, -1, -1, -1, -1);
  - platform: template
    id: fan_speed
    name: Fan Speed
    icon: mdi:fan
    min_value: 0
    max_value: 6
    step: 1
    mode: slider
    set_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, static_cast<int>(x), -1, -1, -1, -1, -1);'
  # IFC lamp (night light) output, 0-6. Accepted by the IFC but nothing is
  # connected to it on this fireplace, so it is hidden by default.
  - platform: template
    id: light_brightness
    name: Lamp Output Level (unused)
    icon: mdi:lightbulb-outline
    entity_category: config
    disabled_by_default: true
    min_value: 0
    max_value: 6
    step: 1
    mode: slider
    set_action:
      - lambda: 'id(apply_cmd).execute(-1, -1, -1, -1, static_cast<int>(x), -1, -1, -1, -1);'

button:
  # Diagnostic: one GET (read-only, 0x5E) per register 0x00-0x3F, logged as hex.
  # Used to look for undocumented registers such as room/target temperature.
  - platform: template
    name: Scan IFC Registers
    icon: mdi:magnify
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return !id(apply_cmd).is_running() && !id(scan_regs).is_running();'
          then:
            - script.execute: scan_regs
  - platform: template
    name: Request Control
    icon: mdi:hand-back-right
    entity_category: config
    on_press:
      - lambda: |-
          if (id(apply_cmd).is_running() || id(poll_ifc).is_running()) return;
          id(control_request_result).publish_state("Waiting for reply");
          id(ifc_uart).write_array(proflame_query::REQUEST_CONTROL, sizeof(proflame_query::REQUEST_CONTROL));

script:
  - id: scan_regs
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return !id(poll_ifc).is_running();'
          timeout: 2s
      - lambda: 'ESP_LOGI("scan", "Register scan start (GET only)");'
      - repeat:
          count: 64
          then:
            - lambda: |-
                const uint8_t reg = static_cast<uint8_t>(iteration);
                uint8_t f[6] = {0x5E, 0x00, 0x00, 0x00, reg, 0};
                f[5] = f[0] ^ f[1] ^ f[2] ^ f[3] ^ f[4];
                ESP_LOGI("scan", "GET reg 0x%02X", reg);
                id(ifc_uart).write_array(f, 6);
            - delay: 300ms
      - lambda: 'ESP_LOGI("scan", "Register scan done");'
  # GET control, state 1, state 2, then control again. State is committed only
  # if both control checks say UART. Trailing delay lets the last reply land.
  - id: poll_ifc
    mode: single
    then:
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_CONTROL, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_STATE1, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_STATE2, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_CONTROL, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_SETPOINT, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_ROOM_TEMP, 6);'
      - delay: 200ms

  # ESP32 thermostat decision. Runs every 30 s and on preset/target changes.
  # Heats with Manual mode at the stored flame (Smart: flame scales with how
  # far the room is below target). Turns off immediately if the room
  # temperature or the Home Assistant connection is lost.
  - id: tstat_eval
    mode: single
    then:
      - lambda: |-
          if (id(tstat_mode) == 0) { id(tstat_status) = id(tstat_status) == "Starting" ? "Inactive" : id(tstat_status); id(tstat_heating) = false; return; }
          if (id(apply_cmd).is_running()) return;
          if (!id(have_state)) { id(tstat_status) = "Waiting for fireplace state"; return; }
          if (id(remote_in_control)) { id(tstat_status) = "Paused: remote in control"; return; }
          const float room = id(ha_room_temp_f).state;
          // B4: only a Home Assistant state subscription counts as connected.
          const bool have_temp = api::global_api_server != nullptr &&
                                 api::global_api_server->is_connected_with_state_subscription() && !std::isnan(room);
          const float target = id(tstat_target_f);
          const uint32_t now = millis();
          const bool burning = id(cl_burning);  // verified IFC state
          id(tstat_heating) = burning;
          // B2: min cycle measured from the last CONFIRMED on/off transition.
          const bool cycle_ok = !id(tstat_switched) || (now - id(tstat_switch_ms)) >= 5u * 60u * 1000u;
          const bool recent_cmd = id(tstat_expect) >= 0 && (now - id(tstat_cmd_ms)) < 20000u;

          // Our last command didn't take effect.
          if (id(tstat_expect) >= 0 && !recent_cmd && (id(tstat_expect) == 1) != burning) {
            if (id(tstat_expect) == 1) {
              // Ignition didn't happen (rejected, lockout, or changed outside
              // the thermostat): cancel rather than retry forever.
              id(tstat_mode) = 0;
              id(tstat_expect) = -1;
              id(tstat_status) = "Cancelled: fireplace did not turn on";
              id(publish_climate).execute();
              return;
            }
            // Off didn't take effect: keep retrying off (safe direction).
            id(pending_off) = true;
          }

          bool want = burning;
          if (!have_temp) {
            want = false;  // fail safe: no temperature, no flame
          } else if (room <= target - 0.5f) {
            want = true;
          } else if (room >= target + 0.5f) {
            want = false;
          }
          int flame = id(stored_flame) > 0 ? id(stored_flame) : 1;
          if (id(tstat_mode) == 2 && have_temp) {
            int smart = 1 + static_cast<int>(target - room);  // +1 level per degree below
            if (smart > flame) smart = flame;
            if (smart < 1) smart = 1;
            flame = smart;
          }
          // Turning OFF is never held back once the min on-time has passed,
          // and is immediate when the temperature is lost.
          const bool may_switch = want ? cycle_ok : (cycle_ok || !have_temp);
          const int aux = id(light_follows).state ? 1 : -1;  // light stays on while active
          if (want != burning && may_switch && !recent_cmd) {
            id(tstat_expect) = want ? 1 : 0;
            id(tstat_cmd_ms) = now;
            id(tstat_flame) = want ? flame : 0;
            if (want) id(apply_cmd).execute(-1, 1, flame, -1, -1, -1, aux, -1, -1);
            else id(apply_cmd).execute(-1, 0, -1, -1, -1, -1, aux, -1, -1);
          } else if (want && burning && id(tstat_mode) == 2 && flame != id(tstat_flame) && !recent_cmd &&
                     (now - id(tstat_cmd_ms)) >= 5u * 60u * 1000u) {
            id(tstat_flame) = flame;
            id(tstat_cmd_ms) = now;
            id(apply_cmd).execute(-1, -1, flame, -1, -1, -1, -1, -1, -1);
          }
          char msg[72];
          if (!have_temp) snprintf(msg, sizeof(msg), "Off: room temperature unavailable");
          else snprintf(msg, sizeof(msg), "%s: room %.1f F, target %.1f F%s",
                        burning ? "Heating" : "Idle", room, target,
                        (want != burning && !may_switch) ? " (min cycle wait)" : "");
          id(tstat_status) = msg;
          id(publish_climate).execute();

  # B1: turn off now, or remember to retry if a command is running.
  - id: request_off
    mode: single
    then:
      - lambda: |-
          id(tstat_expect) = -1;
          if (id(apply_cmd).is_running()) { id(pending_off) = true; return; }
          id(pending_off) = true;  // cleared when verified state shows off
          id(apply_cmd).execute(-1, 0, -1, -1, -1, -1, id(light_follows).state ? 0 : -1, -1, -1);

  - id: publish_climate
    mode: queued
    max_runs: 3
    then:
      - climate.template.publish:
          id: fireplace_climate
          mode: !lambda 'return (id(tstat_mode) > 0 || id(cl_burning)) ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF;'
          custom_preset: !lambda |-
            if (id(tstat_mode) == 1) return std::string("Thermostat");
            if (id(tstat_mode) == 2) return std::string("Smart");
            return id(cl_preset);
          action: !lambda |-
            if (id(tstat_mode) > 0) return id(tstat_heating) ? climate::CLIMATE_ACTION_HEATING : climate::CLIMATE_ACTION_IDLE;
            return id(cl_burning) ? climate::CLIMATE_ACTION_HEATING : climate::CLIMATE_ACTION_OFF;
          target_temperature: !lambda 'return (id(tstat_target_f) - 32.0f) * 5.0f / 9.0f;'

  # One user command. Parameters: -1 = leave unchanged.
  # p_power: 1 = power on (stored mode; stored flame if flame is 0).
  - id: apply_cmd
    mode: single
    parameters:
      p_power: int
      p_mode: int
      p_flame: int
      p_fan: int
      p_light: int
      p_pilot: int
      p_aux: int
      p_split: int
      p_setpoint: int
    then:
      - wait_until:
          condition:
            lambda: 'return !id(poll_ifc).is_running() && !id(scan_regs).is_running();'
          timeout: 2s
      - if:
          condition:
            lambda: 'return id(poll_ifc).is_running() || id(scan_regs).is_running();'
          then:
            - lambda: 'id(cmd_result).publish_state("Rejected: busy, try again");'
            - script.stop: apply_cmd
      - lambda: |-
          id(cmd_ok) = false;
          id(new_sp) = -1;
          id(cmd_result).publish_state("Working");
          if (id(remote_in_control)) {
            ESP_LOGI("proflame", "Command: requesting control once");
            id(control_request_result).publish_state("Waiting for reply");
            id(ifc_uart).write_array(proflame_query::REQUEST_CONTROL, 6);
          }
      - delay: 300ms
      - lambda: |-
          // Fresh read for this command only.
          id(ctl_seen) = false;
          id(state_seen) = false;
          id(ifc_uart).write_array(proflame_query::GET_CONTROL, 6);
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_STATE1, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_STATE2, 6);'
      - delay: 250ms
      - lambda: 'id(ifc_uart).write_array(proflame_query::GET_CONTROL, 6);'
      - delay: 250ms
      - lambda: |-
          if (!id(ctl_seen) || id(remote_in_control)) {
            id(cmd_result).publish_state("Rejected: remote has control (turn off with remote, then retry)");
            ESP_LOGW("proflame", "Command rejected: no verified UART control");
            return;
          }
          if (!id(state_seen) || !id(have_state)) {
            id(cmd_result).publish_state("Rejected: could not read current state");
            ESP_LOGW("proflame", "Command rejected: no fresh verified state");
            return;
          }
          const uint8_t cur1 = id(s1_byte), cur2 = id(s2_byte);
          const proflame_query::Reply r1{proflame_query::REG_STATE1, {0, cur1, 0}};
          const proflame_query::Reply r2{proflame_query::REG_STATE2, {0, cur2, 0}};
          const auto s1 = proflame_query::decode_state1(r1);
          const auto s2 = proflame_query::decode_state2(r2);
          uint8_t b1 = cur1, b2 = cur2;
          int mode = s1.mode, flame = s2.flame;

          if (p_power == 1) {
            mode = id(stored_mode);
            b1 = proflame_query::with_mode(b1, mode);
            if (flame == 0) b2 = proflame_query::with_flame(b2, id(stored_flame));
          }
          if (p_mode >= 0) {
            b1 = proflame_query::with_mode(b1, p_mode);
            if (p_mode == 1 && flame == 0) b2 = proflame_query::with_flame(b2, id(stored_flame));
          }
          if (p_flame >= 0) {
            b2 = proflame_query::with_flame(b2, p_flame);
            // As in the original integration: a nonzero flame while off turns it on.
            if (p_flame > 0 && (b1 & 0x03) == 0) b1 = proflame_query::with_mode(b1, id(stored_mode) == 2 ? 2 : 1);
          }
          if (p_fan >= 0) b2 = proflame_query::with_fan(b2, p_fan);
          if (p_light >= 0) b1 = proflame_query::with_light(b1, p_light);
          if (p_pilot >= 0) b1 = proflame_query::with_pilot(b1, p_pilot == 1);
          if (p_aux >= 0) b2 = proflame_query::with_aux(b2, p_aux == 1);
          if (p_split >= 0) b2 = proflame_query::with_split(b2, p_split == 1);

          // Light (AUX relay) follows the fireplace when enabled: if this command
          // turns the fireplace on or off and doesn't set AUX itself, AUX is
          // switched in the same state-2 write.
          if (id(light_follows).state && p_aux < 0) {
            auto on = [](uint8_t m1, uint8_t m2) {
              const int m = m1 & 0x03;
              return m != 0 && !(m == 1 && (m2 & 0x07) == 0);
            };
            const bool was_on = on(cur1, cur2);
            const bool now_on = on(b1, b2);
            if (was_on != now_on) b2 = proflame_query::with_aux(b2, now_on);
          }
          id(new_s1) = b1;
          id(new_s2) = b2;
          id(send_s1) = b1 != cur1;
          id(send_s2) = b2 != cur2;
          if (p_setpoint >= 0 && !(id(sp_valid) && p_setpoint == id(sp_f))) id(new_sp) = p_setpoint;
          if (!id(send_s1) && !id(send_s2) && id(new_sp) < 0) {
            id(cmd_result).publish_state("No change needed");
            return;
          }
          id(cmd_ok) = true;
          ESP_LOGI("proflame", "Command: state1 %02X->%02X%s, state2 %02X->%02X%s",
                   cur1, b1, id(send_s1) ? "" : " (unchanged)",
                   cur2, b2, id(send_s2) ? "" : " (unchanged)");
          // Flame/fan first, then mode, matching the documented app sequence.
          if (id(send_s2)) {
            uint8_t f[6];
            if (proflame_query::build_set(proflame_query::REG_STATE2, b2, f)) id(ifc_uart).write_array(f, 6);
          }
      - delay: 250ms
      - lambda: |-
          if (!id(cmd_ok) || !id(send_s1)) return;
          uint8_t f[6];
          if (proflame_query::build_set(proflame_query::REG_STATE1, id(new_s1), f)) id(ifc_uart).write_array(f, 6);
      - delay: 250ms
      - lambda: |-
          if (!id(cmd_ok) || id(new_sp) < 0) return;
          uint8_t f[6];
          if (proflame_query::build_setpoint(id(new_sp), f)) {
            ESP_LOGI("proflame", "Command: setpoint %d F", id(new_sp));
            id(ifc_uart).write_array(f, 6);
          } else {
            id(new_sp) = -1;
          }
      - delay: 400ms
      # Read-back confirmation, same verified sequence.
      - lambda: |-
          if (!id(cmd_ok)) return;
          id(ctl_seen) = false;
          id(state_seen) = false;
          id(ifc_uart).write_array(proflame_query::GET_CONTROL, 6);
      - delay: 250ms
      - lambda: 'if (id(cmd_ok)) id(ifc_uart).write_array(proflame_query::GET_STATE1, 6);'
      - delay: 250ms
      - lambda: 'if (id(cmd_ok)) id(ifc_uart).write_array(proflame_query::GET_STATE2, 6);'
      - delay: 250ms
      - lambda: 'if (id(cmd_ok)) id(ifc_uart).write_array(proflame_query::GET_CONTROL, 6);'
      - delay: 250ms
      - lambda: |-
          if (!id(cmd_ok)) return;
          id(sp_seen) = false;
          id(ifc_uart).write_array(proflame_query::GET_SETPOINT, 6);
      - delay: 250ms
      - lambda: |-
          if (!id(cmd_ok)) return;
          const bool sp_ok = id(new_sp) < 0 || (id(sp_seen) && id(sp_f) == id(new_sp));
          if (!sp_ok) {
            char m2[64];
            snprintf(m2, sizeof(m2), "Setpoint not confirmed: read %d F, wanted %d F", id(sp_f), id(new_sp));
            id(cmd_result).publish_state(m2);
            ESP_LOGW("proflame", "%s", m2);
            return;
          }
          const uint8_t mask1 = 0xF3;  // compare documented state-1 bits only
          if (id(state_seen) && (id(s1_byte) & mask1) == (id(new_s1) & mask1) && id(s2_byte) == id(new_s2)) {
            id(cmd_result).publish_state("Confirmed by read-back");
            ESP_LOGI("proflame", "Command confirmed by read-back");
          } else {
            char msg[72];
            snprintf(msg, sizeof(msg), "Not confirmed: read %02X/%02X%s, wanted %02X/%02X",
                     id(s1_byte), id(s2_byte), id(state_seen) ? "" : " (no fresh read)",
                     id(new_s1), id(new_s2));
            id(cmd_result).publish_state(msg);
            ESP_LOGW("proflame", "%s", msg);
          }

interval:
  - interval: 30s
    then:
      - script.execute: tstat_eval
  - interval: 5s
    then:
      - lambda: |-
          if (id(pending_off) && id(have_state) && !id(cl_burning) && !id(apply_cmd).is_running()) id(pending_off) = false;
          if (id(pending_off) && !id(apply_cmd).is_running() && !id(poll_ifc).is_running() &&
              !id(scan_regs).is_running() && !id(remote_in_control)) {
            ESP_LOGW("proflame", "Retrying pending OFF");
            id(apply_cmd).execute(-1, 0, -1, -1, -1, -1, id(light_follows).state ? 0 : -1, -1, -1);
            return;
          }
          if (!id(apply_cmd).is_running() && !id(scan_regs).is_running()) id(poll_ifc).execute();
          const bool fresh = id(link_seen) && (millis() - id(last_reply_ms)) < 15000;
          if (fresh) { id(stale_published) = false; return; }
          if (!id(link_seen) || id(stale_published)) return;
          id(stale_published) = true;
          ESP_LOGW("proflame", "No valid IFC reply for 15 s; marking state unknown");
          id(have_state) = false;
          id(last_ctl_uart) = false;
          id(flame_height).publish_state(NAN);
          id(fan_speed).publish_state(NAN);
          id(light_brightness).publish_state(NAN);
          id(fireplace_status).publish_state("Unknown (no IFC reply)");
          id(ifc_control).publish_state("Unknown (no IFC reply)");
