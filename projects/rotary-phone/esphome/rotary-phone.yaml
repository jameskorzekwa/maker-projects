esphome:
  name: rotary-phone
  friendly_name: Rotary Phone Guestbook
  comment: Temporary handset earpiece and hook-switch test

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
    advanced:
      # The guestbook recorder needs opendir, rename, and unlink on the card.
      disable_vfs_support_dir: false

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: components
    components: [sd_card_test, wm8960_audio_test]

i2c:
  id: codec_bus
  sda: GPIO22
  scl: GPIO23
  scan: true
  frequency: 100kHz

wm8960_audio_test:
  id: codec_audio_test
  i2c_id: codec_bus
  address: 0x1A
  bclk_pin: 0
  lrclk_pin: 1
  adc_pin: 2
  dac_pin: 16
  output: headphone

sd_card_test:
  clk_pin: 19
  miso_pin: 20
  mosi_pin: 18
  cs_pin: 21

interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("hook_test", "HOOK STATE: %s", id(hook_switch).state ? "LIFTED" : "ON CRADLE");

binary_sensor:
  - platform: gpio
    id: hook_switch
    internal: true
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 150ms
      - delayed_off: 150ms
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("hook_test", "HOOK EVENT: handset lifted");
    on_release:
      then:
        - lambda: |-
            ESP_LOGI("hook_test", "HOOK EVENT: handset placed on cradle");
