esphome:
  name: rotary-phone
  friendly_name: Rotary Phone Guestbook
  comment: Temporary handset earpiece and hook-switch test

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
    advanced:
      # The guestbook recorder needs opendir, rename, and unlink on the card.
      disable_vfs_support_dir: false

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# The live configuration adds wifi, api, ota and captive_portal blocks that are kept out of the
# repository because they carry credentials. One setting there is not optional and must survive
# any rebuild of that config:
#
#   wifi:
#     power_save_mode: none
#
# Without it the radio takes a modem sleep, and pm_sleep -> esp_phy_disable -> the temperature
# sensor read stalls long enough to trip the interrupt watchdog. The device reboots, and because
# the template text sensor below does not restore across a boot, the message that had just been
# saved is never announced to Home Assistant. The recording survives on the card; the
# notification does not.

external_components:
  - source:
      type: local
      path: components
    components: [sd_card_test, wm8960_audio_test]

i2c:
  id: codec_bus
  sda: GPIO22
  scl: GPIO23
  scan: true
  frequency: 100kHz

wm8960_audio_test:
  id: codec_audio_test
  i2c_id: codec_bus
  address: 0x1A
  bclk_pin: 0
  lrclk_pin: 1
  adc_pin: 2
  dac_pin: 16
  output: headphone

sd_card_test:
  clk_pin: 19
  miso_pin: 20
  mosi_pin: 18
  cs_pin: 21

text_sensor:
  - platform: template
    name: "Last Message"
    icon: "mdi:phone-voip"
    update_interval: 5s
    lambda: |-
      auto url = id(codec_audio_test).get_last_message_url();
      if (url.empty())
        return {};
      return url;

interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("hook_test", "HOOK STATE: %s", id(hook_switch).state ? "LIFTED" : "ON CRADLE");

binary_sensor:
  - platform: gpio
    id: hook_switch
    internal: true
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 150ms
      - delayed_off: 150ms
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("hook_test", "HOOK EVENT: handset lifted");
    on_release:
      then:
        - lambda: |-
            ESP_LOGI("hook_test", "HOOK EVENT: handset placed on cradle");
