esphome:
  name: rotary-phone
  friendly_name: Rotary Phone Guestbook
  comment: Temporary stock record/playback test for the WM8960 Audio HAT

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: components
    components: [wm8960_audio_test]

interval:
  - interval: 5s
    then:
      - logger.log: "Rotary phone audio test heartbeat"

i2c:
  id: codec_bus
  sda: GPIO22
  scl: GPIO23
  scan: true
  frequency: 100kHz

wm8960_audio_test:
  id: codec_audio_test
  i2c_id: codec_bus
  address: 0x1A
  bclk_pin: 0
  lrclk_pin: 1
  adc_pin: 2
  dac_pin: 16
