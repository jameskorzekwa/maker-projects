esphome:
  name: rotary-phone
  friendly_name: Rotary Phone Guestbook
  comment: Temporary hook-switch input and debounce test

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("hook_test", "HOOK STATE: %s", id(hook_switch).state ? "LIFTED" : "ON CRADLE");

binary_sensor:
  - platform: gpio
    id: hook_switch
    internal: true
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 150ms
      - delayed_off: 150ms
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("hook_test", "HOOK EVENT: handset lifted");
    on_release:
      then:
        - lambda: |-
            ESP_LOGI("hook_test", "HOOK EVENT: handset placed on cradle");
