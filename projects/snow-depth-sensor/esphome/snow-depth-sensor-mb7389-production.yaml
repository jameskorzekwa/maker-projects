# Prepared short-wake firmware; deployment requires separate owner approval.
esphome:
  name: snow-depth-sensor
  friendly_name: snow-depth-sensor
  includes:
    - wake_policy.h
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: ota_mode_switch
          then:
            - deep_sleep.prevent: deep_sleep_control
      - lambda: snow::policy().start(millis());
      # Power the MB7389 through the Pololu #2810. The parser rejects the
      # first 3 seconds, then collects five valid frames (~6 Hz).
      - output.turn_on: maxbotix_power_enable
      # Initialize the charge-complete latch from the instantaneous DONE state.
      - lambda: id(charge_complete_latch).publish_state(id(done_raw).state);

# Save maintenance-mode changes immediately; the normal 1-minute deferred
# preference write would outlive a short wake. Only switch changes write.
preferences:
  flash_write_interval: 0s

interval:
  - interval: 100ms
    then:
      - lambda: |-
          snow::policy().observe_connection(
              millis(), id(api_server).is_connected_with_state_subscription());
      - if:
          condition:
            lambda: return snow::policy().should_sleep(millis(), id(ota_mode_switch).state);
          then:
            # Explicit entry bypasses deep_sleep.prevent, so EVERY entry
            # must pass the maintenance/upload policy above.
            - output.turn_off: maxbotix_power_enable
            - deep_sleep.enter: deep_sleep_control

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Production logging: warnings/errors remain available over the API, while
# serial formatting/transmission is disabled to reduce awake-time overhead.
logger:
  level: WARN
  baud_rate: 0

# Enable Home Assistant API
api:
  id: api_server
  encryption:
    key: !secret snow_depth_sensor_api_encryption_key

ota:
  - platform: esphome
    password: !secret snow_depth_sensor_ota_password
    on_begin:
      then:
        - lambda: snow::policy().ota_begin();
        - deep_sleep.prevent: deep_sleep_control
    on_end:
      then:
        - lambda: snow::policy().ota_finished(millis());
    on_error:
      then:
        - lambda: snow::policy().ota_finished(millis());

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: HIGH

# MB7389 free-running TTL serial input (verified 2026-07-22: pin 5 idles
# HIGH ~5 V = true TTL, standard non-inverted UART; 10k/20k divider to 3.3 V).
# The debug hook is the frame parser: dummy_receiver consumes the bytes and
# the sequence lambda decodes each "Rdddd\r" frame (dddd = mm; 5000 = no
# target). The hook fires regardless of log level.
uart:
  id: uart_a
  rx_pin: GPIO32
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: RX
    dummy_receiver: true
    debug_prefix: "[MB7389 UART] "
    after:
      delimiter: "\r"
    sequence:
      - lambda: |-
          for (size_t i = 0; i + 6 <= bytes.size(); i++) {
            if (bytes[i] != 'R' || bytes[i + 5] != '\r')
              continue;
            bool digits_ok = true;
            for (int j = 1; j <= 4; j++) {
              if (bytes[i + j] < '0' || bytes[i + j] > '9') { digits_ok = false; break; }
            }
            if (!digits_ok)
              continue;
            const int mm = (bytes[i + 1] - '0') * 1000
                         + (bytes[i + 2] - '0') * 100
                         + (bytes[i + 3] - '0') * 10
                         + (bytes[i + 4] - '0');
            if (!snow::policy().accept_distance(millis(), mm)) {
              // 300 = min-range clamp boundary, 5000 = no target detected.
              i += 5;
              continue;
            }
            id(a02yyuw_distance).publish_state((float) mm);
            i += 5;
          }

# GPIO26 drives the Pololu #2810 ON pin, switching MB7389 power. The 100k
# pulldown turns the sensor off when the ESP32 deep-sleeps.
output:
  - platform: gpio
    pin: GPIO26
    id: maxbotix_power_enable

# WatangTech MPPT board charge-status taps, wired through 10 kOhm series
# resistors to the reclaimed ATOM Echo audio pins (G19/G22 drive only the
# unused NS4168 amplifier inputs; speaker removed). Signals are open-drain
# from the CN3791 charger: active low. They update during wake windows; HA
# holds the last state through deep sleep.
binary_sensor:
  - platform: gpio
    name: "Snow Sensor Charging"
    device_class: battery_charging
    pin:
      number: GPIO19
      mode:
        input: true
        pullup: true
      inverted: true

  # Raw DONE signal (blips briefly during top-off cycles; not exposed).
  - platform: gpio
    id: done_raw
    internal: true
    pin:
      number: GPIO22
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - binary_sensor.template.publish:
            id: charge_complete_latch
            state: ON

  # Latched per wake window: ON if DONE asserted at any point since boot.
  # A short wake can miss a DONE blip: OFF is not proof of incomplete charge.
  # HA holds the last observation through deep sleep.
  - platform: template
    id: charge_complete_latch
    name: "Snow Sensor Charge Complete"
    icon: "mdi:battery-check"

switch:
  # Persistent device-owned maintenance mode. Fast connections offer at least
  # 5 seconds to enable it (30s deadline still applies to late connections).
  # It remains on across reboots.
  - platform: template
    name: "Snow Sensor OTA Mode"
    id: ota_mode_switch
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - deep_sleep.prevent: deep_sleep_control
    turn_off_action:
      - deep_sleep.allow: deep_sleep_control

deep_sleep:
  id: deep_sleep_control
  # No automatic run timer: all entries use the guarded policy above.
  sleep_duration: 15min

sensor:
  # MB7389 distance, published by the UART parser above. The A02YYUW name and
  # ID are intentionally preserved so the existing Home Assistant entity,
  # history, and snow-depth helpers survive the conversion.
  - platform: template
    name: "A02YYUW Distance"
    id: a02yyuw_distance
    unit_of_measurement: "in"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    force_update: true
    filters:
      # Parser publishes millimeters; convert to inches natively.
      - multiply: 0.0393700787
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: snow::policy().distance_published(millis());
        - output.turn_off: maxbotix_power_enable

  # Battery voltage via the WatangTech VBAT port through a 100k/100k divider
  # into GPIO33 (ADC1_CH5, reclaimed audio pin). The MAX17043 fuel gauge was
  # removed 2026-07-24. Names match the old entities so HA history survives.
  # Calibration: compare against a multimeter and adjust the multiply factor.
  - platform: adc
    pin: GPIO33
    id: vbat_adc
    name: "Snow Sensor Battery Voltage"
    attenuation: 12db
    samples: 16
    update_interval: 250ms
    accuracy_decimals: 2
    filters:
      # Stop processing after the first fresh, filtered batch this boot.
      - lambda: |-
          if (snow::policy().battery_ready()) return {};
          return x;
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: snow::policy().battery_published(millis(), std::isfinite(x));

  # The old curve measured a degraded ~400mAh cell, not the replacement pair
  # of 3100mAh cold-tolerant cells. Preserve the entity but report unknown
  # until a new pack/load/temperature calibration exists. Voltage remains real.
  - platform: copy
    source_id: vbat_adc
    name: "Snow Sensor Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - lambda: return NAN;
